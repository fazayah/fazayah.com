<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisab Calculator</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the calculator is the hero. A printing-calculator paper tape sits beside the keys; every other tool is a quiet worksheet. */
:root{
  --bg:#edf0f6; --surface:#ffffff; --surface-2:#e1e7f1; --ink:#121a2f; --muted:#56617e; --line:#cbd3e2;
  --accent:#f4502a; --accent-ink:#ffffff; --fn:#0b7480; --s3:#6a4df0; --tape:#fffdf6;
  --display:"Bricolage Grotesque","IBM Plex Sans Arabic","IBM Plex Sans Devanagari",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic","IBM Plex Sans Devanagari",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:#141b30; --surface-2:#1f2a45; --ink:#eef1f9; --muted:#98a3c0; --line:#2c3757;
    --accent:#ff6a45; --accent-ink:#1a0d08; --fn:#56d3db; --s3:#a593ff; --tape:#19213a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#141b30; --surface-2:#1f2a45; --ink:#eef1f9; --muted:#98a3c0; --line:#2c3757;
  --accent:#ff6a45; --accent-ink:#1a0d08; --fn:#56d3db; --s3:#a593ff; --tape:#19213a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 56px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark i{display:block;width:18px;height:4px;border-radius:2px;background:var(--accent-ink);box-shadow:0 8px 0 var(--accent-ink);transform:translateY(-4px)}
h1{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1;margin:0;letter-spacing:-.02em}
.tag{margin:4px 0 0;color:var(--muted);font-size:.875rem}
.langbox{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--muted)}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.langbox select{width:auto}
:focus-visible{outline:3px solid var(--fn);outline-offset:2px}
nav{overflow-x:auto;margin:0 -16px;padding:4px 16px 12px}
nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0;width:max-content}
nav a{display:block;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.9375rem;border:1px solid transparent;white-space:nowrap}
nav a:hover{border-color:var(--line);color:var(--ink)}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
section[data-view]{display:none}
section[data-view].on{display:block}
h2{font-family:var(--display);font-weight:700;font-size:1.375rem;letter-spacing:-.01em;margin:8px 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:500;font-size:1.0625rem;margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:65ch;font-size:.9375rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:12px}
label{display:grid;gap:4px;font-size:.8125rem;color:var(--muted);font-weight:500}
.ltr{direction:ltr;text-align:left}
input.ltr,textarea.ltr{font-family:var(--mono);font-size:.9375rem}
.out{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:.9375rem}
.out dt{color:var(--muted)}
.out dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;text-align:end;overflow-wrap:anywhere}
.big{font-family:var(--mono);font-size:1.5rem;font-weight:500;direction:ltr;overflow-wrap:anywhere;margin:4px 0 0}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* calculator */
.calc{display:grid;gap:16px;grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}
@media (max-width:760px){.calc{grid-template-columns:minmax(0,1fr)}}
.machine{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:10px}
.screen{background:var(--tape);border:1px solid var(--line);border-radius:14px;padding:12px 14px;direction:ltr;min-height:112px;display:grid;align-content:end;gap:2px}
.flags{display:flex;gap:8px;font-family:var(--mono);font-size:.6875rem;color:var(--muted);letter-spacing:.06em;min-height:16px}
.flags b{color:var(--fn);font-weight:500}
#expr{font-family:var(--mono);font-size:1.75rem;font-weight:500;text-align:right;white-space:nowrap;overflow-x:auto;scrollbar-width:none;min-height:2.6rem;line-height:2.6rem}
#expr::-webkit-scrollbar{display:none}
#live{font-family:var(--mono);font-size:1rem;color:var(--muted);text-align:right;min-height:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#live.bad{color:var(--accent)}
.keys{display:grid;gap:7px;direction:ltr}
.keys.sci{grid-template-columns:repeat(5,1fr)}
.keys.main{grid-template-columns:repeat(4,1fr)}
.k{border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:50px;cursor:pointer;font-family:var(--mono);font-size:1.125rem;font-weight:500;padding:0;transition:transform .06s}
.keys.sci .k{min-height:42px;font-size:.875rem;background:var(--surface-2);color:var(--fn)}
.k:active{transform:scale(.95)}
.k.op{background:var(--surface-2)}
.k.eq{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:1.375rem}
.k.on{background:var(--fn);color:var(--surface);border-color:transparent}
@media (prefers-reduced-motion:reduce){.k{transition:none}}
.tapecard{background:var(--tape);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative}
.tapecard::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;border-bottom:2px dashed var(--line)}
.tapehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
#tape{list-style:none;margin:0;padding:0;direction:ltr;max-height:520px;overflow-y:auto}
#tape li{border-top:1px dashed var(--line)}
#tape button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 0;cursor:pointer;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
#tape button:focus-visible{outline:3px solid var(--fn)}
#tape .e{display:block;color:var(--muted);font-size:.8125rem;overflow-wrap:anywhere}
#tape .r{display:block;font-size:1.125rem;font-weight:500;overflow-wrap:anywhere}
#tape .x{font-family:var(--body);font-size:.6875rem;color:var(--fn);border:1px solid var(--fn);border-radius:999px;padding:0 6px;margin-right:6px;vertical-align:middle}

/* graph */
.plot{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
canvas{display:block;width:100%;height:340px;touch-action:none;cursor:grab}
.fx{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;direction:ltr;font-family:var(--mono);font-size:.875rem}
.fx span{display:inline-flex;align-items:center;gap:6px}
.fx span::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}

/* matrix */
.mx{display:grid;gap:6px;direction:ltr}
.mx input{text-align:center;padding:8px 4px;font-family:var(--mono)}
pre{font-family:var(--mono);font-size:.875rem;margin:0;direction:ltr;text-align:left;overflow-x:auto;white-space:pre}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:.875rem;direction:ltr}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}

/* pricing */
.plans{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:stretch}
.plan{display:grid;gap:10px;align-content:start}
.plan.hot{border:2px solid var(--accent)}
.price{font-family:var(--display);font-weight:700;font-size:2.25rem;line-height:1;direction:ltr;unicode-bidi:isolate}
.per{color:var(--muted);font-size:.875rem}
.plan ul{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:.9375rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-bottom:16px}
.seg button{border:0;background:none;padding:6px 16px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#toast{min-height:1.5rem;margin-top:12px;color:var(--fn);font-weight:500}

/* manual */
.man{display:grid;gap:14px;max-width:70ch}
.man p{margin:0 0 8px}
.man ol{counter-reset:m;list-style:none;padding:0;margin:0;display:grid;gap:14px}
.man li{counter-increment:m}
.man h3::before{content:counter(m) ". ";color:var(--accent);font-family:var(--mono)}
code{font-family:var(--mono);font-size:.875rem;background:var(--surface-2);border-radius:6px;padding:6px 8px;display:block;direction:ltr;text-align:left;overflow-x:auto;white-space:pre-wrap;margin:0 0 8px}
[hidden]{display:none!important}
.pb{font-family:var(--mono);font-size:.625rem;letter-spacing:.06em;margin-inline-start:6px;padding:1px 6px;border-radius:999px;border:1px solid currentColor;vertical-align:middle;font-weight:500}
.lockcard{max-width:560px;margin-top:8px;display:grid;gap:12px}
footer{margin-top:32px;color:var(--muted);font-size:.8125rem}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i></div>
    <div><h1>Hisab</h1><p class="tag" data-i18n="tag"></p></div>
  </div>
  <label class="langbox" for="lang" style="display:flex"><span data-i18n="lang"></span>
    <select id="lang">
      <option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option>
      <option value="es">Español</option><option value="ur">اردو</option><option value="hi">हिन्दी</option><option value="tr">Türkçe</option><option value="zh">中文</option>
    </select>
  </label>
</header>
<nav aria-label="Tools"><ul id="nav"></ul></nav>

<main>
<div class="card lockcard" id="lock" hidden><span class="per" data-i18n="pro_tool"></span><h2 style="margin:0"><span id="lockT"></span><b class="pb">PRO</b></h2><p class="sub" style="margin:0" data-i18n="lock_msg"></p><div class="row"><button type="button" class="btn pri" id="unlockBtn" data-i18n="unlock"></button><a class="btn" href="#pricing" style="text-decoration:none" data-i18n="see_plans"></a></div></div>
<section data-view="calculator">
  <div class="calc">
    <div class="machine">
      <div class="screen">
        <div class="flags"><b id="fDeg">DEG</b><b id="f2nd"></b><span id="fMem"></span></div>
        <div id="expr" aria-live="polite"></div>
        <div id="live"></div>
      </div>
      <div class="keys sci" id="sci"></div>
      <div class="keys main" id="mainkeys"></div>
    </div>
    <div class="tapecard">
      <div class="tapehead"><h3 style="margin:0" data-i18n="tape"></h3>
        <div class="row"><button class="btn" id="copyBtn" type="button" data-i18n="copy"></button><button class="btn" id="clearTape" type="button" data-i18n="clear"></button></div></div>
      <ol id="tape"></ol>
    </div>
  </div>
</section>

<section data-view="graph">
  <h2 data-i18n="g_title"></h2><p class="sub" data-i18n="g_hint"></p>
  <div class="grid g2">
    <div class="card grid" style="align-content:start">
      <div class="fx"><span style="--c:var(--accent)">f(x) =</span><input class="ltr" type="text" id="f1" value="sin(x)·x" autocapitalize="off" spellcheck="false"></div>
      <div class="fx"><span style="--c:var(--fn)">g(x) =</span><input class="ltr" type="text" id="f2" value="x^2/4 − 3" autocapitalize="off" spellcheck="false"></div>
      <div class="fx"><span style="--c:var(--s3)">h(x) =</span><input class="ltr" type="text" id="f3" value="" autocapitalize="off" spellcheck="false"></div>
      <div class="row"><button class="btn" id="zin" type="button" data-i18n="zin"></button><button class="btn" id="zout" type="button" data-i18n="zout"></button><button class="btn" id="zreset" type="button" data-i18n="reset"></button></div>
    </div>
    <div><div class="plot"><canvas id="cv" role="img" aria-label="Graph"></canvas></div><p class="big" id="trace" style="font-size:.875rem;margin-top:8px"></p></div>
  </div>
</section>

<section data-view="convert">
  <h2 data-i18n="conv"></h2>
  <div class="card" style="max-width:560px;margin-top:12px">
    <div class="fields"><label><span data-i18n="category"></span><select id="ccat"></select></label></div>
    <div class="fields">
      <label><span data-i18n="from"></span><input class="ltr" type="text" inputmode="decimal" id="cval" value="1"></label>
      <label><span>&nbsp;</span><select id="cfrom" class="ltr"></select></label>
    </div>
    <div class="row" style="margin-bottom:12px"><button class="btn" id="cswap" type="button" data-i18n="swap"></button></div>
    <div class="fields"><label><span data-i18n="to"></span><select id="cto" class="ltr"></select></label></div>
    <p class="big" id="cout"></p>
  </div>
</section>

<section data-view="everyday">
  <h2 data-i18n="daily"></h2>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3 data-i18n="pct"></h3>
      <div class="fields"><label>A<input class="ltr" type="text" inputmode="decimal" id="pa" value="15"></label><label>B<input class="ltr" type="text" inputmode="decimal" id="pb" value="240"></label></div>
      <dl class="out" id="pout"></dl></div>
    <div class="card"><h3 data-i18n="dates"></h3>
      <div class="fields"><label><span data-i18n="d_start"></span><input type="date" id="ds"></label><label><span data-i18n="d_end"></span><input type="date" id="de"></label><label><span data-i18n="d_add"></span><input class="ltr" type="text" inputmode="numeric" id="dn" value="90"></label></div>
      <dl class="out" id="dout"></dl></div>
  </div>
</section>

<section data-view="solve">
  <h2 data-i18n="solve"></h2>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3 data-i18n="q_title"></h3>
      <div class="fields"><label>a<input class="ltr" type="text" inputmode="decimal" id="qa" value="1"></label><label>b<input class="ltr" type="text" inputmode="decimal" id="qb" value="-3"></label><label>c<input class="ltr" type="text" inputmode="decimal" id="qc" value="2"></label></div>
      <dl class="out"><dt data-i18n="roots"></dt><dd id="qout"></dd></dl></div>
    <div class="card"><h3 data-i18n="r_title"></h3>
      <div class="fields"><label>f(x)<input class="ltr" type="text" id="rf" value="x^3 − 2x − 5" autocapitalize="off" spellcheck="false"></label><label><span data-i18n="guess"></span><input class="ltr" type="text" inputmode="decimal" id="rg" value="2"></label></div>
      <dl class="out"><dt>x</dt><dd id="rout"></dd></dl></div>
    <div class="card"><h3 data-i18n="d_title"></h3>
      <div class="fields"><label>f(x)<input class="ltr" type="text" id="df" value="x^2·sin(x)" autocapitalize="off" spellcheck="false"></label><label><span data-i18n="at"></span><input class="ltr" type="text" inputmode="decimal" id="dx" value="1"></label></div>
      <dl class="out"><dt>f′(x)</dt><dd id="dout"></dd></dl></div>
    <div class="card"><h3 data-i18n="i_title"></h3>
      <div class="fields"><label>f(x)<input class="ltr" type="text" id="if" value="e^(−x^2)" autocapitalize="off" spellcheck="false"></label><label><span data-i18n="lower"></span><input class="ltr" type="text" inputmode="decimal" id="ia" value="0"></label><label><span data-i18n="upper"></span><input class="ltr" type="text" inputmode="decimal" id="ib" value="1"></label></div>
      <dl class="out"><dt>∫ f(x) dx</dt><dd id="iout"></dd></dl></div>
  </div>
</section>

<section data-view="statistics">
  <h2 data-i18n="stats"></h2>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3 data-i18n="s_title"></h3>
      <label><span data-i18n="s_hint"></span><textarea class="ltr" id="sdata" rows="6">12, 15, 15, 18, 21, 24, 30</textarea></label></div>
    <div class="card"><dl class="out" id="sout"></dl></div>
    <div class="card"><h3 data-i18n="reg"></h3>
      <label><span data-i18n="reg_hint"></span><textarea class="ltr" id="rdata" rows="5">1, 2.1
2, 3.9
3, 6.2
4, 7.8
5, 10.1</textarea></label>
      <dl class="out" id="regout" style="margin-top:12px"></dl></div>
  </div>
</section>

<section data-view="matrix">
  <h2 data-i18n="matrix"></h2>
  <div class="grid g2" style="margin-top:12px">
    <div class="card">
      <div class="fields"><label><span data-i18n="size"></span><select id="msize"><option value="2">2 × 2</option><option value="3" selected>3 × 3</option></select></label></div>
      <h3 data-i18n="ma"></h3><div class="mx" id="mA"></div>
      <h3 style="margin-top:14px" data-i18n="vb"></h3><div class="mx" id="mB"></div>
    </div>
    <div class="card grid" style="align-content:start">
      <dl class="out"><dt data-i18n="det"></dt><dd id="mdet"></dd></dl>
      <div><h3 data-i18n="sol"></h3><pre id="msol"></pre></div>
      <div><h3 data-i18n="inv"></h3><pre id="minv"></pre></div>
      <div><h3 data-i18n="transp"></h3><pre id="mtr"></pre></div>
    </div>
  </div>
</section>

<section data-view="finance">
  <h2 data-i18n="fin"></h2>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3 data-i18n="loan"></h3>
      <div class="fields"><label><span data-i18n="amount"></span><input class="ltr" type="text" inputmode="decimal" id="la" value="250000"></label><label><span data-i18n="rate"></span><input class="ltr" type="text" inputmode="decimal" id="lr" value="5.5"></label><label><span data-i18n="years"></span><input class="ltr" type="text" inputmode="decimal" id="ly" value="25"></label></div>
      <dl class="out" id="lout"></dl></div>
    <div class="card"><h3 data-i18n="comp"></h3>
      <div class="fields"><label><span data-i18n="principal"></span><input class="ltr" type="text" inputmode="decimal" id="ca" value="10000"></label><label><span data-i18n="rate"></span><input class="ltr" type="text" inputmode="decimal" id="cr" value="7"></label><label><span data-i18n="years"></span><input class="ltr" type="text" inputmode="decimal" id="cy" value="10"></label><label><span data-i18n="peryear"></span><input class="ltr" type="text" inputmode="numeric" id="cn" value="12"></label></div>
      <dl class="out" id="cmpout"></dl></div>
  </div>
</section>

<section data-view="programmer">
  <h2 data-i18n="prog"></h2>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3 data-i18n="bases"></h3>
      <div class="grid" style="gap:10px">
        <label><span data-i18n="dec"></span><input class="ltr" type="text" id="b10" data-base="10" value="255" autocapitalize="off" spellcheck="false"></label>
        <label><span data-i18n="hex"></span><input class="ltr" type="text" id="b16" data-base="16" autocapitalize="off" spellcheck="false"></label>
        <label><span data-i18n="oct"></span><input class="ltr" type="text" id="b8" data-base="8" autocapitalize="off" spellcheck="false"></label>
        <label><span data-i18n="bin"></span><input class="ltr" type="text" id="b2" data-base="2" autocapitalize="off" spellcheck="false"></label>
      </div></div>
    <div class="card"><h3 data-i18n="bit"></h3><p class="sub" data-i18n="bit_hint"></p>

m_start:"اختر أداة من الشريط العلوي. اختر لغتك من القائمة بجانب الاسم. العربية والأردية تجعلان الصفحة من اليمين إلى اليسار، أما الأرقام والصيغ فتُقرأ دائمًا من اليسار إلى اليمين.",
m_calc:"اضغط المفاتيح أو اكتب بلوحة المفاتيح. السطر الصغير تحت العبارة يعرض الناتج أثناء الكتابة. اضغط = لطباعته على الشريط. مفتاح 2nd يبدّل المفاتيح إلى وظيفتها الثانية، فيصبح sin هو sin⁻¹ ويصبح ln هو eˣ. مفتاح DEG / RAD يحدد وحدة الزاوية. المفاتيح M+ و M− و MR و MC تعمل على الذاكرة، و Ans يحفظ آخر ناتج. اضغط أي سطر في الشريط لإعادة استخدام ناتجه.",
m_expr_a:"اكتب الصيغ كما تكتبها على الورق. العدد المجاور لقوس أو حرف يعني الضرب.",m_expr_b:"الدوال",m_expr_c:"الثوابت، والحرف E لقوى العشرة",
m_graph:"أدخل حتى ثلاث دوال في x. اسحب الرسم لتحريكه واستخدم زرّي التكبير والتصغير لتغيير المقياس. اترك السطر فارغًا لإخفائه. الرسم يستخدم الراديان دائمًا. اضغط على الرسم لقراءة القيم عند تلك النقطة.",
m_conv:"اختر فئة واكتب قيمة ثم اختر الوحدتين. الناتج يتحدث أثناء الكتابة. زر تبديل الوحدتين يعكس الاتجاه.",
m_solve:"المعادلة التربيعية: أدخل a و b و c للمعادلة ax² + bx + c = 0. الجذور المركبة تُعرض بالرمز i. إيجاد الجذر: أدخل f(x) وقيمة ابتدائية لتحصل على أقرب جذر. المشتقات والتكاملات تُحسب عدديًا، فتوقع نحو 8 أرقام صحيحة. الزوايا هنا بالراديان.",
m_stats:"اكتب أرقامك أو الصقها. العدد والمتوسط والوسيط والمنوال والتشتت والانحرافان المعياريان تتحدث فورًا.",
m_matrix:"اختر 2 × 2 أو 3 × 3 واملأ المصفوفة A. تحصل على المحدد والمنقول والمعكوس. املأ المتجه b لحل النظام A·x = b.",
m_fin:"قسط القرض يعطي القسط الشهري الثابت لمبلغ ومعدل سنوي ومدة. النمو المركب يوضح ما يصير إليه المبلغ الابتدائي. هذه تقديرات وليست نصيحة مالية.",
m_prog:"اكتب في أي من الخانات الأربع فتتحدث بقية الأنظمة. الأعداد الصحيحة السالبة والكبيرة جدًا مدعومة. نتائج عمليات البتات على A و B تظهر في الجدول.",
m_keys:"Enter أو = للحساب، Backspace للحذف، Escape للمسح. استخدم ^ للأس و * للضرب و / للقسمة.",

m_calc:"बटन दबाएँ या कीबोर्ड से लिखें। व्यंजक के नीचे की छोटी पंक्ति लिखते समय उत्तर दिखाती है। उसे टेप पर छापने के लिए = दबाएँ। 2nd बटनों को उनके दूसरे काम पर ले जाता है, यानी sin से sin⁻¹ और ln से eˣ बन जाता है। DEG / RAD कोण की इकाई तय करता है। M+, M−, MR और MC मेमोरी पर काम करते हैं और Ans पिछला उत्तर रखता है। टेप की किसी पंक्ति को दबाकर उसका परिणाम फिर से इस्तेमाल करें।",

m_graph:"x के अधिकतम तीन फलन लिखें। ग्राफ़ खिसकाने के लिए खींचें और पैमाना बदलने के लिए ज़ूम बटन इस्तेमाल करें। किसी पंक्ति को छिपाने के लिए उसे खाली छोड़ दें। ग्राफ़ हमेशा रेडियन का उपयोग करते हैं। उस बिंदु के मान पढ़ने के लिए ग्राफ़ पर दबाएँ।",
m_conv:"श्रेणी चुनें, मान लिखें और दोनों इकाइयाँ चुनें। उत्तर लिखते ही बदल जाता है। इकाइयाँ बदलें बटन दिशा उलट देता है।",
m_solve:"द्विघात: ax² + bx + c = 0 के लिए a, b और c लिखें। सम्मिश्र मूल i के साथ दिखाए जाते हैं। मूल खोज: निकटतम मूल पाने के लिए f(x) और आरंभिक मान लिखें। अवकलज और समाकल संख्यात्मक रूप से निकाले जाते हैं, इसलिए लगभग 8 सही अंक मिलते हैं। यहाँ कोण रेडियन में हैं।",
m_stats:"अपनी संख्याएँ लिखें या पेस्ट करें। गिनती, माध्य, माध्यिका, बहुलक, फैलाव और दोनों मानक विचलन तुरंत बदल जाते हैं।",
m_matrix:"2 × 2 या 3 × 3 चुनें और मैट्रिक्स A भरें। आपको सारणिक, परिवर्त और व्युत्क्रम मिलता है। निकाय A·x = b हल करने के लिए सदिश b भरें।",
m_fin:"ऋण की किस्त राशि, वार्षिक दर और अवधि के लिए निश्चित मासिक किस्त बताती है। चक्रवृद्धि वृद्धि दिखाती है कि आरंभिक राशि कितनी हो जाती है। ये अनुमान हैं, वित्तीय सलाह नहीं।",
m_prog:"चारों खानों में से किसी में लिखें और बाकी आधार अपने आप बदल जाते हैं। ऋणात्मक और बहुत बड़े पूर्णांक भी चलते हैं। A और B के बिटवाइज़ परिणाम तालिका में दिखते हैं।",
m_keys:"Enter या = गणना करता है, Backspace मिटाता है, Escape सब साफ़ करता है। घात के लिए ^, गुणा के लिए * और भाग के लिए / इस्तेमाल करें।",

reg:"रैखिक समाश्रयण",reg_hint:"हर पंक्ति में एक x, y जोड़ा।",fit:"सर्वोत्तम फ़िट रेखा",slope:"ढाल",icept:"अंतःखंड",corr:"सहसंबंध r",m_reg:"रैखिक समाश्रयण: हर पंक्ति में एक x, y जोड़ा लिखें तो सर्वोत्तम फ़िट सीधी रेखा और बिंदुओं की उससे निकटता मिलती है।",
pro_tool:"प्रो टूल",lock_msg:"प्रो चिह्न वाले टूल प्रो खोलने के बाद चलते हैं। भुगतान अभी जुड़ा नहीं है, इसलिए इस पूर्वावलोकन में खोलना निःशुल्क है।",unlock:"प्रो पूर्वावलोकन खोलें",relock:"प्रो फिर से बंद करें",see_plans:"योजनाएँ देखें",pro_on:"प्रो पूर्वावलोकन चालू है। सभी टूल खुले हैं।",

};

<script>
(function(){
var $=function(s){return document.querySelector(s)},$$=function(s){return [].slice.call(document.querySelectorAll(s))};
var store={get:function(k){try{return JSON.parse(localStorage.getItem('hisab.'+k))}catch(e){return null}},set:function(k,v){try{localStorage.setItem('hisab.'+k,JSON.stringify(v))}catch(e){}}};
var lang=store.get('lang');if(!T[lang])lang='en';
function t(k){return (T[lang]&&T[lang][k])||T.en[k]||k}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var fmt=Core.fmt,num=Core.num;
function money(v){return isFinite(v)?v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}
function rows(el,list){el.innerHTML=list.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'}).join('')}

/* ---------- navigation ---------- */
var VIEWS=[['calculator','calc'],['graph','graph'],['convert','conv'],['everyday','daily'],['solve','solve'],['statistics','stats'],['matrix','matrix'],['finance','fin'],['programmer','prog'],['pricing','price'],['manual','manual']];
var PRO={graph:1,solve:1,statistics:1,matrix:1,finance:1,programmer:1},pro=store.get('pro')===true;
$('#nav').innerHTML=VIEWS.map(function(v){return '<li><a href="#'+v[0]+'"><span data-i18n="'+v[1]+'"></span>'+(PRO[v[0]]?'<b class="pb">PRO</b>':'')+'</a></li>'}).join('');
var current='calculator';
function route(){
  var h=location.hash.replace('#','');if(!VIEWS.some(function(v){return v[0]===h}))h='calculator';current=h;
  var locked=!!PRO[h]&&!pro;$$('section[data-view]').forEach(function(s){s.classList.toggle('on',s.dataset.view===h&&!locked)});$('#lock').hidden=!locked;$('#lockT').textContent=t(VIEWS.filter(function(v){return v[0]===h})[0][1]);
  $$('#nav a').forEach(function(a){if(a.getAttribute('href')==='#'+h){a.setAttribute('aria-current','page');if(a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'center'})}else a.removeAttribute('aria-current')});
  if(h==='graph')draw();
}
window.addEventListener('hashchange',route);
function setPro(v){pro=v;store.set('pro',v);route();pricing()}
$('#unlockBtn').addEventListener('click',function(){setPro(true)});

/* ---------- calculator ---------- */
var S={expr:'',ans:0,mem:0,deg:true,second:false,just:false,tape:store.get('tape')||null,seed:false};
if(!S.tape){S.seed=true;S.tape=[{e:'sin(30)+√(16)',r:'4.5',x:1},{e:'2^10÷(3!+2)',r:'128',x:1}]}
var SCI=[{a:'2nd',l:'2nd'},{a:'deg',l:'DEG'},{i:'sin(',l:'sin',i2:'asin(',l2:'sin⁻¹'},{i:'cos(',l:'cos',i2:'acos(',l2:'cos⁻¹'},{i:'tan(',l:'tan',i2:'atan(',l2:'tan⁻¹'},
 {i:'^',l:'xʸ',i2:'^(1÷',l2:'ʸ√x'},{i:'√(',l:'√',i2:'cbrt(',l2:'∛'},{i:'^2',l:'x²',i2:'^3',l2:'x³'},{i:'ln(',l:'ln',i2:'e^(',l2:'eˣ'},{i:'log(',l:'log',i2:'10^(',l2:'10ˣ'},
 {i:'π',l:'π',i2:'e',l2:'e'},{i:'(',l:'('},{i:')',l:')'},{i:'!',l:'n!',i2:'abs(',l2:'|x|'},{i:'%',l:'%',i2:',',l2:','},
 {a:'mc',l:'MC'},{a:'mr',l:'MR'},{a:'m+',l:'M+'},{a:'m-',l:'M−'},{i:'Ans',l:'Ans'}];
var MAIN=[{a:'ac',l:'AC',c:'op'},{a:'del',l:'⌫',c:'op'},{i:'E',l:'EXP',c:'op'},{i:'÷',l:'÷',c:'op'},
 {i:'7',l:'7'},{i:'8',l:'8'},{i:'9',l:'9'},{i:'×',l:'×',c:'op'},{i:'4',l:'4'},{i:'5',l:'5'},{i:'6',l:'6'},{i:'−',l:'−',c:'op'},
 {i:'1',l:'1'},{i:'2',l:'2'},{i:'3',l:'3'},{i:'+',l:'+',c:'op'},{i:'0',l:'0'},{i:'.',l:'.'},{i:'^(−1)',l:'x⁻¹',c:'op'},{a:'eq',l:'=',c:'eq'}];
function keyHtml(list){return list.map(function(k,n){return '<button type="button" class="k '+(k.c||'')+'" data-n="'+n+'">'+k.l+'</button>'}).join('')}
$('#sci').innerHTML=keyHtml(SCI);$('#mainkeys').innerHTML=keyHtml(MAIN);
function env(){return {deg:S.deg,ans:S.ans,x:0}}
function paint(){
  var ex=$('#expr');ex.textContent=S.expr||'0';ex.scrollLeft=ex.scrollWidth;
  var live=$('#live');live.className='';
  if(S.expr&&!S.just){try{var v=Core.evaluate(S.expr,env());var fr=Core.frac(v);live.textContent=isNaN(v)?'':'= '+fmt(v)+(fr?'   ('+fr+')':'')}catch(e){live.textContent=''}}else{var fj=S.just?Core.frac(S.ans):null;live.textContent=fj?'= '+fj:''}
  $('#fDeg').textContent=S.deg?'DEG':'RAD';$('#f2nd').textContent=S.second?'2nd':'';$('#fMem').textContent=S.mem?'M = '+fmt(S.mem):'';
  $$('#sci .k').forEach(function(b){var k=SCI[b.dataset.n];if(k.a==='deg')b.textContent=S.deg?'DEG':'RAD';else if(k.a==='2nd')b.classList.toggle('on',S.second);else if(k.l2)b.textContent=S.second?k.l2:k.l});
}
function paintTape(){
  $('#tape').innerHTML=S.tape.slice().reverse().map(function(l,i){return '<li><button type="button" data-r="'+esc(l.r)+'"><span class="e">'+(l.x?'<span class="x">'+esc(t('example'))+'</span>':'')+esc(l.e)+' =</span><span class="r">'+esc(l.r)+'</span></button></li>'}).join('');
}
function insert(s){
  if(S.just){S.expr=/^[+−×÷^!%]/.test(s)?'Ans'+s:s;S.just=false}else S.expr+=s;paint()
}
function equals(){
  if(!S.expr)return;
  try{var v=Core.evaluate(S.expr,env());if(isNaN(v))throw 0;var r=fmt(v);
    if(S.seed){S.tape=[];S.seed=false}
    S.tape.push({e:S.expr,r:r});if(S.tape.length>50)S.tape.shift();store.set('tape',S.tape);
    S.ans=v;S.expr=r;S.just=true;paint();paintTape()
  }catch(e){var live=$('#live');live.textContent=t('err');live.className='bad'}
}
function act(a){
  if(a==='2nd'){S.second=!S.second}
  else if(a==='deg'){S.deg=!S.deg}
  else if(a==='ac'){S.expr='';S.just=false}
  else if(a==='del'){if(S.just){S.expr='';S.just=false}else S.expr=S.expr.replace(/(a?[a-z]+\d?\(|Ans|√\(|\^\(−1\)|\^\(1÷|.)$/,'')}
  else if(a==='eq'){equals();return}
  else if(a==='mc'){S.mem=0}
  else if(a==='mr'){insert(S.mem<0?'('+fmt(S.mem)+')':fmt(S.mem));return}
  else if(a==='m+'||a==='m-'){try{var v=S.expr?Core.evaluate(S.expr,env()):S.ans;if(!isNaN(v))S.mem+=a==='m+'?v:-v}catch(e){}}
  paint()
}
function press(k){if(k.a)act(k.a);else{insert(S.second&&k.i2?k.i2:k.i);if(S.second){S.second=false;paint()}}}
$('#sci').addEventListener('click',function(e){var b=e.target.closest('.k');if(b)press(SCI[b.dataset.n])});
$('#mainkeys').addEventListener('click',function(e){var b=e.target.closest('.k');if(b)press(MAIN[b.dataset.n])});
$('#tape').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var r=b.dataset.r;insert(r[0]==='-'?'('+r+')':r)});
$('#clearTape').addEventListener('click',function(){S.tape=[];S.seed=false;store.set('tape',[]);paintTape()});
$('#copyBtn').addEventListener('click',function(){var b=this,txt=S.expr||'0';
  try{navigator.clipboard.writeText(txt).then(function(){b.textContent=t('copied');setTimeout(function(){b.textContent=t('copy')},1200)},function(){})}catch(e){}});
document.addEventListener('keydown',function(e){
  if(current!=='calculator'||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  var k=e.key;
  if(k==='Enter'||k==='='){e.preventDefault();equals()}
  else if(k==='Backspace'){e.preventDefault();act('del')}
  else if(k==='Escape'){act('ac')}
  else if(k==='*'){insert('×')}else if(k==='/'){e.preventDefault();insert('÷')}else if(k==='-'){insert('−')}
  else if(k.length===1&&/[0-9a-zA-Z.+^()!%,]/.test(k)){insert(k)}
});

/* ---------- graph ---------- */
var G={cx:0,cy:0,scale:0,tx:2};
function niceStep(u){var p=Math.pow(10,Math.floor(Math.log10(u))),f=u/p;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p}
function draw(){
  var cv=$('#cv'),w=cv.clientWidth,h=cv.clientHeight;if(!w)return;
  var dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  if(!G.scale)G.scale=w/16;
  var cs=getComputedStyle(document.documentElement),col=function(n){return cs.getPropertyValue(n).trim()};
  var X=function(x){return w/2+(x-G.cx)*G.scale},Y=function(y){return h/2-(y-G.cy)*G.scale};
  c.fillStyle=col('--surface');c.fillRect(0,0,w,h);
  var step=niceStep(70/G.scale),x0=G.cx-w/2/G.scale,x1=G.cx+w/2/G.scale,y0=G.cy-h/2/G.scale,y1=G.cy+h/2/G.scale;
  c.lineWidth=1;c.strokeStyle=col('--line');c.fillStyle=col('--muted');c.font='11px "IBM Plex Mono",monospace';c.beginPath();
  var gx,gy;
  for(gx=Math.ceil(x0/step)*step;gx<=x1;gx+=step){c.moveTo(Math.round(X(gx))+.5,0);c.lineTo(Math.round(X(gx))+.5,h)}
  for(gy=Math.ceil(y0/step)*step;gy<=y1;gy+=step){c.moveTo(0,Math.round(Y(gy))+.5);c.lineTo(w,Math.round(Y(gy))+.5)}
  c.stroke();
  c.strokeStyle=col('--muted');c.beginPath();c.moveTo(0,Math.round(Y(0))+.5);c.lineTo(w,Math.round(Y(0))+.5);c.moveTo(Math.round(X(0))+.5,0);c.lineTo(Math.round(X(0))+.5,h);c.stroke();
  var ay=Math.min(Math.max(Y(0)+14,14),h-6),ax=Math.min(Math.max(X(0)+5,5),w-44);
  for(gx=Math.ceil(x0/step)*step;gx<=x1;gx+=step){if(Math.abs(gx)>step/2)c.fillText(fmt(gx,6),X(gx)+3,ay)}
  for(gy=Math.ceil(y0/step)*step;gy<=y1;gy+=step){if(Math.abs(gy)>step/2)c.fillText(fmt(gy,6),ax,Y(gy)-4)}
  var tr=['x = '+fmt(G.tx,6)];c.save();c.setLineDash([4,4]);c.strokeStyle=col('--muted');c.lineWidth=1;c.beginPath();c.moveTo(X(G.tx),0);c.lineTo(X(G.tx),h);c.stroke();c.restore();
  [['#f1','--accent','f'],['#f2','--fn','g'],['#f3','--s3','h']].forEach(function(p){
    var src=$(p[0]).value.trim();if(!src)return;var f;try{f=Core.compile(src)}catch(e){return}
    c.strokeStyle=col(p[1]);c.lineWidth=2.25;c.lineJoin='round';c.beginPath();var pen=false,py=0,e={deg:false,ans:S.ans,x:0};
    for(var px=0;px<=w;px+=1){e.x=x0+px/G.scale;var y=f(e),sy=Y(y);
      if(!isFinite(y)||Math.abs(sy)>1e5){pen=false;continue}
      if(pen&&Math.abs(sy-py)>h*1.5)pen=false;
      if(pen)c.lineTo(px,sy);else c.moveTo(px,sy);pen=true;py=sy}
    c.stroke();
    e.x=G.tx;var ty=f(e);tr.push(p[2]+' = '+(isFinite(ty)?fmt(ty,6):'—'));if(isFinite(ty)){c.fillStyle=col(p[1]);c.beginPath();c.arc(X(G.tx),Y(ty),5,0,7);c.fill()}});
  $('#trace').textContent=tr.join('     ');
}
(function(){var cv=$('#cv'),drag=null;
  function at(e){var r=cv.getBoundingClientRect();return G.cx+(e.clientX-r.left-r.width/2)/G.scale}
  cv.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY};G.tx=at(e);draw();try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',function(e){if(!drag){if(e.pointerType==='mouse'){G.tx=at(e);draw()}return}G.cx-=(e.clientX-drag.x)/G.scale;G.cy+=(e.clientY-drag.y)/G.scale;drag={x:e.clientX,y:e.clientY};draw()});
  ['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){drag=null})});
  cv.addEventListener('wheel',function(e){e.preventDefault();G.scale*=e.deltaY<0?1.15:1/1.15;draw()},{passive:false});
  $('#zin').addEventListener('click',function(){G.scale*=1.4;draw()});
  $('#zout').addEventListener('click',function(){G.scale/=1.4;draw()});
  $('#zreset').addEventListener('click',function(){G.cx=0;G.cy=0;G.scale=0;G.tx=2;draw()});
  ['#f1','#f2','#f3'].forEach(function(s){$(s).addEventListener('input',draw)});
  window.addEventListener('resize',function(){if(current==='graph')draw()});
  try{new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw)}catch(e){}
})();

/* ---------- converter ---------- */
var cat='length';
function fillCats(){$('#ccat').innerHTML=Object.keys(UNITS).map(function(k){return '<option value="'+k+'"'+(k===cat?' selected':'')+'>'+esc(t('c_'+k))+'</option>'}).join('')}
function fillUnits(){var u=Object.keys(UNITS[cat]),o=u.map(function(k){return '<option>'+esc(k)+'</option>'}).join('');$('#cfrom').innerHTML=o;$('#cto').innerHTML=o;$('#cto').selectedIndex=Math.min(1,u.length-1);conv()}
function conv(){var v=num($('#cval').value),a=$('#cfrom').value,b=$('#cto').value;$('#cout').textContent=isNaN(v)?'—':fmt(convert(cat,v,a,b),10)+' '+b}
$('#ccat').addEventListener('change',function(){cat=this.value;fillUnits()});
['#cval','#cfrom','#cto'].forEach(function(s){$(s).addEventListener('input',conv)});
$('#cswap').addEventListener('click',function(){var a=$('#cfrom').selectedIndex;$('#cfrom').selectedIndex=$('#cto').selectedIndex;$('#cto').selectedIndex=a;conv()});

/* ---------- everyday ---------- */
(function(){var n=new Date(),iso=function(d){return d.toISOString().slice(0,10)},s=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));$('#ds').value=iso(s);$('#de').value=iso(new Date(s.getTime()+90*864e5))})();
function daily(){
  var a=num($('#pa').value),b=num($('#pb').value),f=function(v,u){return isFinite(v)?fmt(v,10)+(u||''):'—'},chg=(b-a)/Math.abs(a)*100;
  rows($('#pout'),[[t('pct_of'),f(a*b/100)],[t('pct_is'),f(a/b*100,' %')],[t('pct_chg'),isFinite(chg)?(chg>0?'+':'')+fmt(chg,10)+' %':'—']]);
  var s=Date.parse($('#ds').value+'T00:00:00Z'),e=Date.parse($('#de').value+'T00:00:00Z'),k=num($('#dn').value),r=s+Math.round(k)*864e5;
  rows($('#dout'),[[t('d_days'),isNaN(s)||isNaN(e)?'—':String(Math.round((e-s)/864e5))],[t('d_res'),isNaN(r)||Math.abs(r)>8e15?'—':new Date(r).toISOString().slice(0,10)]]);
}
['pa','pb','ds','de','dn'].forEach(function(id){$('#'+id).addEventListener('input',daily)});

/* ---------- solver ---------- */
function fn(src){var f=Core.compile(src),e={deg:false,ans:S.ans,x:0};return function(x){e.x=x;return f(e)}}
function solve(){
  var a=num($('#qa').value),b=num($('#qb').value),c=num($('#qc').value),o=$('#qout');
  if([a,b,c].some(isNaN))o.textContent='—';else{var q=Core.quadratic(a,b,c);
    o.textContent=q.k==='any'?t('anyx'):q.k==='none'?t('nosol'):q.k==='real'?q.r.map(function(v){return 'x = '+fmt(v,10)}).join('   '):'x = '+fmt(q.re,10)+' ± '+fmt(q.im,10)+'i'}
  try{var r=Core.findRoot(fn($('#rf').value),num($('#rg').value)||0);$('#rout').textContent=isNaN(r)?t('noroot'):fmt(r,10)}catch(e){$('#rout').textContent=t('badf')}
  try{var d=Core.deriv(fn($('#df').value),num($('#dx').value));$('#dout').textContent=isNaN(d)?'—':fmt(d,8)}catch(e){$('#dout').textContent=t('badf')}
  try{var i=Core.integrate(fn($('#if').value),num($('#ia').value),num($('#ib').value));$('#iout').textContent=isNaN(i)?'—':fmt(i,8)}catch(e){$('#iout').textContent=t('badf')}
}
['qa','qb','qc','rf','rg','df','dx','if','ia','ib'].forEach(function(id){$('#'+id).addEventListener('input',solve)});

/* ---------- statistics ---------- */
function stats(){
  var xs=Core.normDigits($('#sdata').value).replace(/[−–]/g,'-').split(/[\s,;،]+/).filter(Boolean).map(Number).filter(function(v){return !isNaN(v)});
  var s=Core.stats(xs),f=function(v){return isNaN(v)?'—':fmt(v,10)};
  if(!s){rows($('#sout'),[[t('count'),'0']]);return}
  rows($('#sout'),[[t('count'),String(s.count)],[t('sum'),f(s.sum)],[t('mean'),f(s.mean)],[t('median'),f(s.median)],[t('mode'),s.mode.length?s.mode.map(f).join(', '):'—'],[t('min'),f(s.min)],[t('max'),f(s.max)],[t('range'),f(s.range)],[t('variance'),f(s.variance)],[t('sds'),f(s.sds)],[t('sdp'),f(s.sdp)]]);
}
$('#sdata').addEventListener('input',stats);
function reg(){
  var P=Core.normDigits($('#rdata').value).replace(/[−–]/g,'-').split(/\n+/).map(function(l){return l.split(/[\s,;،]+/).filter(Boolean).map(Number)}).filter(function(a){return a.length>=2&&!isNaN(a[0])&&!isNaN(a[1])});
  var r=Core.regress(P);if(!r){rows($('#regout'),[[t('fit'),'—']]);return}
  rows($('#regout'),[[t('fit'),'y = '+fmt(r.slope,6)+'x '+(r.icept<0?'− ':'+ ')+fmt(Math.abs(r.icept),6)],[t('slope'),fmt(r.slope,8)],[t('icept'),fmt(r.icept,8)],[t('corr'),isNaN(r.r)?'—':fmt(r.r,6)],['R²',isNaN(r.r)?'—':fmt(r.r*r,6)]]);
}
$('#rdata').addEventListener('input',reg);

/* ---------- matrix ---------- */
var MA=[[2,1,-1],[-3,-1,2],[-2,1,2]],MB=[8,-11,-3];
function buildMatrix(){
  var n=+$('#msize').value,a='',b='';
  for(var i=0;i<n;i++){for(var j=0;j<n;j++)a+='<input type="text" inputmode="decimal" id="a'+i+j+'" aria-label="A '+(i+1)+','+(j+1)+'" value="'+MA[i][j]+'">';b+='<input type="text" inputmode="decimal" id="b'+i+'" aria-label="b '+(i+1)+'" value="'+MB[i]+'">'}
  $('#mA').style.gridTemplateColumns='repeat('+n+',1fr)';$('#mA').innerHTML=a;$('#mB').style.gridTemplateColumns='repeat('+n+',1fr)';$('#mB').innerHTML=b;matrix()
}
function show(M){var s=M.map(function(r){return r.map(function(v){return fmt(v,6)})}),w=0;s.forEach(function(r){r.forEach(function(v){w=Math.max(w,v.length)})});
  return s.map(function(r){return r.map(function(v){return (new Array(w-v.length+1).join(' '))+v}).join('   ')}).join('\n')}
function matrix(){
  var n=+$('#msize').value,A=[],b=[],bad=false;
  for(var i=0;i<n;i++){A.push([]);for(var j=0;j<n;j++){var v=num($('#a'+i+j).value);if(isNaN(v))bad=true;else MA[i][j]=v;A[i].push(v)}var bv=num($('#b'+i).value);if(!isNaN(bv))MB[i]=bv;b.push(bv)}
  if(bad){$('#mdet').textContent='—';$('#minv').textContent=$('#mtr').textContent=$('#msol').textContent='—';return}
  $('#mdet').textContent=fmt(Core.det(A),10);
  $('#mtr').textContent=show(A[0].map(function(_,j){return A.map(function(r){return r[j]})}));
  var inv=Core.inverse(A);
  if(!inv){$('#minv').textContent=t('singular');$('#msol').textContent='—';return}
  $('#minv').textContent=show(inv);
  $('#msol').textContent=b.some(isNaN)?'—':inv.map(function(r,i){var s=0;for(var k=0;k<n;k++)s+=r[k]*b[k];return 'x'+'₁₂₃'[i]+' = '+fmt(s,8)}).join('\n');
}
$('#msize').addEventListener('change',buildMatrix);
$('#mA').addEventListener('input',matrix);$('#mB').addEventListener('input',matrix);

/* ---------- finance ---------- */
function finance(){
  var P=num($('#la').value),r=num($('#lr').value)/1200,n=num($('#ly').value)*12,pay=r===0?P/n:P*r/(1-Math.pow(1+r,-n));
  rows($('#lout'),[[t('monthly'),money(pay)],[t('total'),money(pay*n)],[t('interest'),money(pay*n-P)]]);
  var A=num($('#ca').value),cr=num($('#cr').value)/100,y=num($('#cy').value),m=num($('#cn').value),fv=A*Math.pow(1+cr/m,m*y);
  rows($('#cmpout'),[[t('future'),money(fv)],[t('gain'),money(fv-A)]]);
}
['la','lr','ly','ca','cr','cy','cn'].forEach(function(id){$('#'+id).addEventListener('input',finance)});

/* ---------- programmer ---------- */
var BASES=[['b10',10],['b16',16],['b8',8],['b2',2]];
function bstr(v,base){return (v<0n?'-':'')+(v<0n?-v:v).toString(base).toUpperCase()}
function bases(src){var el=$('#'+src),v=Core.parseBig(el.value,+el.dataset.base);
  BASES.forEach(function(b){if(b[0]!==src)$('#'+b[0]).value=v===null?'':bstr(v,b[1])})}
BASES.forEach(function(b){$('#'+b[0]).addEventListener('input',function(){bases(b[0])})});
function bits(){
  var a=Core.parseBig($('#ba').value,10),b=Core.parseBig($('#bb').value,10),h='<tr><th></th><th>DEC</th><th>HEX</th><th>BIN</th></tr>';
  if(a===null||b===null){$('#bout').innerHTML=h;return}
  [['A AND B',a&b],['A OR B',a|b],['A XOR B',a^b],['NOT A',~a],['A << 1',a<<1n],['A >> 1',a>>1n]].forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+bstr(r[1],10)+'</td><td>'+bstr(r[1],16)+'</td><td>'+bstr(r[1],2)+'</td></tr>'});
  $('#bout').innerHTML=h;
}
$('#ba').addEventListener('input',bits);$('#bb').addEventListener('input',bits);

/* ---------- pricing ---------- */
var yearly=false,PLANS=[{n:'free',m:0,y:0,f:['f1','f2','f3'],cta:'cta_free'},{n:'pro',m:4.99,y:47.99,f:['p1','p2','p3','p4'],cta:'cta_wait',hot:1},{n:'team',m:29,y:279,f:['c1','c2','c3'],cta:'cta_wait'}];
function pricing(){
  $('#billM').setAttribute('aria-pressed',String(!yearly));$('#billY').setAttribute('aria-pressed',String(yearly));
  $('#plans').innerHTML=PLANS.map(function(p){var v=yearly?p.y:p.m,cta=p.n==='pro'?(pro?'relock':'unlock'):p.cta;
    return '<div class="card plan'+(p.hot?' hot':'')+'"><h3 style="margin:0">'+esc(t(p.n))+'</h3><div><span class="price">$'+(v%1?v.toFixed(2):v)+'</span> <span class="per">'+esc(t(yearly?'per_y':'per_m'))+'</span></div><ul>'+p.f.map(function(k){return '<li>'+esc(t(k))+'</li>'}).join('')+'</ul><button type="button" class="btn'+(p.hot?' pri':'')+'" data-cta="'+cta+'">'+esc(t(cta))+'</button></div>'}).join('');
  $('#toast').textContent=pro?t('pro_on'):'';
}
$('#billM').addEventListener('click',function(){yearly=false;pricing()});$('#billY').addEventListener('click',function(){yearly=true;pricing()});
$('#plans').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.cta==='cta_free'){location.hash='calculator'}else if(b.dataset.cta==='unlock'){setPro(true)}else if(b.dataset.cta==='relock'){setPro(false)}else $('#toast').textContent=t('wait_msg')});

/* ---------- manual ---------- */
var MAN=[['h_start',['m_start']],['calc',['m_calc']],
 ['h_expr',['m_expr_a','|2(3+4)   3x   5!   20%   2^10   √(2)   sin(30)','m_expr_b','|sin cos tan asin acos atan sinh cosh tanh\nln log log2 logb(x,b) exp sqrt cbrt root(x,n)\nabs floor ceil round sign min(a,b) max(a,b)\nmod(a,b) gcd(a,b) lcm(a,b) nCr(n,r) nPr(n,r)','m_expr_c','|pi   e   tau   phi   Ans   6.02E23']],
 ['graph',['m_graph']],['conv',['m_conv']],['daily',['m_daily']],['solve',['m_solve']],['stats',['m_stats','m_reg']],['matrix',['m_matrix']],['fin',['m_fin']],['prog',['m_prog']],['price',['lock_msg']],['h_keys',['m_keys']]];
function manual(){$('#man').innerHTML=MAN.map(function(s){return '<li><h3>'+esc(t(s[0]))+'</h3>'+s[1].map(function(b){return b[0]==='|'?'<code>'+esc(b.slice(1))+'</code>':'<p>'+esc(t(b))+'</p>'}).join('')+'</li>'}).join('')}

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=(lang==='ar'||lang==='ur')?'rtl':'ltr';
  $$('[data-i18n]').forEach(function(el){el.textContent=t(el.dataset.i18n)});
  fillCats();paintTape();daily();solve();stats();reg();matrix();finance();pricing();manual();route();
}
$('#lang').value=lang;
$('#lang').addEventListener('change',function(){lang=this.value;store.set('lang',lang);applyLang()});

fillUnits();buildMatrix();bases('b10');bits();applyLang();paint();route();
})();
</script>
