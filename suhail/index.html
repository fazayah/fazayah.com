<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suhail Space Academy</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one night-sky world; a living star on top, then learn / explore / subscribe in single-column bands that widen to grids. */
:root{
  color-scheme:dark;
  --bg:#070b1a; --surface:#0f1630; --raised:#161f42; --line:#28325e;
  --text:#eceefa; --muted:#a1a9cc; --gold:#ffc65c; --plasma:#ff7a59; --cool:#8fb4ff; --ok:#6fd6a8;
  --display:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,7vw,3.6rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--cool)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lead{color:var(--muted);max-width:60ch}
header.top{position:sticky;top:0;z-index:5;background:rgba(7,11,26,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.brand i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,var(--gold) 60%,transparent 75%);box-shadow:0 0 14px var(--gold)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
nav button:hover{color:var(--text);background:var(--surface)}
select#lang{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
section{padding:44px 0}
.hero{display:grid;gap:20px;padding-top:32px;align-items:center}
.hero .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{background:var(--gold);color:#201400;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.lab{display:grid;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
#star{width:100%;aspect-ratio:1/1;max-width:420px;margin:0 auto;display:block}
.slider label{display:flex;justify-content:space-between;font-weight:600}
input[type=range]{width:100%;accent-color:var(--gold);margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 0;padding:0}
.facts div{background:var(--raised);border-radius:12px;padding:10px 12px}
.facts dt{font-size:.78rem;color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.facts .wide{grid-column:1/-1}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
.eq{font-family:ui-monospace,Menlo,monospace;direction:ltr;unicode-bidi:isolate;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;overflow-x:auto;font-size:.88rem;font-weight:400}
.sky3{display:grid;gap:12px;margin-top:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile small{color:var(--muted);display:block}
.tile b{font-family:var(--display);font-size:1.25rem}
.grid{display:grid;gap:12px;margin-top:20px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.course>button{width:100%;text-align:start;background:none;border:0;padding:14px 16px;cursor:pointer;display:grid;gap:4px}
.course .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.pill{border-radius:99px;padding:1px 9px;font-size:.74rem;font-weight:600;border:1px solid currentColor}
.pill.b{color:var(--ok)} .pill.i{color:var(--cool)} .pill.a{color:var(--plasma)}
.course p{color:var(--muted);font-size:.92rem}
.prog{height:4px;background:var(--raised)} .prog i{display:block;height:100%;background:var(--gold);width:0}
.lessons{border-top:1px solid var(--line);padding:6px 16px 14px;display:none}
.course.open .lessons{display:block}
.lesson{padding:10px 0;border-bottom:1px solid var(--line)}
.lesson:last-child{border-bottom:0}
.lesson h4{margin:0;font-size:.98rem;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.lesson h4 span{font-size:.72rem;color:var(--muted);font-weight:500;white-space:nowrap}
.lesson p{margin-top:4px;color:var(--text)}
.lesson.lock p{color:var(--muted);font-style:italic}
.lesson button{margin-top:8px;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.82rem;cursor:pointer}
.lesson button.on{border-color:var(--ok);color:var(--ok)}
.news{display:grid;gap:12px;margin-top:20px}
.news article{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:12px;padding:14px 16px}
.news time{font-size:.78rem;color:var(--muted)}
.news p{color:var(--muted);margin:4px 0 6px;font-size:.94rem}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;text-decoration:none;font-size:.88rem}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:20px}
.quiz .opts{display:grid;gap:8px;margin-top:12px}
.quiz .opts button{text-align:start;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.quiz .opts button.right{border-color:var(--ok);color:var(--ok)}
.quiz .opts button.wrong{border-color:var(--plasma);color:var(--plasma)}
.toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px;margin-top:16px}
.toggle button{border:0;background:none;border-radius:99px;padding:6px 16px;cursor:pointer;color:var(--muted)}
.toggle button.on{background:var(--gold);color:#201400;font-weight:600}
.plans{display:grid;gap:12px;margin-top:18px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.best{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.price{font-family:var(--display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:400}
.plan ul{margin:0;padding-inline-start:18px;color:var(--muted);font-size:.92rem;flex:1}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:420px;width:calc(100% - 36px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog p{color:var(--muted);margin:8px 0 16px}
dialog .btns{display:flex;gap:8px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:.85rem}
@media(min-width:720px){
  .hero{grid-template-columns:1.1fr .9fr}
  .lab{grid-template-columns:1fr 1fr;padding:26px;align-items:center}
  .sky3{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(2,1fr);align-items:start}
  .news{grid-template-columns:repeat(3,1fr)}
  .plans{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<header class="top"><div class="wrap bar">
  <div class="brand"><i></i><span>Suhail</span></div>
  <nav>
    <button data-go="lab" data-t="nav_lab"></button>
    <button data-go="courses" data-t="nav_courses"></button>
    <button data-go="news" data-t="nav_news"></button>
    <button data-go="plans" data-t="nav_plans"></button>
  </nav>
  <select id="lang" aria-label="Language">
    <option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="es">Español</option><option value="tr">Türkçe</option>
  </select>
</div></header>

<main class="wrap">
<section class="hero">
  <div>
    <h1 data-t="hero_h"></h1>
    <p class="lead" style="margin-top:14px" data-t="hero_p"></p>
    <div class="btns"><button class="btn" data-go="courses" data-t="cta_start"></button><button class="btn ghost" data-go="lab" data-t="cta_lab"></button></div>
  </div>
  <div class="sky3" style="margin-top:0;grid-template-columns:1fr">
    <div class="tile"><small data-t="moon"></small><b id="moonName"></b> <span id="moonPct" style="color:var(--muted)"></span></div>
    <div class="tile"><small data-t="sky_jwst"></small><b id="jwstDays"></b></div>
    <div class="tile"><small data-t="sky_voy"></small><b dir="ltr">≈ 25.9 × 10⁹ km</b></div>
  </div>
</section>

<section id="lab">
  <h2 data-t="lab_h"></h2>
  <p class="lead" style="margin:8px 0 18px" data-t="lab_p"></p>
  <div class="lab">
    <canvas id="star" width="640" height="640" role="img" aria-label="Animated star"></canvas>
    <div>
      <div class="slider">
        <label for="mass"><span data-t="mass"></span><span id="massV" dir="ltr"></span></label>
        <input id="mass" type="range" min="0" max="100" step="0.1" value="38.4">
      </div>
      <dl class="facts">
        <div><dt data-t="cls"></dt><dd id="fCls"></dd></div>
        <div><dt data-t="temp"></dt><dd id="fTemp" dir="ltr"></dd></div>
        <div><dt data-t="lum"></dt><dd id="fLum" dir="ltr"></dd></div>
        <div><dt data-t="rad"></dt><dd id="fRad" dir="ltr"></dd></div>
        <div class="wide"><dt data-t="life"></dt><dd id="fLife"></dd></div>
        <div class="wide"><dt data-t="fus"></dt><dd id="fFus"></dd><div class="eq" id="fEq"></div></div>
        <div class="wide"><dt data-t="fate"></dt><dd id="fFate"></dd></div>
      </dl>
      <p class="note" data-t="model_note"></p>
    </div>
  </div>
</section>

<section id="courses">
  <h2 data-t="courses_h"></h2>
  <p class="lead" style="margin-top:8px" data-t="courses_p"></p>
  <p class="note" id="lessonNote" hidden data-t="lesson_note"></p>
  <div class="grid" id="courseGrid"></div>
  <div class="quiz" id="quiz"></div>
</section>

<section id="news">
  <h2 data-t="news_h"></h2>
  <p class="lead" style="margin-top:8px" data-t="news_p"></p>
  <div class="news" id="newsGrid"></div>
  <h3 style="margin-top:22px" data-t="links_h"></h3>
  <div class="links">
    <a href="https://www.nasa.gov/news/">NASA News</a>
    <a href="https://www.esa.int/">ESA</a>
    <a href="https://apod.nasa.gov/apod/">APOD</a>
    <a href="https://science.nasa.gov/mission/webb/">Webb</a>
    <a href="https://science.nasa.gov/exoplanets/">Exoplanets</a>
    <a href="https://www.nasa.gov/humans-in-space/artemis/">Artemis</a>
    <a href="https://arxiv.org/list/astro-ph/new">arXiv astro-ph</a>
  </div>
</section>

<section id="plans">
  <h2 data-t="plans_h"></h2>
  <p class="lead" style="margin-top:8px" data-t="plans_p"></p>
  <div class="toggle"><button id="bM" class="on" data-t="monthly"></button><button id="bY" data-t="yearly"></button></div>
  <div class="plans" id="planGrid"></div>
</section>
</main>

<footer><div class="wrap" data-t="foot"></div></footer>

<dialog id="pay">
  <h3 data-t="pay_h"></h3>
  <p data-t="pay_p"></p>
  <div class="btns"><button class="btn" id="demoOn" data-t="pay_demo"></button><button class="btn ghost" id="payClose" data-t="close"></button></div>
</dialog>

{lv:"b",t:{en:"Night Sky Basics",ar:"أساسيات السماء ليلاً",fr:"Les bases du ciel nocturne",es:"El cielo nocturno",tr:"Gece Gökyüzünün Temelleri"},

 l:[["The celestial sphere","The sky appears to turn once a day around the celestial poles. Polaris sits less than one degree from the north pole, so it barely moves.","الكرة السماوية","تبدو السماء كأنها تدور مرة كل يوم حول القطبين السماويين. يقع النجم القطبي على أقل من درجة واحدة من القطب الشمالي فلا يكاد يتحرك."],
 ["Brightness and magnitude","Smaller magnitude means brighter. Five magnitudes equal a factor of 100 in brightness; Sirius, the brightest night star, is −1.46.","السطوع والقدر","كلما صغر القدر زاد السطوع. خمسة أقدار تساوي فرق 100 مرة في السطوع، والشعرى اليمانية ألمع نجوم الليل بقدر −1.46."],
 ["Constellations","Astronomers divide the whole sky into 88 official constellations. Many bright star names, such as Aldebaran and Altair, come from Arabic.","الكوكبات","يقسّم الفلكيون السماء كلها إلى 88 كوكبة رسمية. كثير من أسماء النجوم اللامعة مثل الدبران والنسر الطائر أصلها عربي."],
 ["Moon phases and eclipses","The Moon cycles through its phases every 29.5 days. Eclipses happen only when a new or full Moon crosses Earth's orbital plane.","أطوار القمر والكسوف","يمر القمر بأطواره كل 29.5 يوماً. يحدث الكسوف والخسوف فقط حين يعبر المحاق أو البدر مستوى مدار الأرض."]]},
{lv:"b",t:{en:"The Solar System",ar:"النظام الشمسي",fr:"Le Système solaire",es:"El sistema solar",tr:"Güneş Sistemi"},

 l:[["Scale of the system","One astronomical unit is 149.6 million km. The Sun holds 99.86% of all the mass in the Solar System.","مقياس النظام","الوحدة الفلكية تساوي 149.6 مليون كم. تحتوي الشمس على 99.86% من كتلة النظام الشمسي كله."],
 ["Rocky planets","Mercury, Venus, Earth and Mars formed inside the frost line where only rock and metal could condense.","الكواكب الصخرية","تكوّنت عطارد والزهرة والأرض والمريخ داخل خط الصقيع حيث لا يتكثف إلا الصخر والمعدن."],
 ["Giant planets","Jupiter has 318 times Earth's mass. Jupiter and Saturn are mostly hydrogen and helium; Uranus and Neptune are ice giants.","الكواكب العملاقة","كتلة المشتري 318 ضعف كتلة الأرض. المشتري وزحل معظمهما هيدروجين وهيليوم، وأورانوس ونبتون عملاقان جليديان."],
 ["Small bodies","Asteroids, comets and the Kuiper belt (30–50 AU) are leftovers from planet formation and record the system's early history.","الأجرام الصغيرة","الكويكبات والمذنبات وحزام كايبر (30–50 وحدة فلكية) بقايا من تكوّن الكواكب وتحفظ تاريخ النظام المبكر."]]},
{lv:"i",t:{en:"The Life of Stars",ar:"حياة النجوم",fr:"La vie des étoiles",es:"La vida de las estrellas",tr:"Yıldızların Yaşamı"},

 l:[["Star birth","Cold molecular clouds collapse under gravity. A protostar becomes a star when its core reaches about 10 million K and hydrogen fusion begins.","ولادة النجوم","تنهار السحب الجزيئية الباردة بفعل الجاذبية. يصبح النجم الأولي نجماً عندما تبلغ حرارة قلبه نحو 10 ملايين كلفن ويبدأ اندماج الهيدروجين."],
 ["The H–R diagram","Plot luminosity against temperature and most stars fall on one band, the main sequence, where they spend about 90% of their lives.","مخطط هرتزشبرونغ–راسل","عند رسم اللمعان مقابل الحرارة تقع معظم النجوم على شريط واحد هو التسلسل الرئيسي، حيث تقضي نحو 90% من عمرها."],
 ["Our Sun's timeline","The Sun is 4.6 billion years old and about halfway through hydrogen burning. It will become a red giant, then a white dwarf.","الخط الزمني للشمس","عمر الشمس 4.6 مليار سنة وهي في منتصف مرحلة حرق الهيدروجين تقريباً. ستصبح عملاقاً أحمر ثم قزماً أبيض."],
 ["Supernovae","Stars above about 8 solar masses end in core collapse. For weeks one supernova can outshine its entire galaxy.","المستعرات العظمى","النجوم التي تزيد كتلتها على نحو 8 كتل شمسية تنتهي بانهيار القلب. قد يسطع المستعر الأعظم لأسابيع أكثر من مجرته كلها."]]},
{lv:"a",t:{en:"Stellar Fusion and the Elements",ar:"الاندماج النجمي ونشأة العناصر",fr:"Fusion stellaire et éléments",es:"Fusión estelar y elementos",tr:"Yıldız Füzyonu ve Elementler"},

 l:[["Why fusion happens","Core protons lack the energy to cross the Coulomb barrier classically. Quantum tunnelling lets a tiny fraction fuse, at the Gamow peak energy.","لماذا يحدث الاندماج","لا تملك بروتونات القلب طاقة كافية لعبور حاجز كولوم كلاسيكياً. النفق الكمومي يسمح لنسبة ضئيلة بالاندماج عند طاقة قمة غامو."],
 ["pp chain and CNO cycle","Both turn four protons into one helium-4 nucleus and release 26.73 MeV. The CNO cycle takes over above about 1.3 solar masses.","سلسلة pp ودورة CNO","كلتاهما تحوّل أربعة بروتونات إلى نواة هيليوم-4 وتطلق 26.73 ميغا إلكترون فولت. تسود دورة CNO فوق نحو 1.3 كتلة شمسية."],
 ["Helium burning and beyond","At about 100 million K the triple-alpha process makes carbon. Massive stars go on to burn carbon, neon, oxygen and silicon up to the iron peak.","حرق الهيليوم وما بعده","عند نحو 100 مليون كلفن تصنع عملية ألفا الثلاثية الكربون. النجوم الضخمة تواصل حرق الكربون والنيون والأكسجين والسيليكون حتى قمة الحديد."],
 ["Heavier than iron","Fusion past iron costs energy, so heavier elements come from neutron capture: the slow s-process in giant stars and the rapid r-process in neutron-star mergers.","أثقل من الحديد","الاندماج بعد الحديد يستهلك طاقة، فتتكوّن العناصر الأثقل بأسر النيوترونات: العملية البطيئة s في النجوم العملاقة والسريعة r في اندماج النجوم النيوترونية."]]},

 l:[["White dwarfs","Electron degeneracy pressure supports a white dwarf up to the Chandrasekhar limit of about 1.44 solar masses.","الأقزام البيضاء","ضغط انحلال الإلكترونات يسند القزم الأبيض حتى حد تشاندراسيخار، نحو 1.44 كتلة شمسية."],
 ["Neutron stars and pulsars","More than a solar mass packed into a ball about 20 km across. Spinning, magnetised ones sweep radio beams past us as pulsars.","النجوم النيوترونية والنوابض","أكثر من كتلة شمسية مضغوطة في كرة قطرها نحو 20 كم. الدوّارة الممغنطة منها تمسحنا بحزم راديوية فنراها نوابض."],
 ["Event horizons","The Schwarzschild radius is r = 2GM/c², about 3 km per solar mass. Nothing inside it can return, not even light.","آفاق الحدث","نصف قطر شفارتزشيلد r = 2GM/c²، أي نحو 3 كم لكل كتلة شمسية. لا شيء داخله يستطيع العودة، ولا حتى الضوء."],
 ["Gravitational waves","LIGO first detected merging black holes in 2015. Mergers now give a second way to observe the universe besides light.","الأمواج الثقالية","رصد مرصد لايغو اندماج ثقبين أسودين لأول مرة عام 2015. صارت الاندماجات وسيلة ثانية لرصد الكون غير الضوء."]]},

// ---------- star physics (simplified main sequence) ----------
function starOf(M){
  const L=M<0.43?0.23*Math.pow(M,2.3):M<2?Math.pow(M,4):1.4*Math.pow(M,3.5);
  const R=M<1?Math.pow(M,0.8):Math.pow(M,0.7);
  const T=5772*Math.pow(L/(R*R),0.25);
  const bands=[[3700,"M","#ff8a5c"],[5200,"K","#ffb36b"],[6000,"G","#ffe08a"],[7500,"F","#fff4d6"],[10000,"A","#f2f4ff"],[30000,"B","#bcd0ff"],[1e9,"O","#9bb4ff"]];
  const b=bands.find(x=>T<x[0]);
  return {M,L,R,T,cls:b[1],col:b[2],life:10*M/L};
}
const sig=x=>x>=100?Math.round(x).toLocaleString("en"):x>=10?x.toFixed(0):x>=1?x.toFixed(1):x.toPrecision(2);
let S=starOf(1);
function renderStar(){
  const M=0.1*Math.pow(400,$("mass").value/100); S=starOf(M);
  $("massV").textContent=sig(M)+" M☉";
  $("fCls").textContent=S.cls;
  $("fTemp").textContent=Math.round(S.T/10)*10+" K";
  $("fLum").textContent=sig(S.L)+" L☉";
  $("fRad").textContent=sig(S.R)+" R☉";
  $("fLife").textContent="≈ "+(S.life>=1?sig(S.life)+" "+t("byr"):sig(S.life*1000)+" "+t("myr"));
  const cno=M>=1.3;
  $("fFus").textContent=t(cno?"fus_cno":"fus_pp");
  $("fEq").textContent=cno?"¹²C → ¹³N → ¹³C → ¹⁴N → ¹⁵O → ¹⁵N → ¹²C + ⁴He   (26.73 MeV)":"4 ¹H → ⁴He + 2e⁺ + 2νₑ + 26.73 MeV";
  $("fFate").textContent=t(M<0.5?"fate1":M<8?"fate2":M<20?"fate3":"fate4");
}

// ---------- star canvas ----------
const cv=$("star"),cx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
const cells=Array.from({length:46},()=>({a:Math.random()*6.28,r:Math.sqrt(Math.random()),s:.2+Math.random()*.5,p:Math.random()*6.28}));
const rays=Array.from({length:70},()=>({a:Math.random()*6.28,d:Math.random(),v:.15+Math.random()*.35}));
function drawStar(ts){
  const w=cv.width,c=w/2,tt=ts/1000;
  const size=(Math.log10(S.R)+0.85)/2.0; // ~0..1
  const r=w*(0.13+0.2*Math.max(0,Math.min(1,size)))*(1+0.012*Math.sin(tt*1.7));
  cx.clearRect(0,0,w,w);
  let g=cx.createRadialGradient(c,c,r*.6,c,c,w*.5);
  g.addColorStop(0,S.col+"aa");g.addColorStop(.35,S.col+"33");g.addColorStop(1,S.col+"00");
  cx.fillStyle=g;cx.fillRect(0,0,w,w);
  cx.fillStyle=S.col;
  for(const p of rays){p.d+=p.v*(still?0:.006);if(p.d>1){p.d=0;p.a=Math.random()*6.28}
    const d=r+p.d*(w*.5-r);cx.globalAlpha=(1-p.d)*.7;cx.beginPath();cx.arc(c+Math.cos(p.a)*d,c+Math.sin(p.a)*d,1.6+2*(1-p.d),0,6.28);cx.fill()}
  cx.globalAlpha=1;
  g=cx.createRadialGradient(c-r*.15,c-r*.15,r*.05,c,c,r);
  g.addColorStop(0,"#ffffff");g.addColorStop(.55,S.col);g.addColorStop(1,S.col+"cc");
  cx.save();cx.beginPath();cx.arc(c,c,r,0,6.28);cx.clip();cx.fillStyle=g;cx.fillRect(0,0,w,w);
  for(const k of cells){const a=k.a+tt*.05*k.s,rr=k.r*r*.92,al=.10+.08*Math.sin(tt*k.s*2+k.p);
    cx.globalAlpha=Math.max(0,al);cx.fillStyle=k.p>3?"#ffffff":"#000000";cx.beginPath();cx.arc(c+Math.cos(a)*rr,c+Math.sin(a)*rr,r*(.06+.1*k.s),0,6.28);cx.fill()}
  cx.restore();cx.globalAlpha=1;
  if(!still)requestAnimationFrame(drawStar);
}

// ---------- background sky ----------
function drawSky(){
  const s=$("sky"),d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
  s.width=w*d;s.height=h*d;const x=s.getContext("2d");x.scale(d,d);
  const g=x.createRadialGradient(w*.8,0,0,w*.8,0,Math.max(w,h));g.addColorStop(0,"#16204a");g.addColorStop(.6,"#070b1a");
  x.fillStyle=g;x.fillRect(0,0,w,h);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const n=Math.round(w*h/3800);
  for(let i=0;i<n;i++){const m=rnd();x.globalAlpha=.25+m*.6;x.fillStyle=["#ffffff","#bcd0ff","#ffe08a","#ffb36b"][Math.floor(rnd()*4)];
    x.beginPath();x.arc(rnd()*w,rnd()*h,m>.97?1.5:m*.9,0,6.28);x.fill()}
}

// ---------- live sky numbers ----------
function sky(){
  const syn=29.530588853,now=Date.now();
  let age=((now-Date.UTC(2000,0,6,18,14))/864e5)%syn;
  const f=age/syn;
  $("moonName").textContent=t("ph")[Math.floor(f*8+.5)%8];
  $("moonPct").textContent=Math.round((1-Math.cos(2*Math.PI*f))/2*100)+"% "+t("illum");
  $("jwstDays").textContent=Math.floor((now-Date.UTC(2021,11,25,12,20))/864e5).toLocaleString("en");
}

// ---------- courses ----------
function renderCourses(){
  $("lessonNote").hidden=!t("lesson_note");
  $("courseGrid").innerHTML=C.map((c,i)=>{
    const dn=c.l.filter((_,j)=>done[i+"-"+j]).length;
    return `<div class="course${i===openC?" open":""}"><button data-c="${i}" aria-expanded="${i===openC}">
      <div class="meta"><span class="pill ${c.lv}">${t("lvl_"+c.lv)}</span><span>${c.l.length} ${t("lessons")}</span><span>${dn}/${c.l.length}</span></div>
      <h3>${esc(c.t[lang])}</h3><p>${esc(c.d[lang])}</p></button>
      <div class="prog"><i style="width:${dn/c.l.length*100}%"></i></div>
      <div class="lessons">${c.l.map((l,j)=>{
        const o=cl()==="ar"?2:0,lock=j>0&&!sub,k=i+"-"+j;
        return `<div class="lesson${lock?" lock":""}"><h4>${j+1}. ${esc(l[o])}<span>${j===0?t("free"):t("locked")}</span></h4>
        <p${lang!=="ar"&&!lock?' dir="ltr"':""}>${lock?t("lock_text"):esc(l[o+1])}</p>
        ${lock?"":`<button data-d="${k}" class="${done[k]?"on":""}">${done[k]?"✓ "+t("done"):t("mark")}</button>`}</div>`}).join("")}</div></div>`}).join("");
}
$("courseGrid").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.c!==undefined){const i=+b.dataset.c;openC=openC===i?-1:i;renderCourses()}
  else if(b.dataset.d){done[b.dataset.d]=!done[b.dataset.d];store.set("done",done);renderCourses()}
});

// ---------- quiz ----------
function renderQuiz(){
  const el=$("quiz");
  if(qi>=Q.length){el.innerHTML=`<h3>${t("quiz_h")}</h3><p style="margin:10px 0" class="price">${qs} / ${Q.length}</p><p class="note">${t("quiz_score")}</p><button class="btn" id="qAgain" style="margin-top:12px">${t("quiz_again")}</button>`;
    $("qAgain").onclick=()=>{qi=0;qs=0;qAns=-1;renderQuiz()};return}
  const q=Q[qi],x=q[cl()];
  el.innerHTML=`<h3>${t("quiz_h")} · ${qi+1}/${Q.length}</h3><p style="margin-top:8px"${lang!=="ar"?' dir="ltr"':""}>${esc(x[0])}</p><div class="opts">${x[1].map((o,i)=>`<button data-o="${i}" class="${qAns<0?"":i===q.a?"right":i===qAns?"wrong":""}"${qAns>=0?" disabled":""}>${esc(o)}</button>`).join("")}</div>${qAns>=0?`<button class="btn" id="qNext" style="margin-top:12px">→</button>`:""}`;
  if(qAns>=0)$("qNext").onclick=()=>{qi++;qAns=-1;renderQuiz()};
}
$("quiz").addEventListener("click",e=>{const b=e.target.closest("[data-o]");if(!b||qAns>=0)return;qAns=+b.dataset.o;if(qAns===Q[qi].a)qs++;renderQuiz()});

// ---------- wiring ----------
function go(id){$(id).scrollIntoView({behavior:still?"auto":"smooth",block:"start"})}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("lang").value=lang;renderStar();sky();renderCourses();renderNews();renderQuiz();renderPlans();
}
$("lang").onchange=e=>{lang=e.target.value;store.set("lang",lang);applyLang()};
$("mass").oninput=()=>{renderStar();if(still)drawStar(0)};
addEventListener("resize",drawSky);
drawSky();applyLang();requestAnimationFrame(drawStar);
