<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeutrAI Academy</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet lab-notebook page around one bold element, a reactor-pool panel lit in Cherenkov blue. */
:root{
  --paper:#F2F5F9; --surface:#FFFFFF; --ink:#0D1B2A; --muted:#55657A; --line:#D5DDE8;
  --glow:#0A6FD1; --glow-soft:#DCEBFA; --hot:#B4530B; --ok:#1B7F4B; --crit:#B3261E;
  --pool:#051426; --pool-2:#0A2A4A; --pool-ink:#E8F3FF; --pool-muted:#8FB4D9; --pool-glow:#55BEFF;
  --display:"Archivo","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#061320; --surface:#0C1E31; --ink:#E6F0FA; --muted:#8FA6BF; --line:#1D3550;
    --glow:#4DB5FF; --glow-soft:#0F2E4A; --hot:#F2A65A; --ok:#5BD197; --crit:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#061320; --surface:#0C1E31; --ink:#E6F0FA; --muted:#8FA6BF; --line:#1D3550;
  --glow:#4DB5FF; --glow-soft:#0F2E4A; --hot:#F2A65A; --ok:#5BD197; --crit:#FF8A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
[dir="rtl"] .track>h3,[dir="rtl"] .ex b,[dir="rtl"] .pool .eyebrow{letter-spacing:0;font-family:var(--body)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--display);font-stretch:112%;font-weight:800;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,7vw,3.2rem)}
h2{font-size:clamp(1.4rem,4.5vw,2rem)}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--glow)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto;padding-inline:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:1.05rem;text-decoration:none;color:var(--ink)}
.brand svg{width:26px;height:26px;flex:none}
.brand span span{color:var(--glow)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;max-width:9.5rem}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:500;font-size:.95rem}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}

main{padding-block:20px 48px}
.view{display:grid;gap:24px}
.head{display:grid;gap:6px}
.head p{color:var(--muted);max-width:60ch}

/* hero pool */
.pool{background:radial-gradient(120% 90% at 50% 110%,#0E4C86 0%,var(--pool-2) 38%,var(--pool) 78%);color:var(--pool-ink);border-radius:20px;padding:22px 18px;display:grid;gap:22px;overflow:hidden}
.pool .eyebrow{font-family:var(--mono);font-size:.78rem;color:var(--pool-glow);letter-spacing:.02em}
.pool .lede{color:var(--pool-muted);max-width:52ch;margin-top:10px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;text-decoration:none;cursor:pointer;background:var(--glow);color:#fff;min-height:44px}
:root[data-theme="dark"] .btn,.pool .btn{background:var(--pool-glow);color:#04121F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:var(--pool-glow);color:#04121F}}
.btn.ghost,.pool .btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.small{min-height:36px;padding:6px 12px;font-size:.92rem}
.btn[disabled]{opacity:.55;cursor:default}
.explorer{background:rgba(3,14,27,.55);border:1px solid rgba(85,190,255,.25);border-radius:14px;padding:14px;display:grid;gap:10px}
.explorer h3{color:var(--pool-ink)}
.explorer canvas{width:100%;height:190px;display:block;touch-action:pan-y;cursor:crosshair}
.readout{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.readout .nuc{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:1.7rem;color:var(--pool-glow)}
.readout .mono{font-size:.9rem;color:var(--pool-ink)}
.explorer label{font-size:.85rem;color:var(--pool-muted);display:grid;gap:4px}
.explorer .say{font-size:.95rem}
.explorer .note{font-size:.78rem;color:var(--pool-muted)}
input[type=range]{width:100%;accent-color:var(--glow);min-height:28px}
.pool input[type=range]{accent-color:var(--pool-glow)}
@media (min-width:820px){.pool{grid-template-columns:1fr 1fr;align-items:center;padding:36px}}

/* courses */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.track{display:grid;gap:10px}
.track>h3{display:flex;align-items:center;gap:8px;font-size:.82rem;font-family:var(--mono);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.track>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.course{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:10px;align-content:space-between;min-height:118px}
.course:hover{border-color:var(--glow)}
.course .code{font-family:var(--mono);font-size:.75rem;color:var(--glow)}
.course .name{font-family:var(--display);font-stretch:112%;font-weight:600;font-size:1.02rem;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:.74rem;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.free{color:var(--ok);border-color:var(--ok)}
.pill.lock{color:var(--hot);border-color:var(--hot)}
.pill.done{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.meter{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--glow)}

.detail{display:grid;gap:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--glow);cursor:pointer;font-weight:500;text-align:start}
.split{display:grid;gap:16px}
@media (min-width:820px){.split{grid-template-columns:300px 1fr;align-items:start}}
.mods{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mods button{width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between}
.mods button[aria-current="true"]{border-color:var(--glow);background:var(--glow-soft)}
.mods .n{font-family:var(--mono);color:var(--muted);font-size:.8rem;margin-inline-end:8px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.lesson p{max-width:65ch}
.eq{font-family:var(--mono);background:var(--glow-soft);border-inline-start:3px solid var(--glow);padding:10px 12px;border-radius:6px;overflow-x:auto;direction:ltr;text-align:left;white-space:nowrap}
.ex{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:4px}
.ex b{font-size:.78rem;font-family:var(--mono);font-weight:500;color:var(--hot);text-transform:uppercase;letter-spacing:.05em}
.ai{white-space:pre-wrap;border-top:1px solid var(--line);padding-top:12px;max-width:65ch}
.ainote{font-size:.8rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* lab */
.panels{display:grid;gap:14px}
@media (min-width:820px){.panels{grid-template-columns:1fr 1fr;align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.panel canvas{width:100%;height:160px;display:block}
.fields{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.fields label,.sl label{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}
.fields select,.fields input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px;width:100%;min-width:0}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.out div{background:var(--paper);border-radius:8px;padding:8px 10px}
.out small{display:block;color:var(--muted);font-size:.75rem}
.out b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.sl{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.sl label span{display:flex;justify-content:space-between;gap:6px;direction:ltr}
.sl label b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.kbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.kbox .k{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:2rem;direction:ltr}
.state{border-radius:999px;padding:3px 12px;font-weight:600;font-size:.85rem;color:var(--paper)}
.state.sub{background:var(--muted)} .state.crit{background:var(--ok)} .state.sup{background:var(--crit)}

/* briefing */
.news{list-style:none;margin:0;padding:0;display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.news li{display:grid;gap:4px;padding:12px 14px;border-top:1px solid var(--line)}
.news li:first-child{border-top:0}
.news a{color:var(--ink);font-weight:500;text-decoration:none}
.news a:hover{color:var(--glow);text-decoration:underline}

/* tutor */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.msgs{display:grid;gap:10px;max-height:52vh;overflow-y:auto}
.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;max-width:65ch;overflow-wrap:anywhere}
.msg.u{background:var(--ink);color:var(--paper);justify-self:end}
.msg.a{background:var(--glow-soft)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px}
.notice{background:var(--glow-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}

/* pricing */
.toggles{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:500;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.plans{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start}
.plan.pick{border:2px solid var(--glow)}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:2rem;direction:ltr}
.price span{color:var(--muted);font-size:.85rem}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.92rem}
.plan li{padding-inline-start:18px;position:relative}
.plan li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--glow)}
.plan .btn{width:100%}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;max-width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(3,14,27,.6)}
dialog .stack{display:grid;gap:12px}
footer{border-top:1px solid var(--line);padding-block:16px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.course,.chip,.btn{transition:border-color .15s,background-color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#home" aria-label="NeutrAI Academy">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4" fill="currentColor"/><g fill="none" stroke="var(--glow)" stroke-width="1.6"><ellipse cx="16" cy="16" rx="14" ry="5.5"/><ellipse cx="16" cy="16" rx="14" ry="5.5" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="14" ry="5.5" transform="rotate(120 16 16)"/></g></svg>
        <span>Neutr<span>AI</span> Academy</span>
      </a>
      <select class="lang" id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
      </select>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#home" data-v="home" data-i="nav_home"></a>
      <a href="#courses" data-v="courses" data-i="nav_courses"></a>
      <a href="#lab" data-v="lab" data-i="nav_lab"></a>
      <a href="#briefing" data-v="briefing" data-i="nav_brief"></a>
      <a href="#tutor" data-v="tutor" data-i="nav_tutor"></a>
      <a href="#pricing" data-v="pricing" data-i="nav_pricing"></a>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- HOME -->
  <section class="view" id="v-home">
    <div class="pool">
      <div>
        <div class="eyebrow" data-i="hero_eyebrow"></div>
        <h1 data-i="hero_h" style="margin-top:10px"></h1>
        <p class="lede" data-i="hero_p"></p>
        <div class="cta">
          <a class="btn" href="#pricing" data-i="cta_start"></a>
          <a class="btn ghost" href="#courses" data-i="cta_browse"></a>
        </div>
      </div>
      <div class="explorer">
        <h3 data-i="be_title"></h3>
        <canvas id="beC" aria-label="Binding energy curve"></canvas>
        <div class="readout">
          <span class="nuc" id="beNuc" dir="ltr"></span>
          <span class="mono" id="beVal" dir="ltr"></span>
        </div>
        <label><span data-i="be_mass"></span>
          <input type="range" id="beA" min="8" max="260" step="1" value="56">
        </label>
        <p class="say" id="beSay"></p>
        <p class="note" data-i="be_note"></p>
      </div>
    </div>
    <div id="homeCourses"></div>
  </section>

  <!-- COURSES -->
  <section class="view" id="v-courses" hidden>
    <div id="courseList" class="view"></div>
    <div id="courseDetail" class="detail" hidden></div>
  </section>

  <!-- LAB -->
  <section class="view" id="v-lab" hidden>
    <div class="head"><h2 data-i="nav_lab"></h2><p data-i="lab_p"></p></div>
    <div class="panels">
      <div class="panel">
        <h3 data-i="decay_h"></h3>
        <div class="fields">
          <label><span data-i="iso"></span><select id="dIso"></select></label>
          <label><span data-i="a0"></span><input id="dA0" type="number" min="0" step="any" value="1000000" inputmode="decimal"></label>
        </div>
        <canvas id="dC" aria-label="Decay curve"></canvas>
        <label class="muted" style="font-size:.82rem;display:grid;gap:4px"><span data-i="elapsed"></span>
          <input type="range" id="dT" min="0" max="6" step="0.05" value="1">
        </label>
        <div class="out">
          <div><small data-i="halflife"></small><b id="dHL" dir="ltr"></b></div>
          <div><small data-i="elapsed"></small><b id="dEl" dir="ltr"></b></div>
          <div><small data-i="remaining"></small><b id="dRem" dir="ltr"></b></div>
          <div><small data-i="activity"></small><b id="dAct" dir="ltr"></b></div>
        </div>
      </div>
      <div class="panel">
        <h3 data-i="ff_h"></h3>
        <p class="muted" style="font-size:.9rem" data-i="ff_p"></p>
        <div class="eq">k = η · f · p · ε · P_FNL · P_TNL</div>
        <div class="sl" id="ffS"></div>
        <div class="kbox">
          <span class="k mono" id="ffK"></span>
          <span class="state" id="ffState"></span>
          <span class="mono muted" id="ffRho" dir="ltr"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- BRIEFING -->
  <section class="view" id="v-briefing" hidden>
    <div class="head"><h2 data-i="nav_brief"></h2><p data-i="brief_p"></p></div>
    <ul class="news" id="news"></ul>
    <div class="row"><button class="btn small ghost" id="newsTr" data-i="brief_tr" hidden></button></div>
    <div class="lesson" id="newsOut" hidden><div class="ai" style="border:0;padding:0"></div><p class="ainote" data-i="ai_label"></p></div>
  </section>

  <!-- TUTOR -->
  <section class="view" id="v-tutor" hidden>
    <div class="head"><h2 data-i="nav_tutor"></h2><p data-i="tutor_p"></p></div>
    <div class="notice" id="aiOff" data-i="ai_off"></div>
    <div class="chat">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="chips" id="quick"></div>
      <form class="ask" id="ask">
        <input id="q" autocomplete="off">
        <button class="btn" type="submit" data-i="send"></button>
      </form>
    </div>
  </section>

  <!-- PRICING -->
  <section class="view" id="v-pricing" hidden>
    <div class="head"><h2 data-i="nav_pricing"></h2><p data-i="pricing_p"></p></div>
    <div class="toggles">
      <div class="seg" id="segScope">
        <button data-s="phys" data-i="scope_phys"></button>
        <button data-s="full" data-i="scope_full"></button>
      </div>
      <div class="seg" id="segBill">
        <button data-b="m" data-i="monthly"></button>
        <button data-b="y" data-i="yearly"></button>
      </div>
    </div>
    <div class="plans" id="plans"></div>
  </section>
</main>

<dialog id="co">
  <div class="stack">
    <h3 data-i="co_h"></h3>
    <p class="mono" id="coLine" dir="ltr"></p>
    <p data-i="co_p"></p>
    <div class="row">
      <button class="btn" id="coGo" data-i="co_go"></button>
      <button class="btn ghost" id="coNo" data-i="cancel"></button>
    </div>
  </div>
</dialog>

<footer><div class="wrap" data-i="foot"></div></footer>

<script>
"use strict";
/* ---------- translations ---------- */

  l:[["p","A force is a push or pull that changes how an object moves. Newton's second law says the net force on an object equals the rate of change of its momentum. When the mass stays constant this becomes the familiar form below."],["eq","F = m a"],["p","Always start with a free-body diagram: draw every force acting on the object, pick axes, and apply the law along each axis separately. Force is measured in newtons, where 1 N = 1 kg·m/s²."],["ex","A 1,200 kg car speeds up from rest to 27 m/s in 9.0 s. Acceleration a = 27 / 9.0 = 3.0 m/s². Net force F = 1,200 × 3.0 = 3,600 N."]]},
 {id:"p2",code:"PHY 201",track:"phys",lvl:"uni",t:["Electromagnetism","الكهرومغناطيسية","Électromagnétisme","Electromagnetismo","电磁学"],

  l:[["p","Electric charges exert forces on each other. Like charges repel and opposite charges attract. Coulomb's law gives the size of the force between two point charges separated by a distance r."],["eq","F = k q₁q₂ / r²,   k = 8.99 × 10⁹ N·m²/C²"],["p","The force falls with the square of the distance, so halving the separation makes it four times stronger. Gravity follows the same inverse-square rule, but the electric force between two protons is about 10³⁶ times stronger than their gravitational attraction."],["ex","Two protons (q = 1.602 × 10⁻¹⁹ C) sit 1.0 fm apart inside a nucleus. F = 8.99 × 10⁹ × (1.602 × 10⁻¹⁹)² / (1.0 × 10⁻¹⁵)² ≈ 230 N. That is an enormous force on one proton, which is why a stronger attractive force is needed to hold nuclei together."]]},
 {id:"p3",code:"PHY 301",track:"phys",lvl:"uni",t:["Quantum Mechanics","ميكانيكا الكم","Mécanique quantique","Mecánica cuántica","量子力学"],

/* ---------- binding energy (hero) ---------- */
const SYM = "n H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds".split(" ");
function semf(A,Z){
  const N=A-Z; let d=0;
  if(A%2===0) d = (Z%2===0?1:-1)*11.18/Math.sqrt(A);
  return 15.75*A - 17.8*Math.pow(A,2/3) - 0.711*Z*(Z-1)/Math.cbrt(A) - 23.7*(N-Z)*(N-Z)/A + d;
}
function best(A){ let bz=1,bb=-1e9; for(let Z=1;Z<A;Z++){const b=semf(A,Z); if(b>bb){bb=b;bz=Z}} return {Z:bz,B:bb}; }
const BE = []; for(let A=8;A<=260;A++){ const r=best(A); BE.push({A,Z:r.Z,B:r.B,ba:r.B/A}); }
function fit(c){ const r=c.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2); c.width=Math.round(r.width*d); c.height=Math.round(r.height*d); const g=c.getContext("2d"); g.setTransform(d,0,0,d,0,0); return {g,w:r.width,h:r.height}; }
function drawBE(){
  const c=$("#beC"); if(!c.offsetParent) return; const {g,w,h}=fit(c); const A=+$("#beA").value;
  const L=30,R=8,Tp=10,B=22, X=a=>L+(a/260)*(w-L-R), Y=v=>Tp+(1-v/9)*(h-Tp-B);
  g.clearRect(0,0,w,h); g.font="11px 'IBM Plex Mono',monospace"; g.fillStyle="#8FB4D9"; g.strokeStyle="rgba(143,180,217,.18)"; g.lineWidth=1;
  g.textAlign="right"; g.textBaseline="middle";
  [0,3,6,9].forEach(v=>{ g.beginPath(); g.moveTo(L,Y(v)); g.lineTo(w-R,Y(v)); g.stroke(); g.fillText(v,L-6,Y(v)); });
  g.textAlign="center"; g.textBaseline="top";
  [50,100,150,200,250].forEach(a=>g.fillText(a,X(a),h-B+6));
  const grad=g.createLinearGradient(0,Tp,0,h-B); grad.addColorStop(0,"rgba(85,190,255,.45)"); grad.addColorStop(1,"rgba(85,190,255,0)");
  g.beginPath(); BE.forEach((p,i)=> i? g.lineTo(X(p.A),Y(p.ba)) : g.moveTo(X(p.A),Y(p.ba)));
  g.strokeStyle="#55BEFF"; g.lineWidth=2; g.lineJoin="round"; g.stroke();
  g.lineTo(X(260),Y(0)); g.lineTo(X(8),Y(0)); g.closePath(); g.fillStyle=grad; g.fill();
  const p=BE[A-8]; g.strokeStyle="rgba(232,243,255,.6)"; g.lineWidth=1; g.setLineDash([3,3]); g.beginPath(); g.moveTo(X(A),Y(0)); g.lineTo(X(A),Y(p.ba)); g.stroke(); g.setLineDash([]);
  g.beginPath(); g.arc(X(A),Y(p.ba),5,0,7); g.fillStyle="#E8F3FF"; g.fill(); g.strokeStyle="#55BEFF"; g.lineWidth=2; g.stroke();
  $("#beNuc").textContent = SYM[p.Z]+"-"+A;
  $("#beVal").textContent = "Z "+p.Z+" · N "+(A-p.Z)+" · B/A "+p.ba.toFixed(2)+" MeV · B "+Math.round(p.B)+" MeV";
  $("#beSay").textContent = t(A<50?"be_fus":A<=70?"be_peak":"be_fis");
}
$("#beA").addEventListener("input",drawBE);
$("#beC").addEventListener("pointerdown",e=>{ const r=e.currentTarget.getBoundingClientRect(); const a=Math.round(((e.clientX-r.left-30)/(r.width-38))*260); $("#beA").value=Math.max(8,Math.min(260,a)); drawBE(); });

function unlocked(c,i){
  if(i===0) return true;
  if(S.plan==="free") return false;
  if(c.track==="neng" && S.planScope!=="full") return false;
  if(c.lvl==="pro" && S.plan==="student") return false;
  return true;
}
function doneCount(c){ return c.m.filter((_,i)=>S.done[c.id+"."+i]).length; }
function courseCard(c){
  const n=doneCount(c);
  return `<button class="course" data-c="${c.id}"><span><span class="code">${c.code}</span><br><span class="name">${esc(ct(c))}</span></span>
  <span style="display:grid;gap:8px"><span class="meta"><span class="pill">${t("lvl_"+c.lvl)}</span><span>${c.m.length} ${t("lessons")}</span>${n?`<span class="mono">${n}/${c.m.length}</span>`:""}</span>

}
function tracksHTML(filter){

      + `<div class="row"><button class="btn small" id="mk">${S.done[key]?t("done")+" ✓":t("mark_done")}</button>${sample&&S.lang!=="en"?`<button class="btn small ghost" id="tr">${t("translate_btn")}</button>`:""}</div>

  } else {
    body = (sample ? `<div class="row"><button class="btn small" id="gen">${t("generate_btn")}</button><button class="btn small ghost" id="mk">${S.done[key]?t("done")+" ✓":t("mark_done")}</button></div>` : `<p class="notice">${t("ai_off")}</p>`)
      + `<div id="aiBox" hidden><div class="ai" id="aiTxt" dir="auto"></div><p class="ainote">${t("ai_label")}</p></div>`;

function drawDecay(){
  const c=$("#dC"); const iso=ISO[+$("#dIso").value], n=+$("#dT").value, a0=Math.max(0,+$("#dA0").value||0), frac=Math.pow(2,-n);

  if(!c.offsetParent) return; const {g,w,h}=fit(c);
  const L=34,R=8,Tp=8,B=22, X=x=>L+(x/6)*(w-L-R), Y=v=>Tp+(1-v)*(h-Tp-B);
  g.clearRect(0,0,w,h); g.font="11px 'IBM Plex Mono',monospace"; g.fillStyle=css("--muted"); g.strokeStyle=css("--line"); g.lineWidth=1;

  g.textAlign="center"; g.textBaseline="top"; for(let x=0;x<=6;x++) g.fillText(x,X(x),h-B+6);

  g.lineTo(X(6),Y(0)); g.lineTo(X(0),Y(0)); g.closePath(); g.globalAlpha=.12; g.fillStyle=css("--glow"); g.fill(); g.globalAlpha=1;
  g.beginPath(); g.arc(X(n),Y(frac),5,0,7); g.fillStyle=css("--surface"); g.fill(); g.strokeStyle=css("--hot"); g.lineWidth=2.5; g.stroke();
}

const FF = [["η",1.2,2.2,.01,1.84],["f",.5,1,.005,.71],["p",.5,1,.005,.77],["ε",1,1.1,.005,1.04],["P_FNL",.8,1,.005,.97],["P_TNL",.8,1,.005,.985]];

function calcFF(){
  let k=1; FF.forEach((x,i)=>{ const v=+$("#ff"+i).value; k*=v; $("#ffv"+i).textContent=v.toFixed(3); });
  const rho=(k-1)/k*1e5, st = Math.abs(k-1)<5e-4?"crit":k<1?"sub":"sup";
  $("#ffK").textContent="k = "+k.toFixed(4);
  $("#ffState").className="state "+st; $("#ffState").textContent=t(st);
  $("#ffRho").textContent="ρ = "+(rho>=0?"+":"−")+Math.abs(rho).toFixed(0)+" pcm";
}

function bubble(role,text){ const d=document.createElement("div"); d.className="msg "+role; d.textContent=text; $("#msgs").appendChild(d); d.scrollIntoView({block:"nearest"}); return d; }
async function ask(q){
  q=q.trim(); if(!q||!sample) return;
  bubble("u",q); chat.push({role:"user",content:q}); $("#q").value="";
  const sys=`You are the tutor of NeutrAI Academy, which teaches physics, nuclear physics and nuclear engineering to school students, university students and professionals. Reply in ${LANGNAME[S.lang]}. Be accurate, show the key equation and units, and keep answers under 220 words unless asked for more. Plain text only, no markdown; write equations in Unicode. Teach peaceful, educational content only.\n\nStudent: `;
  const input = chat.slice(-8).map((m,i)=> i===0 && m.role==="user" ? {role:"user",content:sys+m.content} : m);
  if(input[0].role!=="user") input.shift(), input[0]={role:"user",content:sys+input[0].content};
  const el=bubble("a",""); const out=await askAI(input, el, {cache:false});
  if(out) chat.push({role:"assistant",content:out}); else chat.pop();
}
$("#ask").addEventListener("submit",e=>{ e.preventDefault(); ask($("#q").value); });
$("#quick").addEventListener("click",e=>{ const b=e.target.closest("[data-q]"); if(b) ask(t(b.dataset.q)); });

/* ---------- pricing ---------- */
function renderPricing(){
  document.querySelectorAll("#segScope button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===S.scope));
  document.querySelectorAll("#segBill button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.b===S.bill));
  const P=PRICE[S.scope], y=S.bill==="y";
  const plans=[
    ["free","p_free","$0","",["f_first","f_lab","f_brief"]],
    ["student","p_student","$"+P.student[y?1:0],t(y?"per_yr":"per_mo"),["f_all","f_tutor","f_prog"]],
    ["pro","p_pro","$"+P.pro[y?1:0],t(y?"per_yr":"per_mo"),["f_student","f_prolvl","f_prio"]],
    ["inst","p_inst","$"+P.inst,t("per_seat"),["f_pro","f_admin","f_cohort"].concat(S.scope==="full"?["min10"]:[])]
  ];
  $("#plans").innerHTML = plans.map(([id,name,price,unit,fs])=>{
    const cur = S.plan===id && (id==="free"||S.planScope===S.scope);
    return `<div class="plan${id==="student"?" pick":""}"><h3>${t(name)}</h3><div class="price"><b>${price}</b><span>${unit}</span></div>
     <ul>${fs.map(f=>`<li>${t(f)}</li>`).join("")}</ul>
     <button class="btn${cur?" ghost":""}" data-p="${id}" data-line="${esc(T.en[KEYS.indexOf(name)]+" · "+price+(unit?" "+unit:""))}" ${cur?"disabled":""}>${cur?t("current"):id==="free"?t("use_free"):t("choose")}</button></div>`;
  }).join("");
}
$("#segScope").onclick=e=>{ const b=e.target.closest("button"); if(b){ S.scope=b.dataset.s; renderPricing(); } };
$("#segBill").onclick=e=>{ const b=e.target.closest("button"); if(b){ S.bill=b.dataset.b; renderPricing(); } };
function setPlan(id,scope){ S.plan=id; S.planScope=scope; store.set("plan",id); store.set("planScope",scope); renderPricing(); renderLists(); if(S.course) renderCourse(); }
$("#plans").onclick=e=>{ const b=e.target.closest("[data-p]"); if(!b) return;
  if(b.dataset.p==="free"){ setPlan("free",S.planScope); return; }
  S.pending=[b.dataset.p,S.scope]; $("#coLine").textContent=b.dataset.line+" · "+T.en[KEYS.indexOf(S.scope==="full"?"scope_full":"scope_phys")];
  const d=$("#co"); d.showModal ? d.showModal() : d.setAttribute("open","");
};
$("#coGo").onclick=()=>{ if(S.pending) setPlan(S.pending[0],S.pending[1]); $("#co").close(); };
$("#coNo").onclick=()=>$("#co").close();

/* ---------- language + routing ---------- */
function applyLang(){
  document.documentElement.lang=S.lang; document.documentElement.dir = S.lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent=t(el.dataset.i); });
  $("#lang").value=S.lang;
  renderLists(); renderCourse(); renderNews(); renderQuick(); renderPricing(); calcFF(); drawBE(); drawDecay();
  $("#newsTr").hidden = !sample || S.lang==="en";
}
$("#lang").addEventListener("change",e=>{ S.lang=e.target.value; store.set("lang",S.lang); applyLang(); });
const VIEWS=["home","courses","lab","briefing","tutor","pricing"];
function route(){
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
  VIEWS.forEach(x=>{ $("#v-"+x).hidden = x!==v; });
  document.querySelectorAll("#tabs a").forEach(a=> a.dataset.v===v ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  if(v==="home") drawBE(); if(v==="lab") drawDecay(); if(v==="courses") renderCourse();
}
window.addEventListener("hashchange",()=>{ route(); window.scrollTo(0,0); });
window.addEventListener("resize",()=>{ drawBE(); drawDecay(); });
new MutationObserver(drawDecay).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
try{ matchMedia("(prefers-color-scheme:dark)").addEventListener("change",drawDecay); }catch(e){}
applyLang(); route(); aiReady();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ drawBE(); drawDecay(); });
</script>
</body>
</html>
