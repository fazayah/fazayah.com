<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tangent Calculus</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a sheet of graph paper. Ink text, one cobalt curve, one crimson tangent line. */
:root{
  --paper:#f2f5fa; --surface:#ffffff; --ink:#131a2e; --muted:#586179; --line:#d3dae8;
  --curve:#1f45d8; --tangent:#d11f5a; --grid:rgba(31,69,216,.07);
  --good:#12784a; --bad:#b3261e;
  --display:"STIX Two Text","IBM Plex Sans Arabic","IBM Plex Sans Devanagari",Georgia,serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic","IBM Plex Sans Devanagari",system-ui,sans-serif;
  --math:"STIX Two Text","Cambria Math","Noto Sans Math",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c1220; --surface:#141c30; --ink:#e8ecf7; --muted:#9aa5bf; --line:#27324d;
    --curve:#86a2ff; --tangent:#ff7aa5; --grid:rgba(134,162,255,.07);
    --good:#4cc38a; --bad:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1220; --surface:#141c30; --ink:#e8ecf7; --muted:#9aa5bf; --line:#27324d;
  --curve:#86a2ff; --tangent:#ff7aa5; --grid:rgba(134,162,255,.07);
  --good:#4cc38a; --bad:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font:400 16px/1.6 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;padding-bottom:76px}
a{color:var(--curve)}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,5.5vw,2.9rem)}
h2{font-size:1.3rem}
p{margin:0}
:focus-visible{outline:2px solid var(--tangent);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:10px 16px;
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:600 1.25rem var(--display);color:var(--ink);text-decoration:none;margin-inline-end:auto}
.brand svg{width:28px;height:28px}
#lang{font:500 .95rem var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
#nav{position:fixed;inset-inline:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line)}
#nav a{flex:1;text-align:center;padding:14px 4px;font-weight:500;font-size:.92rem;color:var(--muted);text-decoration:none;border-top:3px solid transparent}
#nav a[aria-current="page"]{color:var(--curve);border-top-color:var(--curve)}
@media (min-width:760px){
  body{padding-bottom:0}
  #nav{position:static;border:0;background:none;gap:4px}
  #nav a{flex:none;padding:8px 12px;border-top:0;border-bottom:3px solid transparent}
  #nav a[aria-current="page"]{border-bottom-color:var(--curve)}
}

main{max-width:1080px;margin:0 auto;padding:24px 16px 40px}
.view{display:none;flex-direction:column;gap:24px}
.view.on{display:flex}
.lede{color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero,.two{display:grid;gap:24px;align-items:start}
@media (min-width:880px){.hero{grid-template-columns:1fr 1.05fr;align-items:center}.two{grid-template-columns:1.05fr 1fr}}
.hero-t{display:flex;flex-direction:column;gap:16px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;font:600 1rem var(--body);padding:11px 18px;border-radius:9px;border:1px solid var(--curve);background:var(--curve);color:var(--surface);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--curve)}
.btn:disabled{background:transparent;color:var(--muted);border-color:var(--line);cursor:default}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0}
.stats div{display:flex;align-items:baseline;gap:6px}
.stats dt{order:2;color:var(--muted);font-size:.92rem}
.stats dd{margin:0;font:600 1.5rem var(--display);font-variant-numeric:tabular-nums}

canvas{display:block;width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:8px;background:var(--surface);touch-action:pan-y}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.ctl label{font-size:.9rem;color:var(--muted)}
.ctl select{font:400 1rem var(--math);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input[type=range]{width:100%;accent-color:var(--curve)}
.read{display:flex;flex-wrap:wrap;gap:6px 20px;font:400 1.05rem var(--math);font-variant-numeric:tabular-nums}
.read span{color:var(--muted);font:400 .85rem var(--body);margin-inline-end:6px}
.read b{font-weight:600}
.read .tg{color:var(--tangent)}

#path{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
#path li{border-top:1px solid var(--line)}
#path li:first-child{border-top:0}
#path a{display:flex;align-items:center;gap:10px;padding:9px 0;color:var(--ink);text-decoration:none}
.num{font:600 .95rem var(--math);color:var(--curve);min-width:1.7em;font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.pill{font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.pro{border-color:var(--tangent);color:var(--tangent)}

.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--curve);width:0}
.prow{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
#q{width:100%;font:400 1rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 14px}
#units{display:flex;flex-direction:column;gap:10px}
details.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.unit>summary{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none;font-weight:600}
summary::-webkit-details-marker{display:none}
.cnt{color:var(--muted);font-weight:400;font-size:.88rem;font-variant-numeric:tabular-nums}
.ub{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
details.lesson{border:1px solid var(--line);border-radius:9px}
details.lesson>summary{padding:11px 14px;cursor:pointer;list-style:none;display:flex;gap:10px}
details.lesson[open]>summary{border-bottom:1px solid var(--line);font-weight:600}
.lb{padding:14px;display:flex;flex-direction:column;gap:8px}
.lab{font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.math{font:400 1.12rem/1.7 var(--math);overflow-x:auto;padding:10px 12px;border-radius:8px;background:var(--paper);border-inline-start:3px solid var(--curve);unicode-bidi:isolate;text-align:left}
.math.ex{border-inline-start-color:var(--tangent)}
.math sup,.math sub,.opt sup,.opt sub{font-size:.72em;line-height:0}
.chk{display:flex;align-items:center;gap:10px;padding-top:4px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--good)}
.locked{margin:0;padding-inline-start:1.4em;color:var(--muted)}
.empty{color:var(--muted)}

#quiz{max-width:640px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:400 1.1rem var(--math);padding:14px 10px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--good);color:var(--good);font-weight:600}
.opt.no{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.fb{font-weight:600}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.big{font:600 2rem var(--display)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);align-self:flex-start}
.seg button{font:500 .95rem var(--body);padding:9px 18px;border:0;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--curve);color:var(--surface)}
#cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.plan.hi{border-color:var(--curve);border-width:2px}
.plan h2{display:flex;align-items:center;gap:10px}
.price{font:600 2.4rem var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.per{color:var(--muted);font-size:.9rem}
.plan ul{margin:0;padding-inline-start:1.2em;flex:1;display:flex;flex-direction:column;gap:4px}
.note{border:1px dashed var(--line);border-radius:9px;padding:12px 14px;color:var(--muted);background:var(--surface);max-width:70ch}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home" aria-label="Tangent">
    <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 24 C10 24 16 20 25 4" fill="none" stroke="var(--curve)" stroke-width="2.4" stroke-linecap="round"/><path d="M6 27 L26 9" stroke="var(--tangent)" stroke-width="1.8" stroke-linecap="round"/><circle cx="17.2" cy="17" r="2.6" fill="var(--tangent)"/></svg>
    Tangent
  </a>
  <nav id="nav" aria-label="Main">
    <a href="#home" data-v="home" data-t="home"></a>
    <a href="#course" data-v="course" data-t="course"></a>
    <a href="#practice" data-v="practice" data-t="practice"></a>
    <a href="#plans" data-v="plans" data-t="plans"></a>
  </nav>
  <select id="lang" aria-label="Language">
    <option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option>
    <option value="es">Español</option><option value="ur">اردو</option><option value="hi">हिन्दी</option>
  </select>
</header>

<main>
<section class="view" id="v-home">
  <div class="hero">
    <div class="hero-t">
      <h1 data-t="heroT"></h1>
      <p class="lede" data-t="heroS"></p>
      <div class="cta"><a class="btn" href="#course" data-t="start"></a><a class="btn ghost" href="#plans" data-t="seePlans"></a></div>
      <dl class="stats">
        <div><dt data-t="units"></dt><dd>12</dd></div>
        <div><dt data-t="lessons"></dt><dd>60</dd></div>
        <div><dt data-t="langs"></dt><dd>6</dd></div>
      </dl>
    </div>
    <article class="card">
      <h2 data-t="tanT"></h2>
      <p class="lede" data-t="tanS"></p>
      <canvas id="cv1"></canvas>
      <div class="ctl">
        <label for="fn1" data-t="fn"></label>
        <select id="fn1" dir="ltr"><option value="0">f(x) = x²</option><option value="1">f(x) = sin x</option><option value="2">f(x) = x³ − 3x</option><option value="3">f(x) = eˣ</option></select>
        <label for="x0" data-t="point"></label>
        <input type="range" id="x0" min="-3" max="3" step="0.01" value="1">
      </div>
      <div class="read" dir="ltr" id="r1"></div>
    </article>
  </div>
  <div class="two">
    <article class="card">
      <h2 data-t="areaT"></h2>
      <p class="lede" data-t="areaS"></p>
      <canvas id="cv2"></canvas>
      <div class="ctl">
        <label for="fn2" data-t="fn"></label>
        <select id="fn2" dir="ltr"><option value="0">x² on [0, 2]</option><option value="1">sin x on [0, π]</option><option value="2">√x on [0, 4]</option></select>
        <label for="nn" data-t="rects"></label>
        <input type="range" id="nn" min="1" max="60" step="1" value="6">
      </div>
      <div class="read" id="r2"></div>
    </article>
    <article class="card">
      <h2 data-t="path"></h2>
      <ol id="path"></ol>
    </article>
  </div>
</section>

<section class="view" id="v-course">
  <h1 data-t="course"></h1>
  <div class="card">
    <div class="prow"><span data-t="progress"></span><span id="pc"></span></div>
    <div class="bar"><i id="pb"></i></div>
  </div>
  <input type="search" id="q" data-tp="search" aria-label="Search">
  <div id="units"></div>
</section>

<section class="view" id="v-practice">
  <h1 data-t="practice"></h1>
  <p class="lede" data-t="practiceS"></p>
  <div class="card" id="quiz"></div>
</section>

<section class="view" id="v-plans">
  <h1 data-t="plans"></h1>
  <p class="lede" data-t="plansS"></p>
  <div class="seg" role="group">
    <button type="button" id="bm" data-t="monthly"></button>
    <button type="button" id="by" data-t="yearly"></button>
  </div>
  <div id="cards"></div>
  <p class="note" data-t="notice"></p>
</section>
</main>

/* Graphs */
const F1=[{f:x=>x*x,d:x=>2*x},{f:Math.sin,d:Math.cos},{f:x=>x*x*x-3*x,d:x=>3*x*x-3},{f:Math.exp,d:Math.exp}];
const F2=[{f:x=>x*x,a:0,b:2,ex:8/3,top:4.4},{f:Math.sin,a:0,b:Math.PI,ex:2,top:1.3},{f:Math.sqrt,a:0,b:4,ex:16/3,top:2.4}];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function prep(c){const r=c.getBoundingClientRect();if(r.width<2)return null;const d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const g=c.getContext("2d");g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,r.width,r.height);return{g,w:r.width,h:r.height}}
function frame(g,w,h,v){
  const X=x=>(x-v.x0)/(v.x1-v.x0)*w,Y=y=>h-(y-v.y0)/(v.y1-v.y0)*h;
  g.lineWidth=1;g.strokeStyle=css("--line");g.beginPath();
  for(let x=Math.ceil(v.x0);x<=v.x1;x++){g.moveTo(X(x),0);g.lineTo(X(x),h)}
  for(let y=Math.ceil(v.y0);y<=v.y1;y++){g.moveTo(0,Y(y));g.lineTo(w,Y(y))}
  g.stroke();
  g.strokeStyle=css("--muted");g.lineWidth=1.2;g.beginPath();g.moveTo(0,Y(0));g.lineTo(w,Y(0));g.moveTo(X(0),0);g.lineTo(X(0),h);g.stroke();
  g.fillStyle=css("--muted");g.font="12px sans-serif";g.textAlign="center";g.textBaseline="top";
  for(let x=Math.ceil(v.x0);x<=v.x1;x++)if(x!==0)g.fillText(x,X(x),Y(0)+4);
  return{X,Y};
}
function curve(g,f,X,Y,a,b,col){g.strokeStyle=col;g.lineWidth=2.6;g.lineJoin="round";g.beginPath();for(let i=0;i<=240;i++){const x=a+(b-a)*i/240,y=f(x);i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y))}g.stroke()}
const V1={x0:-3.3,x1:3.3,y0:-3.2,y1:5.2};
function draw1(){
  const p=prep($("#cv1"));if(!p)return;const{g,w,h}=p,{X,Y}=frame(g,w,h,V1);
  const F=F1[+$("#fn1").value],a=+$("#x0").value,fa=F.f(a),m=F.d(a);
  curve(g,F.f,X,Y,V1.x0,V1.x1,css("--curve"));
  g.strokeStyle=css("--tangent");g.lineWidth=2;g.beginPath();g.moveTo(X(V1.x0),Y(fa+m*(V1.x0-a)));g.lineTo(X(V1.x1),Y(fa+m*(V1.x1-a)));g.stroke();
  g.fillStyle=css("--tangent");g.beginPath();g.arc(X(a),Y(fa),6,0,7);g.fill();
  g.strokeStyle=css("--surface");g.lineWidth=2;g.stroke();
  $("#r1").innerHTML=`<div><span>${esc(t("point"))}</span><b>x₀ = ${a.toFixed(2)}</b></div><div><b>f(x₀) = ${fa.toFixed(2)}</b></div><div><span>${esc(t("slope"))}</span><b class="tg">f′(x₀) = ${m.toFixed(2)}</b></div>`;
}
function draw2(){
  const p=prep($("#cv2"));if(!p)return;const{g,w,h}=p,F=F2[+$("#fn2").value],n=+$("#nn").value;
  const pad=(F.b-F.a)*.12,v={x0:F.a-pad,x1:F.b+pad,y0:-F.top*.14,y1:F.top},{X,Y}=frame(g,w,h,v);
  const dx=(F.b-F.a)/n;let s=0;
  g.fillStyle=css("--curve");g.strokeStyle=css("--curve");g.lineWidth=1;
  for(let i=0;i<n;i++){const x=F.a+i*dx,y=F.f(x+dx/2);s+=y*dx;g.globalAlpha=.2;g.fillRect(X(x),Y(y),X(x+dx)-X(x),Y(0)-Y(y));g.globalAlpha=.7;g.strokeRect(X(x),Y(y),X(x+dx)-X(x),Y(0)-Y(y))}
  g.globalAlpha=1;curve(g,F.f,X,Y,F.a,F.b,css("--tangent"));
  $("#r2").innerHTML=`<div><span>${esc(t("rects"))}</span><b dir="ltr">n = ${n}</b></div><div><span>${esc(t("sum"))}</span><b dir="ltr">${s.toFixed(4)}</b></div><div><span>${esc(t("exact"))}</span><b dir="ltr">${F.ex.toFixed(4)}</b></div><div><span>${esc(t("error"))}</span><b class="tg" dir="ltr">${Math.abs(s-F.ex).toFixed(4)}</b></div>`;
}
function draw(){draw1();draw2()}
["#fn1","#x0"].forEach(s=>$(s).addEventListener("input",draw1));
["#fn2","#nn"].forEach(s=>$(s).addEventListener("input",draw2));
(function(){const c=$("#cv1");let on=false;
  const mv=e=>{const r=c.getBoundingClientRect();let x=V1.x0+(e.clientX-r.left)/r.width*(V1.x1-V1.x0);x=Math.max(-3,Math.min(3,x));$("#x0").value=x;draw1()};
  c.addEventListener("pointerdown",e=>{on=true;try{c.setPointerCapture(e.pointerId)}catch(_){}mv(e)});
  c.addEventListener("pointermove",e=>{if(on)mv(e)});
  ["pointerup","pointercancel"].forEach(n=>c.addEventListener(n,()=>{on=false}));
})();
window.addEventListener("resize",draw);
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw)}catch(e){}
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

function route(){
  let v=(location.hash||"#home").slice(1);if(!["home","course","practice","plans"].includes(v))v="home";
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("#nav a").forEach(a=>{a.dataset.v===v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  if(v==="home")draw();window.scrollTo(0,0);
}
function renderAll(){applyText();renderPath();renderCourse();renderQuiz();renderPlans();draw()}
$("#lang").addEventListener("change",e=>{S.lang=e.target.value;save();renderAll()});
window.addEventListener("hashchange",route);
renderAll();route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
</script>
</body>
</html>
