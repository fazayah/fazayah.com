<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qafila Marketplace</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: dense marketplace. Deep-teal trading header, saffron buy actions, product tiles tinted per item. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#14201f; --muted:#586a67; --line:#d9e1df;
  --brand:#0e4a47; --on-brand:#f0faf7; --accent:#f2a516; --on-accent:#231700;
  --sale:#c2301d; --ok:#1b7a48; --phl:89%; --phi:30%;
  --display:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1413; --surface:#16201e; --ink:#e7efed; --muted:#9bb0ac; --line:#2a3937;
    --brand:#0b302e; --on-brand:#e7f5f2; --accent:#f5b436; --on-accent:#231700;
    --sale:#ff8572; --ok:#5fd093; --phl:21%; --phi:78%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#16201e; --ink:#e7efed; --muted:#9bb0ac; --line:#2a3937;
  --brand:#0b302e; --on-brand:#e7f5f2; --accent:#f5b436; --on-accent:#231700;
  --sale:#ff8572; --ok:#5fd093; --phl:21%; --phi:78%; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

header{background:var(--brand);color:var(--on-brand);position:sticky;top:0;z-index:5}
.top{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.logo{font:800 24px/1 var(--display);background:none;border:0;color:var(--on-brand);padding:4px 0;letter-spacing:-.02em}
.logo i{color:var(--accent);font-style:normal}
.search{flex:1 1 320px;display:flex;min-width:0;order:2}
.search input{flex:1;min-width:0;border:0;padding:10px 14px;border-radius:8px 0 0 8px;background:#fff;color:#14201f}
[dir=rtl] .search input{border-radius:0 8px 8px 0}
.search button{border:0;background:var(--accent);color:var(--on-accent);padding:0 16px;border-radius:0 8px 8px 0}
[dir=rtl] .search button{border-radius:8px 0 0 8px}
.tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto;order:3}
.tools select{background:transparent;border:1px solid color-mix(in srgb,var(--on-brand) 35%,transparent);color:var(--on-brand);border-radius:8px;padding:7px 6px;max-width:112px}
.tools select option{color:#14201f;background:#fff}
.cartb{display:flex;gap:6px;align-items:center;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 12px;font-weight:600}
@media (max-width:640px){.search{order:4;flex-basis:100%}.tools{order:2}}
.strip{max-width:1180px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.strip button{flex:none;border:1px solid color-mix(in srgb,var(--on-brand) 28%,transparent);background:transparent;color:var(--on-brand);padding:6px 12px;border-radius:999px;white-space:nowrap}
.strip button.on{background:var(--on-brand);color:var(--brand);font-weight:600}
.strip .sep{flex:none;width:1px;background:color-mix(in srgb,var(--on-brand) 30%,transparent);margin:4px 2px}

main{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:18px}
.hero{background:var(--brand);color:var(--on-brand);border-radius:14px;padding:22px;display:grid;gap:14px}
.hero h1{font-size:clamp(24px,5vw,38px)}
.hero p{margin:0;max-width:56ch;opacity:.9}
.tiers{display:flex;flex-wrap:wrap;gap:8px}
.tier{border:1px solid color-mix(in srgb,var(--on-brand) 30%,transparent);border-radius:10px;padding:8px 12px;min-width:92px}
.tier b{display:block;font:800 18px var(--display)}
.tier.code{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sec{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.sec h2{font-size:21px}
.clock{color:var(--sale);font-weight:600}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.row .card{flex:0 0 168px}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar label{display:flex;gap:6px;align-items:center}
.bar select,.field input,.field select,.coupon input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.bar input[type=range]{width:120px;accent-color:var(--brand)}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:17px;height:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.ph{border:0;width:100%;aspect-ratio:1;display:grid;place-items:center;background:hsl(var(--h) 42% var(--phl));color:hsl(var(--h) 45% var(--phi));padding:0}
.ph svg{width:62%;height:62%}
.off{position:absolute;top:8px;inset-inline-start:8px;background:var(--sale);color:#fff;font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px}
.heart{position:absolute;top:6px;inset-inline-end:6px;width:34px;height:34px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted);display:grid;place-items:center}
.heart.on{color:var(--sale)}
.cb{padding:10px;display:grid;gap:4px}
.nm{background:none;border:0;padding:0;text-align:start;font-weight:500;line-height:1.3}
.pr{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.pr b{font:800 18px var(--display)}
.pr s,.meta{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:12px;border-radius:6px;padding:1px 6px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-weight:600;justify-self:start}
.star{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 16px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.dark{background:var(--brand);color:var(--on-brand);border-color:transparent}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;text-decoration:underline}
:root[data-theme="dark"] .link{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .link{color:var(--accent)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;align-content:start}
.pd{display:grid;gap:18px;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
.pd .ph{border-radius:14px}
.two{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
@media (max-width:760px){.pd,.two{grid-template-columns:minmax(0,1fr)}}
.big{font:800 30px var(--display)}
.tt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tt div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.tt div.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.tt small{display:block;color:var(--muted)}
.sw{display:flex;gap:8px}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid var(--line)}
.sw button.on{outline:3px solid var(--brand);outline-offset:2px}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{border:0;background:var(--bg);width:38px;height:38px;font-size:18px}
.qty span{min-width:46px;display:grid;place-items:center;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:10px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
dt{color:var(--muted)} dd{margin:0}
.rb{display:grid;grid-template-columns:28px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.rb i{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:block}
.rb i b{display:block;height:100%;background:var(--accent)}
.ci{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ci:last-child{border:0;padding:0}
.ci .ph{border-radius:10px}
.ci .l{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sum{display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{border-top:1px solid var(--line);padding-top:10px;font:800 20px var(--display)}
.coupon{display:flex;gap:8px}
.coupon input{flex:1;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px}
.field span{font-size:13px;color:var(--muted)}
.field input,.field select{width:100%}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.opt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent)}
.opt b{margin-inline-start:auto}
.note{border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--accent) 18%,transparent);font-size:14px}
.err{color:var(--sale);font-weight:600}
.okb{border-radius:12px;padding:14px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-weight:600}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;text-align:center}
.track span{border-top:4px solid var(--line);padding-top:6px;color:var(--muted)}
.track span.on{border-color:var(--ok);color:var(--ink);font-weight:600}
.emp{text-align:center;padding:36px 16px;color:var(--muted);display:grid;gap:12px;justify-items:center}
footer{max-width:1180px;margin:0 auto;padding:8px 16px 32px;color:var(--muted);font-size:13px}
#toast{position:fixed;inset-inline:16px;bottom:18px;margin:auto;max-width:340px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

    <div class="meta num" style="margin-top:6px"><span class="star">★</span> ${p.r.toFixed(1)} · ${num(p.s)} ${t('sold')}</div></div>
    <div class="pr num"><span class="big">${money(u)}</span> <span class="meta">${t('perpc')}</span>${p.w>p.p?` <s>${money(p.w)}</s>`:''}</div>
    <div><h3 style="font-size:15px;margin-bottom:8px">${t('whole')}</h3><div class="tt num">${[['1–9',1],['10–49',.88],['50+',.78]].map((x,i)=>`<div class="${i===ti?'on':''}"><small>${x[0]} ${t('pcs')}</small><b>${money(p.p*x[1])}</b></div>`).join('')}</div></div>
    <div><div class="meta" style="margin-bottom:6px">${t('color')}</div><div class="sw">${SW.map((c,i)=>`<button style="background:${c}" class="${i===S.pc?'on':''}" data-a="color" data-v="${i}" aria-label="${t('color')} ${i+1}" aria-pressed="${i===S.pc}"></button>`).join('')}</div></div>
    <div><div class="meta" style="margin-bottom:6px">${t('qty')}</div><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">${qtyBox(S.pq,'pq-','pq+','')}<button class="btn" data-a="pq10">10</button><button class="btn" data-a="pq50">50</button><b class="num">${money(u*S.pq)}</b></div></div>
    <div class="acts"><button class="btn pri" data-a="add">${t('add')}</button><button class="btn dark" data-a="buy">${t('buy')}</button><button class="btn" data-a="wish" data-id="${p.id}" aria-pressed="${S.wish.includes(p.id)}">${S.wish.includes(p.id)?'♥':'♡'} ${t('wishlist')}</button></div>
  </div></div>
  <div class="two"><div class="panel"><h2 style="font-size:19px">${t('specs')}</h2><dl>
    <dt>${t('seller')}</dt><dd>${p.sl?esc(p.sl):t('mystore')}</dd>
    <dt>${t('shipsfrom')}</dt><dd>${CTRY[p.fr][li()]}</dd>
    <dt>${t('delivery')}</dt><dd class="num">${p.d} ${t('days')}</dd>
    <dt>${t('shipping')}</dt><dd>${p.f?t('free'):money(4.9)}</dd>
    <dt>${t('moq')}</dt><dd class="num">${m} ${t('pcs')}</dd>
    <dt>SKU</dt><dd class="num">QF-${String(p.id).padStart(5,'0')}</dd></dl></div>
  <div class="panel"><h2 style="font-size:19px">${t('ratings')}</h2>${p.s?dist.map((d,i)=>`<div class="rb num"><span>${5-i} ★</span><i><b style="width:${d}%"></b></i><span>${d}%</span></div>`).join(''):`<span class="meta">—</span>`}</div></div>`;
}
function totals(){
  const sub=S.cart.reduce((a,c)=>{const p=byId(c.id);return p?a+unit(p,c.qty)*c.qty:a},0);
  const disc=S.coupon?sub*.1:0;
  const allFree=S.cart.every(c=>{const p=byId(c.id);return p&&p.f});
  const ship=!S.cart.length?0:S.ship==='exp'?12.9:(allFree||sub>=50?0:4.9);
  const vat=(sub-disc+ship)*.15;
  return {sub,disc,ship,vat,total:sub-disc+ship+vat};
}
function summary(x){
  return `<div class="sum num"><div><span>${t('subtotal')}</span><span>${money(x.sub)}</span></div>
  ${x.disc?`<div style="color:var(--ok)"><span>${t('discount')} WELCOME10</span><span>−${money(x.disc)}</span></div>`:''}
  <div><span>${t('shipping')}</span><span>${x.ship?money(x.ship):t('free')}</span></div>
  <div><span>${t('vat')}</span><span>${money(x.vat)}</span></div>
  <div class="tot"><span>${t('total')}</span><span>${money(x.total)}</span></div></div>`;
}
function cartItems(edit){
  return S.cart.map((c,i)=>{const p=byId(c.id);if(!p)return'';const u=unit(p,c.qty);
    return `<div class="ci"><div class="ph" style="--h:${p.h}">${icon(p)}</div><div style="display:grid;gap:6px"><button class="nm" data-a="open" data-id="${p.id}">${nm(p)}</button>
    <div class="meta num"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${SW[c.color||0]};vertical-align:-1px"></span> ${money(u)} ${t('perpc')}${u<p.p?` · <span style="color:var(--ok)">−${Math.round((1-u/p.p)*100)}%</span>`:''}</div>
    <div class="l">${edit?qtyBox(c.qty,'dec','inc',`data-v="${i}"`):`<span class="num">× ${c.qty}</span>`}<b class="num">${money(u*c.qty)}</b>${edit?`<button class="link" data-a="rm" data-v="${i}">${t('remove')}</button>`:''}</div></div></div>`}).join('');
}
function cart(){
  if(!S.cart.length)return `<div class="panel emp"><h2>${t('empty')}</h2><button class="btn pri" data-a="go" data-v="shop">${t('back')}</button></div>`;
  return `<h1 style="font-size:26px">${t('cart')}</h1><div class="two"><div class="panel">${cartItems(true)}</div>
  <aside class="panel"><form class="coupon" data-f="coupon"><input id="coupon" placeholder="${t('coupon')}" aria-label="${t('coupon')}" value="${S.coupon?'WELCOME10':''}"><button class="btn">${t('apply')}</button></form>
  ${summary(totals())}<button class="btn pri" data-a="go" data-v="checkout">${t('checkout')}</button></aside></div>`;
}
function checkout(){
  if(!S.cart.length)return cart();
  const a=S.addr,x=totals(),f=(k,type,ac)=>`<label class="field" for="a_${k}"><span>${t(k)}</span><input id="a_${k}" type="${type}" autocomplete="${ac}" data-i="addr" data-k="${k}" value="${esc(a[k]||'')}"></label>`;
  const sub=x.sub,stdCost=(S.cart.every(c=>(byId(c.id)||{}).f)||sub>=50)?0:4.9;
  const opt=(grp,v,label,right)=>`<label class="opt${S[grp]===v?' on':''}" for="${grp}_${v}"><input type="radio" id="${grp}_${v}" name="${grp}" value="${v}" data-c="${grp}"${S[grp]===v?' checked':''}> <span>${label}</span>${right?`<b class="num">${right}</b>`:''}</label>`;
  return `<h1 style="font-size:26px">${t('checkout')}</h1><form data-f="place" class="two" novalidate><div style="display:grid;gap:18px">
  <section class="panel"><h2 style="font-size:19px">1. ${t('addr')}</h2><div class="fields">${f('name','text','name')}${f('phone','tel','tel')}${f('street','text','street-address')}${f('city','text','address-level2')}
    <label class="field" for="a_country"><span>${t('country')}</span><select id="a_country" data-c="country">${Object.keys(CTRY).map(k=>`<option value="${k}"${a.country===k?' selected':''}>${CTRY[k][li()]}</option>`).join('')}</select></label></div></section>
  <section class="panel"><h2 style="font-size:19px">2. ${t('shipping')}</h2>${opt('ship','std',`${t('std')} · 5–12 ${t('days')}`,stdCost?money(stdCost):t('free'))}${opt('ship','exp',`${t('exp')} · 1–3 ${t('days')}`,money(12.9))}</section>
  <section class="panel"><h2 style="font-size:19px">3. ${t('pay')}</h2><div class="note">${t('testnote')}</div>
    ${['card','wallet','bnpl','bank','cod'].map(v=>opt('pay',v,t('p_'+v),v==='bnpl'?`4 × ${money(x.total/4)}`:'')).join('')}
    ${S.pay==='card'?`<div class="fields"><label class="field" for="cardno"><span>${t('cardno')}</span><input id="cardno" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242"></label>
      <label class="field" for="cardexp"><span>${t('expiry')}</span><input id="cardexp" inputmode="numeric" autocomplete="off" placeholder="12/30"></label>
      <label class="field" for="cardcvc"><span>${t('cvc')}</span><input id="cardcvc" inputmode="numeric" autocomplete="off" placeholder="123"></label></div>
      <div><button type="button" class="btn" data-a="testcard">${t('usetest')}</button></div>`:S.pay==='cod'?'':`<div class="meta">${t('handoff')}</div>`}</section></div>
  <aside class="panel"><div style="display:grid;gap:14px">${cartItems(false)}</div>${summary(x)}<div class="err" id="err" role="alert">${esc(S.err)}</div><button class="btn pri">${t('place')} · <span class="num">${money(x.total)}</span></button></aside></form>`;
}
function orders(){
  const fl=S.flash?`<div class="okb">${t('thanks')} · ${t('ordno')} <span class="num">${esc(S.flash)}</span></div>`:'';
  if(!S.orders.length)return `<div class="panel emp"><h2>${t('noorders')}</h2><button class="btn pri" data-a="go" data-v="shop">${t('back')}</button></div>`;
  return `<h1 style="font-size:26px">${t('orders')}</h1>${fl}`+S.orders.map(o=>`<section class="panel"><div class="l" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px"><b class="num">${t('ordno')} ${esc(o.no)}</b><span class="meta num">${new Date(o.at).toLocaleDateString(LOC[S.lang])} · ${t('p_'+o.pay)}</span></div>
    <div>${o.items.map(c=>{const p=byId(c.id);return p?`<div class="num">${c.qty} × ${nm(p)}</div>`:''}).join('')}</div>
    <div class="track">${[1,2,3,4].map(i=>`<span class="${i===1?'on':''}">${t('st'+i)}</span>`).join('')}</div>
    <div class="sum"><div class="tot num"><span>${t('total')}</span><span>${money(o.total)}</span></div></div></section>`).join('');
}
function wishlist(){
  const l=all().filter(p=>S.wish.includes(p.id));
  return `<h1 style="font-size:26px">${t('wishlist')}</h1>`+(l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="panel emp"><span>${t('nowish')}</span><button class="btn pri" data-a="go" data-v="shop">${t('back')}</button></div>`);
}
function sell(){
  return `<h1 style="font-size:26px">${t('sellT')}</h1><div class="two"><form class="panel" data-f="publish"><div class="fields">
    <label class="field" for="s_name"><span>${t('pname')}</span><input id="s_name" required maxlength="80"></label>
    <label class="field" for="s_price"><span>${t('price')}</span><input id="s_price" type="number" min="1" max="800" step="0.01" required></label>
    <label class="field" for="s_cat"><span>${t('cat')}</span><select id="s_cat">${Object.keys(CATS).map(k=>`<option value="${k}">${CATS[k][li()]}</option>`).join('')}</select></label>
    <label class="field" for="s_moq"><span>${t('moq')}</span><input id="s_moq" type="number" min="1" max="500" value="1" required></label></div>
    <div><button class="btn pri">${t('publish')}</button></div></form>
  <aside class="panel"><h2 style="font-size:19px">${t('yours')} <span class="num">(${S.extra.length})</span></h2>${S.extra.length?S.extra.map(p=>`<div style="display:flex;justify-content:space-between;gap:10px"><button class="nm" data-a="open" data-id="${p.id}">${nm(p)}</button><b class="num">${money(p.p)}</b></div>`).join(''):`<span class="meta">—</span>`}</aside></div>`;
}
const VIEWS={shop,product,cart,checkout,orders,wishlist,sell};
function renderMain(){$('main').innerHTML=(VIEWS[S.view]||shop)();const c=$('cc');if(c)c.textContent=count()}
function route(h){
  S.h=h;S.err='';
  if(h.indexOf('item-')===0){S.view='product';S.pid=+h.slice(5);const p=byId(S.pid);S.pq=p&&p.m||1;S.pc=0}
  else S.view=VIEWS[h]&&h!=='product'?h:'shop';
  if(S.view!=='orders')S.flash='';
  renderMain();renderStrip();window.scrollTo(0,0);
}
function go(h){try{if(location.hash.slice(1)!==h)location.hash=h}catch(e){}route(h)}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'shop';if(h!==S.h)route(h)});
function addCart(){const p=byId(S.pid);if(!p)return;const e=S.cart.find(c=>c.id===p.id&&(c.color||0)===S.pc);if(e)e.qty+=S.pq;else S.cart.push({id:p.id,qty:S.pq,color:S.pc});save()}
function luhn(n){let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return n.length>=13&&n.length<=19&&s%10===0}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='go')go(v);
  else if(a==='cat'){S.cat=v;go('shop')}
  else if(a==='open')go('item-'+b.dataset.id);
  else if(a==='wish'){const id=+b.dataset.id,i=S.wish.indexOf(id);i<0?S.wish.push(id):S.wish.splice(i,1);save();renderMain()}
  else if(a==='clear'){S.q='';S.cat='';S.maxp=800;S.r4=S.fs=false;const q=$('q');if(q)q.value='';renderMain();renderStrip()}
  else if(a==='color'){S.pc=+v;renderMain()}
  else if(a==='pq+'){S.pq++;renderMain()}
  else if(a==='pq-'){const m=(byId(S.pid)||{}).m||1;S.pq=Math.max(m,S.pq-1);renderMain()}
  else if(a==='pq10'){S.pq=10;renderMain()}
  else if(a==='pq50'){S.pq=50;renderMain()}
  else if(a==='add'){addCart();renderMain();toast(t('added'))}
  else if(a==='buy'){addCart();go('checkout')}
  else if(a==='inc'){S.cart[+v].qty++;save();renderMain()}
  else if(a==='dec'){const c=S.cart[+v],m=(byId(c.id)||{}).m||1;c.qty=Math.max(m,c.qty-1);save();renderMain()}
  else if(a==='rm'){S.cart.splice(+v,1);save();renderMain()}
  else if(a==='testcard'){$('cardno').value='4242 4242 4242 4242';$('cardexp').value='12/30';$('cardcvc').value='123'}
});
document.addEventListener('change',e=>{
  const c=e.target.dataset.c;if(!c)return;const v=e.target.value;
  if(c==='lang'){S.lang=v;save();renderTop();renderMain()}
  else if(c==='cur'){S.cur=v;save();renderMain()}
  else if(c==='maxp'){S.maxp=+v;renderMain()}
  else if(c==='r4'||c==='fs'){S[c]=e.target.checked;renderMain()}
  else if(c==='sort'){S.sort=v;renderMain()}
  else if(c==='country'){S.addr.country=v;save()}
  else if(c==='ship'||c==='pay'){S[c]=v;S.err='';renderMain()}
});
document.addEventListener('input',e=>{
  const i=e.target.dataset.i;
  if(i==='q'){S.q=e.target.value;if(S.view!=='shop'){S.view='shop';S.h='shop';try{location.hash='shop'}catch(x){}renderStrip()}renderMain()}
  else if(i==='addr'){S.addr[e.target.dataset.k]=e.target.value;save()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.dataset.f;
  if(f==='coupon'){const ok=$('coupon').value.trim().toUpperCase()==='WELCOME10';S.coupon=ok;save();renderMain();toast(t(ok?'couponok':'couponbad'))}
  else if(f==='publish'){
    const n=$('s_name').value.trim(),p=parseFloat($('s_price').value),m=Math.max(1,parseInt($('s_moq').value)||1);
    if(!n||!(p>0))return;
    S.extra.push({id:1000+Date.now()%1e7,c:$('s_cat').value,i:'box',h:Math.floor(Math.random()*360),p:Math.min(p,800),w:0,r:0,s:0,f:0,sl:'',fr:'SA',d:'1–3',m,n:Array(6).fill(n)});
    save();renderMain();toast(t('listed'));
  }
  else if(f==='place'){
    const a=S.addr;
    if(!['name','phone','street','city'].every(k=>(a[k]||'').trim())){S.err=t('fill');$('err').textContent=S.err;return}
    if(S.pay==='card'){
      const n=$('cardno').value.replace(/\D/g,''),x=$('cardexp').value.trim().match(/^(\d{2})\s*\/\s*(\d{2})$/),c=$('cardcvc').value.trim();
      const now=new Date(),okx=x&&+x[1]>=1&&+x[1]<=12&&(2000+ +x[2]>now.getFullYear()||(2000+ +x[2]===now.getFullYear()&&+x[1]>=now.getMonth()+1));
      if(!luhn(n)||!okx||!/^\d{3,4}$/.test(c)){S.err=t('badcard');$('err').textContent=S.err;return}
    }
    const no='QF-'+String(Date.now()).slice(-8);
    S.orders.unshift({no,at:Date.now(),items:S.cart.slice(),total:totals().total,pay:S.pay});
    S.cart=[];S.coupon=false;save();go('orders');S.flash=no;renderMain();
  }
});
setInterval(()=>{const c=$('clock');if(c)c.textContent=clock()},1000);
renderTop();route((location.hash||'#shop').slice(1));
</script>
</body>
</html>
