<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phasor Electrical Engineering</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a bench instrument. Solder-mask green accent on a pale ground, a live oscilloscope screen as
   the hero, resistor colour-code bands for the four years, mono type for every value. Phone-first with a bottom tab bar. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#13201C; --muted:#53645E; --line:#CBD5D0;
  --accent:#0B6B50; --accent-ink:#FFFFFF; --hot:#B4571B;
  --y1:#8B5A2B; --y2:#C8372D; --y3:#E8811C; --y4:#E3C01F;
  --display:"Chakra Petch","IBM Plex Sans Arabic","IBM Plex Sans Devanagari","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic","IBM Plex Sans Devanagari",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#17201D; --ink:#E5ECE9; --muted:#94A59E; --line:#2A3833;
    --accent:#56D3A4; --accent-ink:#06140F; --hot:#F0A35E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17201D; --ink:#E5ECE9; --muted:#94A59E; --line:#2A3833;
  --accent:#56D3A4; --accent-ink:#06140F; --hot:#F0A35E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:76px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.86;z-index:-1}
html[lang="ar"] body,html[lang="ur"] body,html[lang="hi"] body{line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,7vw,3.3rem);line-height:1.06;text-transform:uppercase;letter-spacing:.005em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.1;text-transform:uppercase}
h3{font-size:1.05rem;font-weight:600}
html:not([lang="en"]):not([lang="fr"]):not([lang="es"]) h1{font-size:clamp(1.9rem,7vw,3.2rem);line-height:1.3;font-weight:700}
html:not([lang="en"]):not([lang="fr"]):not([lang="es"]) h2{font-size:clamp(1.5rem,5vw,2rem);line-height:1.4;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,select,input{font:inherit;color:inherit}
select,input[type=number],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:44px;width:100%}
label{font-size:.82rem;color:var(--muted);display:grid;gap:4px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:4px;border:1px solid var(--ink);background:transparent;font-weight:600;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.08)}

/* top bar */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:1.35rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.topnav{display:none;gap:4px;margin-inline-start:auto}
.topnav a{padding:8px 12px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.topnav a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.lang{margin-inline-start:auto;width:auto;min-height:40px;padding:6px 10px}
@media(min-width:820px){.topnav{display:flex}.lang{margin-inline-start:8px}body{padding-bottom:0}.tabs{display:none!important}}

/* bottom tabs */
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabs a{flex:1;display:grid;justify-items:center;gap:2px;padding:8px 2px 10px;font-size:.68rem;text-decoration:none;color:var(--muted);min-width:0}
.tabs a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}

section.view{display:none;padding:28px 0 48px}
section.view.on{display:block}
.head{display:grid;gap:8px;margin-bottom:22px;max-width:65ch}

/* hero */
.hero{display:grid;gap:24px;align-items:center}
@media(min-width:820px){.hero{grid-template-columns:1fr 1.05fr;gap:40px}}
.hero .copy{display:grid;gap:16px}
.hero .copy p{max-width:48ch;font-size:1.06rem}
.row{display:flex;flex-wrap:wrap;gap:10px}
.sheet{background:var(--surface);border:1.5px solid var(--ink);padding:12px 12px 0}
.sheet svg{display:block;width:100%;height:auto}
.sheet .ctrl{padding:4px 4px 10px;display:grid;gap:10px}
.titleblock{display:grid;grid-template-columns:1.4fr 1fr 1fr;border-top:1.5px solid var(--ink);margin:0 -12px;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;direction:ltr}
.titleblock div{padding:6px 10px;border-inline-end:1px solid var(--ink)}
.titleblock div:last-child{border:0}
.titleblock b{display:block;font-weight:500;color:var(--muted);font-size:.6rem}
.readouts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:4px}
.readouts div{background:var(--surface);padding:8px 10px;display:grid;gap:2px}
.readouts small{color:var(--muted);font-size:.74rem;line-height:1.3}
.readouts strong{font-family:var(--mono);font-weight:500;font-size:1.05rem;direction:ltr;unicode-bidi:isolate;text-align:start}
svg .ink{stroke:var(--ink);fill:none;stroke-width:1.2}
svg .solid{fill:var(--ink)}
svg .dim{stroke:var(--muted);stroke-width:.8;fill:none}
svg .hot{stroke:var(--hot);fill:var(--hot);stroke-width:2}
svg .bmd{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:1.4}
svg text{font-family:var(--mono);font-size:10px;fill:var(--ink)}
svg text.m{fill:var(--muted)} svg text.h{fill:var(--hot)} svg text.a{fill:var(--accent)}

svg .scr{fill:#0B1512} svg .grd{stroke:#1F3B32;stroke-width:.6;fill:none} svg .axis{stroke:#35594C;stroke-width:1;fill:none}
svg .tv{stroke:#5BE3A6;fill:none;stroke-width:2;stroke-linejoin:round} svg .ti{stroke:#F2B45A;fill:none;stroke-width:2;stroke-linejoin:round}
svg text.sv{fill:#5BE3A6} svg text.si{fill:#F2B45A} svg text.sm{fill:#9DB5AC}
.spec{font-family:var(--mono);font-size:.78rem;color:var(--muted);direction:ltr;text-align:start}
.readouts .wide{grid-column:1/-1}
.course details{padding:8px 10px}
.course ol{margin:8px 0 0;padding-inline-start:22px;display:grid;gap:5px;font-size:.9rem}
.four{display:grid;gap:12px;grid-template-columns:1fr 1fr}
textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%;resize:vertical}
.btn:disabled{opacity:.5;cursor:default}
.ans{white-space:pre-wrap;border:1px solid var(--line);background:var(--bg);padding:12px;unicode-bidi:plaintext;overflow-wrap:anywhere}
.eq{font-family:var(--mono);font-size:.92em;unicode-bidi:isolate;direction:ltr;display:inline-block}
.lk{background:none;border:0;padding:4px 0;color:var(--accent);text-decoration:underline;cursor:pointer;text-align:start;min-height:32px}
#les{width:min(94vw,560px);max-height:88vh;overflow:auto}
#les>*+*{margin-top:12px}
h4{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.trio{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:36px}
@media(min-width:700px){.trio{grid-template-columns:repeat(3,1fr)}}
.trio a{background:var(--surface);padding:18px;text-decoration:none;color:var(--ink);display:grid;gap:6px}
.trio .n{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--accent)}
.trio a:hover h3{text-decoration:underline}

/* courses */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:38px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.course{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--yc);padding:14px;display:grid;gap:8px;align-content:start}
.course .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.code{font-family:var(--mono);font-size:.78rem;color:var(--muted);direction:ltr}
.tag{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:3px;border:1px solid var(--line)}
.tag.pro{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.meta{font-size:.84rem;color:var(--muted)}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.terms button{border:1px dashed var(--line);background:transparent;border-radius:3px;padding:4px 8px;font-size:.8rem;cursor:pointer;min-height:32px}
.terms button:hover{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.8rem;color:var(--muted);margin-top:16px}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-inline-end:5px}

/* tools */
.panel{background:var(--surface);border:1px solid var(--line);padding:16px;display:grid;gap:14px;margin-bottom:16px}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.three{display:grid;gap:12px}
@media(min-width:640px){.three{grid-template-columns:repeat(3,1fr)}}
.result{font-family:var(--mono);font-size:1.3rem;padding:12px;border:1px solid var(--line);background:var(--bg);direction:ltr;text-align:start;overflow-wrap:anywhere}
.formulas{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
@media(min-width:640px){.formulas{grid-template-columns:1fr 1fr}}
.formulas div{background:var(--surface);padding:10px 12px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.formulas code{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap}

/* glossary */
.gl{background:var(--surface);border:1px solid var(--line)}
.gl .r{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.gl .r:last-child{border:0}
.gl .r span:first-child{font-weight:600}
.gl .r small{grid-column:1/-1;color:var(--muted);font-size:.74rem}
.gl .r.flash{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}

/* pricing */
.toggles{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 16px;min-height:44px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.plans{display:grid;gap:12px}
@media(min-width:820px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{background:var(--surface);border:1px solid var(--line);padding:18px;display:grid;gap:10px;align-content:start;position:relative}
.plan.pop{border:2px solid var(--accent)}
.plan .badge{position:absolute;top:-11px;inset-inline-start:14px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:3px}
.plan .name{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:1.45rem;text-transform:uppercase;line-height:1}
.price{font-family:var(--mono);font-size:2rem;font-weight:500;line-height:1.1;direction:ltr;unicode-bidi:isolate;text-align:start}
.price small{font-size:.8rem;color:var(--muted);font-family:var(--body)}
.save{color:var(--accent);font-weight:600;font-size:.84rem}
.tblwrap{overflow-x:auto;margin-top:8px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:420px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:start}
thead th{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td.y{color:var(--accent);font-weight:700} td.n{color:var(--muted)}
.campus{display:grid;gap:16px;margin-top:16px}
@media(min-width:820px){.campus{grid-template-columns:1fr 1fr;align-items:center}}
.campus ul{margin:0;padding-inline-start:18px;display:grid;gap:4px}
.note{font-size:.84rem;color:var(--muted);margin-top:14px;border-inline-start:3px solid var(--hot);padding-inline-start:10px}
details{background:var(--surface);border:1px solid var(--line);padding:12px 14px}
details+details{border-top:0}
summary{cursor:pointer;font-weight:600}
details p{margin-top:8px;color:var(--muted);max-width:65ch}
h2.sub{margin:36px 0 14px}
dialog{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(10,14,18,.6)}
dialog dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:16px 0}
dialog dt{color:var(--muted)} dialog dd{margin:0;text-align:end;font-family:var(--mono)}
@media(prefers-reduced-motion:no-preference){.gl .r{transition:background .6s}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="brand" href="#home" aria-label="Phasor">
    <svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13L20.5 6.5" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><circle cx="13" cy="13" r="2" fill="currentColor"/></svg>Phasor</a>
  <nav class="topnav" id="topnav"></nav>
  <select class="lang" id="lang" aria-label="Language"></select>
</div></header>

<main class="wrap">
<section class="view" id="v-home">
  <div class="hero">
    <div class="copy">
      <h1 data-t="hero_h"></h1>
      <p class="muted" data-t="hero_p"></p>
      <div class="row"><a class="btn primary" href="#courses" data-t="hero_c1"></a><a class="btn" href="#pricing" data-t="hero_c2"></a></div>
    </div>
    <div class="sheet">
      <svg id="scope1" viewBox="0 0 360 200" role="img" aria-label="Oscilloscope: voltage and current"></svg>
      <div class="ctrl">
        <p class="spec" id="h_spec"></p>
        <label><span data-t="b_try"></span><input type="range" id="h_f" min="20" max="500" step="1"></label>
        <div class="readouts" id="ro1"></div>
      </div>
      <div class="titleblock"><div><b>Title</b>Series RLC circuit</div><div><b>Units</b>V, A, Hz</div><div><b>Drg no.</b>PHA-001</div></div>
    </div>
  </div>
  <div class="trio">
    <a href="#courses"><span class="n mono">12</span><h3 data-t="nav_courses"></h3><p class="muted" data-t="h_c"></p></a>
    <a href="#tools"><span class="n mono">3</span><h3 data-t="nav_tools"></h3><p class="muted" data-t="h_t"></p></a>
    <a href="#glossary"><span class="n mono">6</span><h3 data-t="nav_gloss"></h3><p class="muted" data-t="h_g"></p></a>
  </div>
</section>

<section class="view" id="v-courses">
  <div class="head"><h2 data-t="nav_courses"></h2><p class="muted" data-t="c_sub"></p></div>
  <div class="chips" id="yearchips"></div>
  <div class="grid" id="courselist"></div>
  <p class="legend" id="legend"></p>
</section>

<section class="view" id="v-tools">
  <div class="head"><h2 data-t="nav_tools"></h2><p class="muted" data-t="h_t"></p></div>
  <div class="panel">
    <h3 data-t="ai_title"></h3>
    <label><span data-t="ai_ph"></span><textarea id="ai_q" rows="3"></textarea></label>
    <div class="row"><button class="btn primary" type="button" id="ai_go" data-t="ai_ask" disabled></button></div>
    <div class="ans" id="ai_out" aria-live="polite" hidden></div>
    <p class="muted" style="font-size:.8rem" id="ai_note"></p>
  </div>
  <div class="panel">
    <h3 data-t="t_beam"></h3>
    <svg id="scope2" viewBox="0 0 360 200" role="img" aria-label="Oscilloscope: voltage and current" style="max-width:560px;width:100%"></svg>
    <label><span><span data-g="freq"></span> <span class="mono" id="o_f"></span></span><input type="range" id="t_f" min="20" max="500" step="1"></label>
    <div class="four">
      <label><span><span data-g="resistance"></span> <span class="mono" id="o_R"></span></span><input type="range" id="t_R" min="5" max="500" step="5"></label>
      <label><span><span data-g="induct"></span> <span class="mono" id="o_L"></span></span><input type="range" id="t_L" min="5" max="500" step="5"></label>
      <label><span><span data-g="capac"></span> <span class="mono" id="o_C"></span></span><input type="range" id="t_C" min="1" max="100" step="1"></label>
      <label><span><span data-g="voltage"></span> <span class="mono" id="o_V"></span></span><input type="range" id="t_V" min="1" max="240" step="1"></label>
    </div>
    <div class="readouts" id="ro2"></div>
  </div>
  <div class="panel">
    <h3 data-t="t_conv"></h3>
    <div class="two"><label><span data-t="u_cat"></span><select id="u_cat"></select></label><label><span data-t="u_val"></span><input type="number" id="u_val" value="1" step="any" inputmode="decimal"></label></div>
    <div class="two"><label><span data-t="u_from"></span><select id="u_from"></select></label><label><span data-t="u_to"></span><select id="u_to"></select></label></div>
    <div class="result" id="u_out" aria-live="polite"></div>
  </div>
  <div class="panel"><h3 data-t="t_form"></h3><div class="formulas" id="formulas"></div></div>
</section>

<section class="view" id="v-glossary">
  <div class="head"><h2 data-t="g_title"></h2><p class="muted" data-t="g_sub"></p></div>
  <div class="panel">
    <div class="two"><label><span data-t="u_from"></span><select id="g_from"></select></label><label><span data-t="u_to"></span><select id="g_to"></select></label></div>
    <div class="two"><label><span data-t="g_search"></span><input type="search" id="g_q"></label><label><span data-t="nav_courses"></span><select id="g_course"></select></label></div>
  </div>
  <div class="gl" id="glist"></div>
</section>

<section class="view" id="v-pricing">
  <div class="head"><h2 data-t="p_title"></h2><p class="muted" data-t="p_sub"></p></div>
  <div class="toggles">
    <div class="seg" id="cycle"><button type="button" data-c="m" data-t="p_m"></button><button type="button" data-c="y" data-t="p_y"></button></div>
    <label style="width:auto"><span data-t="p_cur"></span><select id="cur"></select></label>
  </div>
  <div class="plans" id="plans"></div>
  <p class="muted" style="margin-top:14px;font-size:.9rem" data-t="p_terms"></p>
  <p class="note" data-t="p_proto"></p>

  <h2 class="sub" data-t="p_cmp"></h2>
  <div class="tblwrap"><table id="cmp"></table></div>

  <h2 class="sub">Campus</h2>
  <div class="panel campus">
    <div style="display:grid;gap:8px"><p data-t="cp_d"></p><ul id="cp_list"></ul></div>

e:["A [[12 V]] source feeds [[4 Ω]] and [[2 Ω]] in series. Total resistance is [[6 Ω]], so [[I = 12 / 6 = 2 A]]. The drops are [[8 V]] and [[4 V]], which add up to [[12 V]] as the voltage law requires.",
"مصدر [[12 V]] يغذي [[4 Ω]] و [[2 Ω]] على التوالي. المقاومة الكلية [[6 Ω]]، إذن [[I = 12 / 6 = 2 A]]. هبوطا الجهد هما [[8 V]] و [[4 V]]، ومجموعهما [[12 V]] كما يقتضي قانون الجهد.",
"Une source de [[12 V]] alimente [[4 Ω]] et [[2 Ω]] en série. La résistance totale vaut [[6 Ω]], donc [[I = 12 / 6 = 2 A]]. Les chutes de tension sont [[8 V]] et [[4 V]], soit [[12 V]] au total, comme l’exige la loi des mailles.",
"Una fuente de [[12 V]] alimenta [[4 Ω]] y [[2 Ω]] en serie. La resistencia total es [[6 Ω]], así que [[I = 12 / 6 = 2 A]]. Las caídas son [[8 V]] y [[4 V]], que suman [[12 V]] como exige la ley de tensiones.",
"[[12 V]] کا سورس سیریز میں [[4 Ω]] اور [[2 Ω]] کو فیڈ کرتا ہے۔ کل مزاحمت [[6 Ω]] ہے، لہٰذا [[I = 12 / 6 = 2 A]]۔ وولٹیج ڈراپ [[8 V]] اور [[4 V]] ہیں، جن کا مجموعہ [[12 V]] ہے جیسا کہ وولٹیج قانون تقاضا کرتا ہے۔",
"[[12 V]] का स्रोत श्रेणी में [[4 Ω]] और [[2 Ω]] को आपूर्ति देता है। कुल प्रतिरोध [[6 Ω]] है, इसलिए [[I = 12 / 6 = 2 A]]। वोल्टता पात [[8 V]] और [[4 V]] हैं, जिनका योग [[12 V]] है, जैसा वोल्टता नियम माँगता है।"],
q:["A [[9 V]] battery drives [[3 mA]] through a resistor. What is its resistance?","بطارية [[9 V]] تمرّر [[3 mA]] في مقاوم. ما قيمة مقاومته؟","Une pile de [[9 V]] fait circuler [[3 mA]] dans un résistor. Quelle est sa résistance ?","Una pila de [[9 V]] hace circular [[3 mA]] por un resistor. ¿Cuál es su resistencia?","[[9 V]] کی بیٹری ایک ریزسٹر میں سے [[3 mA]] گزارتی ہے۔ اس کی مزاحمت کیا ہے؟","[[9 V]] की बैटरी एक प्रतिरोधक में [[3 mA]] प्रवाहित करती है। उसका प्रतिरोध क्या है?"],
a:"[[R = V / I = 9 / 0.003 = 3 kΩ]]"},
{f:"Σ (Vn − Vk) / Rk = 0",
x:["Node analysis writes the current law at each node, with the node voltages as unknowns. Mesh analysis writes the voltage law around each loop, with the loop currents as unknowns. Pick the method that gives fewer equations.",
"يكتب تحليل العقد قانون التيار عند كل عقدة، والمجاهيل هي جهود العقد. ويكتب تحليل الحلقات قانون الجهد حول كل حلقة، والمجاهيل هي تيارات الحلقات. اختر الطريقة التي تعطي معادلات أقل.",
"La méthode des nœuds écrit la loi des nœuds en chaque nœud, avec les potentiels de nœud comme inconnues. La méthode des mailles écrit la loi des mailles sur chaque boucle, avec les courants de maille comme inconnues. Choisissez celle qui donne le moins d’équations.",
"El análisis de nodos escribe la ley de corrientes en cada nodo, con las tensiones de nodo como incógnitas. El análisis de mallas escribe la ley de tensiones en cada lazo, con las corrientes de malla como incógnitas. Elige el método que dé menos ecuaciones.",
"نوڈ تجزیہ ہر نوڈ پر کرنٹ قانون لکھتا ہے اور نوڈ وولٹیجز نامعلوم ہوتے ہیں۔ میش تجزیہ ہر لوپ کے گرد وولٹیج قانون لکھتا ہے اور لوپ کرنٹس نامعلوم ہوتے ہیں۔ وہ طریقہ چنیں جس میں مساواتیں کم بنیں۔",
"नोड विश्लेषण हर नोड पर धारा नियम लिखता है, जहाँ नोड वोल्टताएँ अज्ञात होती हैं। मेश विश्लेषण हर लूप के चारों ओर वोल्टता नियम लिखता है, जहाँ लूप धाराएँ अज्ञात होती हैं। वह विधि चुनें जिसमें कम समीकरण बनें।"],
e:["A [[10 V]] source connects through [[2 Ω]] to node A. Two [[4 Ω]] resistors go from A to ground. [[(VA − 10)/2 + VA/4 + VA/4 = 0]] gives [[VA = 5 V]].",
"مصدر [[10 V]] يتصل عبر [[2 Ω]] بالعقدة A. ومن A مقاومان [[4 Ω]] إلى الأرضي. المعادلة [[(VA − 10)/2 + VA/4 + VA/4 = 0]] تعطي [[VA = 5 V]].",
"Une source de [[10 V]] est reliée au nœud A par [[2 Ω]]. Deux résistors de [[4 Ω]] relient A à la masse. [[(VA − 10)/2 + VA/4 + VA/4 = 0]] donne [[VA = 5 V]].",
"Una fuente de [[10 V]] se conecta al nodo A a través de [[2 Ω]]. Dos resistores de [[4 Ω]] van de A a tierra. [[(VA − 10)/2 + VA/4 + VA/4 = 0]] da [[VA = 5 V]].",
"[[10 V]] کا سورس [[2 Ω]] کے ذریعے نوڈ A سے جڑا ہے۔ A سے دو [[4 Ω]] ریزسٹر گراؤنڈ تک جاتے ہیں۔ [[(VA − 10)/2 + VA/4 + VA/4 = 0]] سے [[VA = 5 V]] ملتا ہے۔",
"[[10 V]] का स्रोत [[2 Ω]] से होकर नोड A से जुड़ा है। A से दो [[4 Ω]] प्रतिरोधक भू-संपर्क तक जाते हैं। [[(VA − 10)/2 + VA/4 + VA/4 = 0]] से [[VA = 5 V]] मिलता है।"],
q:["A circuit has 4 nodes including ground. How many node equations do you need?","دائرة فيها 4 عقد من ضمنها الأرضي. كم معادلة عقد تحتاج؟","Un circuit comporte 4 nœuds, masse comprise. Combien d’équations de nœud faut-il ?","Un circuito tiene 4 nodos, incluida la tierra. ¿Cuántas ecuaciones de nodo necesitas?","ایک سرکٹ میں گراؤنڈ سمیت 4 نوڈ ہیں۔ آپ کو کتنی نوڈ مساواتیں درکار ہیں؟","एक परिपथ में भू-संपर्क सहित 4 नोड हैं। आपको कितने नोड समीकरण चाहिए?"],
a:["3: one for every node except the reference.","3: معادلة لكل عقدة ما عدا العقدة المرجعية.","3 : une par nœud, sauf le nœud de référence.","3: una por cada nodo, salvo el de referencia.","3: حوالہ نوڈ کے سوا ہر نوڈ کے لیے ایک۔","3: संदर्भ नोड को छोड़कर हर नोड के लिए एक।"]},
{f:"VTh = Voc   ·   RTh = Voc / Isc   ·   IN = VTh / RTh",
x:["Any linear two-terminal network can be replaced by one voltage source in series with one resistance (Thévenin), or by one current source in parallel with the same resistance (Norton). The load sees no difference.",
"أي شبكة خطية ذات طرفين يمكن استبدالها بمصدر جهد واحد على التوالي مع مقاومة واحدة (ثيفينن)، أو بمصدر تيار واحد على التوازي مع المقاومة نفسها (نورتن). الحمل لا يلاحظ أي فرق.",
"Tout réseau linéaire à deux bornes peut être remplacé par une source de tension en série avec une résistance (Thévenin), ou par une source de courant en parallèle avec la même résistance (Norton). La charge ne voit aucune différence.",
"Cualquier red lineal de dos terminales puede sustituirse por una fuente de tensión en serie con una resistencia (Thévenin), o por una fuente de corriente en paralelo con la misma resistencia (Norton). La carga no nota la diferencia.",
"کسی بھی دو ٹرمینل والے لکیری نیٹ ورک کو ایک وولٹیج سورس اور سیریز میں ایک مزاحمت (تھیونن)، یا ایک کرنٹ سورس اور متوازی میں اسی مزاحمت (نارٹن) سے بدلا جا سکتا ہے۔ لوڈ کو کوئی فرق محسوس نہیں ہوتا۔",
"किसी भी दो-टर्मिनल रैखिक नेटवर्क को श्रेणी में एक प्रतिरोध वाले एक वोल्टता स्रोत (थेवेनिन), या समांतर में उसी प्रतिरोध वाले एक धारा स्रोत (नॉर्टन) से बदला जा सकता है। भार को कोई अंतर नहीं दिखता।"],
e:["A [[12 V]] source has [[6 Ω]] in series, with [[3 Ω]] across the output terminals. [[VTh = 12 × 3 / (6 + 3) = 4 V]]. [[RTh = 6 ∥ 3 = 2 Ω]]. The Norton current is [[4 / 2 = 2 A]].",
"مصدر [[12 V]] على التوالي مع [[6 Ω]]، و [[3 Ω]] بين طرفي الخرج. [[VTh = 12 × 3 / (6 + 3) = 4 V]]. [[RTh = 6 ∥ 3 = 2 Ω]]. تيار نورتن [[4 / 2 = 2 A]].",
"Une source de [[12 V]] est en série avec [[6 Ω]], et [[3 Ω]] est placé entre les bornes de sortie. [[VTh = 12 × 3 / (6 + 3) = 4 V]]. [[RTh = 6 ∥ 3 = 2 Ω]]. Le courant de Norton vaut [[4 / 2 = 2 A]].",
"Una fuente de [[12 V]] tiene [[6 Ω]] en serie y [[3 Ω]] entre los terminales de salida. [[VTh = 12 × 3 / (6 + 3) = 4 V]]. [[RTh = 6 ∥ 3 = 2 Ω]]. La corriente de Norton es [[4 / 2 = 2 A]].",
"[[12 V]] کے سورس کے ساتھ سیریز میں [[6 Ω]] ہے اور آؤٹ پٹ ٹرمینلز کے درمیان [[3 Ω]] ہے۔ [[VTh = 12 × 3 / (6 + 3) = 4 V]]۔ [[RTh = 6 ∥ 3 = 2 Ω]]۔ نارٹن کرنٹ [[4 / 2 = 2 A]] ہے۔",
"[[12 V]] के स्रोत के साथ श्रेणी में [[6 Ω]] है और निर्गत टर्मिनलों के बीच [[3 Ω]] है। [[VTh = 12 × 3 / (6 + 3) = 4 V]]। [[RTh = 6 ∥ 3 = 2 Ω]]। नॉर्टन धारा [[4 / 2 = 2 A]] है।"],
q:["Which load resistance receives maximum power from a source with [[RTh = 50 Ω]]?","ما مقاومة الحمل التي تستقبل أقصى قدرة من مصدر له [[RTh = 50 Ω]]؟","Quelle résistance de charge reçoit la puissance maximale d’une source de [[RTh = 50 Ω]] ?","¿Qué resistencia de carga recibe la máxima potencia de una fuente con [[RTh = 50 Ω]]?","[[RTh = 50 Ω]] والے سورس سے کون سی لوڈ مزاحمت زیادہ سے زیادہ پاور لیتی ہے؟","[[RTh = 50 Ω]] वाले स्रोत से कौन-सा भार प्रतिरोध अधिकतम शक्ति प्राप्त करता है?"],
a:"[[RL = RTh = 50 Ω]]"},
{f:"τ = R·C   ·   τ = L / R   ·   v(t) = V·(1 − e^(−t/τ))",
x:["Capacitors and inductors store energy, so voltages and currents cannot jump instantly. A first-order circuit moves toward its final value exponentially. After one time constant it has covered 63% of the change, and after five it has practically settled.",
"المكثفات والملفات تخزّن الطاقة، لذلك لا تتغير الجهود والتيارات لحظيًا. دائرة الرتبة الأولى تقترب من قيمتها النهائية أسيًّا. بعد ثابت زمني واحد تكون قد قطعت 63% من التغير، وبعد خمسة ثوابت تكون قد استقرت عمليًا.",
"Condensateurs et bobines stockent de l’énergie : tensions et courants ne peuvent donc pas varier instantanément. Un circuit du premier ordre tend vers sa valeur finale de façon exponentielle. Après une constante de temps, 63 % de la variation est accomplie ; après cinq, le régime est pratiquement établi.",
"Los condensadores y las bobinas almacenan energía, así que tensiones y corrientes no pueden cambiar al instante. Un circuito de primer orden se acerca a su valor final de forma exponencial. Tras una constante de tiempo ha recorrido el 63 % del cambio y tras cinco está prácticamente estabilizado.",
"کپیسیٹر اور انڈکٹر توانائی ذخیرہ کرتے ہیں، اس لیے وولٹیج اور کرنٹ فوراً نہیں بدل سکتے۔ فرسٹ آرڈر سرکٹ اپنی حتمی قدر کی طرف ایکسپونینشل انداز میں بڑھتا ہے۔ ایک ٹائم کانسٹنٹ کے بعد 63% تبدیلی مکمل ہو جاتی ہے اور پانچ کے بعد سرکٹ عملاً ٹھہر جاتا ہے۔",
"संधारित्र और प्रेरक ऊर्जा संचित करते हैं, इसलिए वोल्टता और धारा तुरंत नहीं बदल सकतीं। प्रथम कोटि का परिपथ अपने अंतिम मान की ओर चरघातांकी रूप से बढ़ता है। एक समय स्थिरांक के बाद 63% परिवर्तन पूरा हो जाता है और पाँच के बाद परिपथ लगभग स्थिर हो जाता है।"],
e:["A [[10 kΩ]] resistor charges a [[100 µF]] capacitor from [[5 V]]. [[τ = 10 000 × 0.0001 = 1 s]]. After [[1 s]] the capacitor is at [[5 × 0.632 = 3.16 V]].",
"مقاوم [[10 kΩ]] يشحن مكثفًا [[100 µF]] من [[5 V]]. [[τ = 10 000 × 0.0001 = 1 s]]. بعد [[1 s]] يصبح جهد المكثف [[5 × 0.632 = 3.16 V]].",
"Un résistor de [[10 kΩ]] charge un condensateur de [[100 µF]] sous [[5 V]]. [[τ = 10 000 × 0.0001 = 1 s]]. Après [[1 s]], le condensateur est à [[5 × 0.632 = 3.16 V]].",
"Un resistor de [[10 kΩ]] carga un condensador de [[100 µF]] desde [[5 V]]. [[τ = 10 000 × 0.0001 = 1 s]]. Tras [[1 s]] el condensador está a [[5 × 0.632 = 3.16 V]].",
"[[10 kΩ]] کا ریزسٹر [[5 V]] سے [[100 µF]] کے کپیسیٹر کو چارج کرتا ہے۔ [[τ = 10 000 × 0.0001 = 1 s]]۔ [[1 s]] کے بعد کپیسیٹر [[5 × 0.632 = 3.16 V]] پر ہوتا ہے۔",
"[[10 kΩ]] का प्रतिरोधक [[5 V]] से [[100 µF]] के संधारित्र को आवेशित करता है। [[τ = 10 000 × 0.0001 = 1 s]]। [[1 s]] के बाद संधारित्र [[5 × 0.632 = 3.16 V]] पर होता है।"],
q:["What is the time constant of [[2 H]] in series with [[100 Ω]]?","ما الثابت الزمني لملف [[2 H]] على التوالي مع [[100 Ω]]؟","Quelle est la constante de temps de [[2 H]] en série avec [[100 Ω]] ?","¿Cuál es la constante de tiempo de [[2 H]] en serie con [[100 Ω]]?","[[100 Ω]] کے ساتھ سیریز میں [[2 H]] کا ٹائم کانسٹنٹ کیا ہے؟","[[100 Ω]] के साथ श्रेणी में [[2 H]] का समय स्थिरांक क्या है?"],
a:"[[τ = L / R = 2 / 100 = 20 ms]]"},
{f:"Z = R + j(ωL − 1/ωC)   ·   f₀ = 1 / (2π√(L·C))",
x:["In AC steady state every sine wave becomes a phasor with a magnitude and an angle. Inductors and capacitors become reactances that oppose each other. At the resonant frequency they cancel, the impedance equals R and the current is at its maximum.",
"في الحالة المستقرة للتيار المتردد تتحول كل موجة جيبية إلى متجه طوري له مقدار وزاوية. الملفات والمكثفات تصبح مفاعلات متعاكسة. عند تردد الرنين تلغي إحداهما الأخرى، فتساوي المعاوقة R ويبلغ التيار أقصاه.",
"En régime sinusoïdal établi, chaque sinusoïde devient un phaseur doté d’un module et d’un angle. Bobines et condensateurs deviennent des réactances de signes opposés. À la fréquence de résonance elles se compensent : l’impédance vaut R et le courant est maximal.",
"En régimen permanente de alterna, cada senoide se convierte en un fasor con módulo y ángulo. Bobinas y condensadores pasan a ser reactancias que se oponen entre sí. A la frecuencia de resonancia se anulan, la impedancia vale R y la corriente es máxima.",
"AC مستحکم حالت میں ہر سائن ویو ایک فیزر بن جاتی ہے جس کی ایک مقدار اور ایک زاویہ ہوتا ہے۔ انڈکٹر اور کپیسیٹر ایسے ری ایکٹنس بن جاتے ہیں جو ایک دوسرے کی مخالفت کرتے ہیں۔ گمک کی تعدد پر یہ ایک دوسرے کو ختم کر دیتے ہیں، امپیڈنس R کے برابر ہو جاتا ہے اور کرنٹ زیادہ سے زیادہ ہوتا ہے۔",
"AC स्थायी अवस्था में हर ज्या तरंग एक फेज़र बन जाती है, जिसका एक परिमाण और एक कोण होता है। प्रेरक और संधारित्र ऐसे प्रतिघात बन जाते हैं जो एक-दूसरे का विरोध करते हैं। अनुनाद आवृत्ति पर वे एक-दूसरे को निरस्त कर देते हैं, प्रतिबाधा R के बराबर हो जाती है और धारा अधिकतम होती है।"],
e:["[[R = 50 Ω, L = 100 mH, C = 10 µF]]. [[f₀ = 1 / (2π√(0.1 × 0.00001)) = 159.2 Hz]]. With [[12 V]] applied, the current at resonance is [[12 / 50 = 0.24 A]]. Try these values in the RLC analyser under Tools.",
"[[R = 50 Ω, L = 100 mH, C = 10 µF]]. [[f₀ = 1 / (2π√(0.1 × 0.00001)) = 159.2 Hz]]. عند تطبيق [[12 V]] يكون التيار عند الرنين [[12 / 50 = 0.24 A]]. جرّب هذه القيم في محلّل RLC ضمن الأدوات.",
"[[R = 50 Ω, L = 100 mH, C = 10 µF]]. [[f₀ = 1 / (2π√(0.1 × 0.00001)) = 159.2 Hz]]. Sous [[12 V]], le courant à la résonance vaut [[12 / 50 = 0.24 A]]. Essayez ces valeurs dans l’analyseur RLC, dans Outils.",
"[[R = 50 Ω, L = 100 mH, C = 10 µF]]. [[f₀ = 1 / (2π√(0.1 × 0.00001)) = 159.2 Hz]]. Con [[12 V]] aplicados, la corriente en resonancia es [[12 / 50 = 0.24 A]]. Prueba estos valores en el analizador RLC, en Herramientas.",
"[[R = 50 Ω, L = 100 mH, C = 10 µF]]۔ [[f₀ = 1 / (2π√(0.1 × 0.00001)) = 159.2 Hz]]۔ [[12 V]] لگانے پر گمک پر کرنٹ [[12 / 50 = 0.24 A]] ہوتا ہے۔ یہ قدریں ٹولز میں RLC اینالائزر پر آزمائیں۔",
"[[R = 50 Ω, L = 100 mH, C = 10 µF]]। [[f₀ = 1 / (2π√(0.1 × 0.00001)) = 159.2 Hz]]। [[12 V]] लगाने पर अनुनाद पर धारा [[12 / 50 = 0.24 A]] होती है। ये मान टूल में RLC विश्लेषक पर आज़माएँ।"],
q:["Below resonance, does the current lead or lag the voltage in a series RLC circuit?","تحت تردد الرنين، هل يتقدم التيار على الجهد أم يتأخر عنه في دائرة RLC على التوالي؟","En dessous de la résonance, le courant est-il en avance ou en retard sur la tension dans un circuit RLC série ?","Por debajo de la resonancia, ¿la corriente se adelanta o se retrasa respecto a la tensión en un circuito RLC serie?","گمک سے نیچے، سیریز RLC سرکٹ میں کرنٹ وولٹیج سے آگے ہوتا ہے یا پیچھے؟","अनुनाद से नीचे, श्रेणी RLC परिपथ में धारा वोल्टता से आगे होती है या पीछे?"],
a:["It leads. The capacitive reactance is larger, so the circuit behaves capacitively.","يتقدم. المفاعلة السعوية أكبر، فتتصرف الدائرة كدائرة سعوية.","Il est en avance. La réactance capacitive domine, le circuit se comporte donc de façon capacitive.","Se adelanta. La reactancia capacitiva es mayor, así que el circuito se comporta de forma capacitiva.","آگے ہوتا ہے۔ کپیسیٹیو ری ایکٹنس زیادہ ہوتی ہے، اس لیے سرکٹ کپیسیٹیو رویہ دکھاتا ہے۔","आगे होती है। धारितीय प्रतिघात अधिक होता है, इसलिए परिपथ धारितीय व्यवहार करता है।"]}
]};

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const st={lang:store.get("pha_lang")||"en",cur:store.get("pha_cur")||"USD",cycle:"y",year:0,
  rlc:{f:100,R:50,L:100,C:10,V:12},gfrom:"en",gto:null,gq:"",gcourse:"",flash:null};
if(!LANGS.some(l=>l[0]===st.lang))st.lang="en";
if(!PRICES[st.cur])st.cur="USD";
const li=()=>LANGS.findIndex(l=>l[0]===st.lang);
const t=k=>S[k]?S[k][li()]:k;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=(n,c)=>new Intl.NumberFormat("en",{style:"currency",currency:c||st.cur,maximumFractionDigits:0}).format(n);
const gterm=(k,lang)=>{const g=G.find(x=>x[0]===k);return g?g[2][LANGS.findIndex(l=>l[0]===lang)]:k};
const fx=(n,d)=>Number(n).toFixed(d);
const fmt=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="eq" dir="ltr">$1</span>');
const L6=v=>Array.isArray(v)?v[li()]:v;
let done=[];try{const d=JSON.parse(store.get("pha_done")||"[]");if(Array.isArray(d))done=d}catch(e){}

/* ---------- series RLC ---------- */
function rlcCalc(){const b=st.rlc,w=2*Math.PI*b.f,X=w*b.L*1e-3-1/(w*b.C*1e-6),Z=Math.hypot(b.R,X);
  return{Z,phi:Math.atan2(X,b.R),I:b.V/Z,k:b.R/Z,f0:1/(2*Math.PI*Math.sqrt(b.L*1e-3*b.C*1e-6))};}
const deg=r=>(r.phi*180/Math.PI).toFixed(1)+"°";
const amps=i=>i>=1?i.toFixed(2)+" A":(i*1e3).toFixed(1)+" mA";
function drawScope(svg){
  const b=st.rlc,r=rlcCalc();let g="",v="",c="";
  for(let x=44;x<350;x+=34)g+=`M${x} 10V190`;
  for(let y=40;y<190;y+=30)g+=`M10 ${y}H350`;
  for(let n=0;n<=170;n++){const x=10+2*n,th=n/170*4*Math.PI;
    v+=(n?"L":"M")+x+" "+(100-58*Math.sin(th)).toFixed(1);
    c+=(n?"L":"M")+x+" "+(100-58*r.k*Math.sin(th-r.phi)).toFixed(1);}
  svg.innerHTML=`<rect class="scr" x="0" y="0" width="360" height="200"/><path class="grd" d="${g}"/><path class="axis" d="M10 100H350"/>
  <path class="ti" d="${c}"/><path class="tv" d="${v}"/>
  <text class="sv" x="16" y="24">v(t)</text><text class="si" x="50" y="24">i(t)</text>
  <text class="sm" x="344" y="24" text-anchor="end">f = ${b.f} Hz</text>
  <text class="sm" x="16" y="184">φ = ${deg(r)}</text><text class="si" x="344" y="184" text-anchor="end">I = ${amps(r.I)}</text>`;
}
function renderBeam(){
  const r=rlcCalc(),b=st.rlc;
  drawScope($("scope1"));drawScope($("scope2"));
  const cell=(n,v)=>`<div><small>${esc(n)}</small><strong>${v}</strong></div>`;
  const state=`<div class="wide"><small>${esc(t(Math.abs(r.phi)<0.03?"r_res":r.phi>0?"r_lag":"r_lead"))}</small></div>`;
  const z=cell(gterm("imped",st.lang),r.Z.toFixed(1)+" Ω"),p=cell(t("r_phi"),deg(r));
  $("ro1").innerHTML=z+p+state;
  $("ro2").innerHTML=z+p+cell(gterm("current",st.lang),amps(r.I))+cell(t("r_f0"),r.f0.toFixed(1)+" Hz")+state;
  $("h_f").value=b.f;$("t_f").value=b.f;$("t_R").value=b.R;$("t_L").value=b.L;$("t_C").value=b.C;$("t_V").value=b.V;
  $("o_f").textContent=b.f+" Hz";$("o_R").textContent=b.R+" Ω";$("o_L").textContent=b.L+" mH";$("o_C").textContent=b.C+" µF";$("o_V").textContent=b.V+" V";
  $("h_spec").textContent="R "+b.R+" Ω · L "+b.L+" mH · C "+b.C+" µF · "+b.V+" V";
}
[["h_f","f"],["t_f","f"],["t_R","R"],["t_L","L"],["t_C","C"],["t_V","V"]].forEach(([id,k])=>$(id).addEventListener("input",e=>{const v=parseFloat(e.target.value);if(v>0){st.rlc[k]=v;renderBeam()}}));

/* ---------- courses ---------- */
function renderCourses(){
  $("yearchips").innerHTML=[0,1,2,3,4].map(y=>`<button type="button" class="chip" data-y="${y}" aria-pressed="${st.year===y}">${y?esc(t("c_year"))+" "+y:esc(t("c_all"))}</button>`).join("");
  $("courselist").innerHTML=COURSES.filter(c=>!st.year||c[2]===st.year).map(c=>`
   <article class="course" style="--yc:var(--y${c[2]})">
    <div class="top"><span class="code">${c[1]}</span><span class="tag ${c[5]?"":"pro"}">${c[5]?esc(t("c_free")):"Pro"}</span></div>
    <h3>${esc(c[6][li()])}</h3>
    <p class="meta">${esc(t("c_year"))} ${c[2]} · ${c[3]} ${esc(t("c_les"))} · ${c[4]} ${esc(t("c_hrs"))}</p>
    <div class="terms">${G.filter(g=>g[1]===c[0]).map(g=>`<button type="button" data-term="${g[0]}">${esc(g[2][li()])}</button>`).join("")}</div>
    <details ${LESSONS[c[0]]?"open":""}><summary>${esc(t("c_syl"))}${LESSONS[c[0]]?` · <span class="save">${esc(t("l_ready"))}</span>`:""}</summary><ol>${c[7].map((m,i)=>`<li>${LESSONS[c[0]]?`<button type="button" class="lk" data-les="${c[0]}:${i}">${done.includes(c[0]+":"+i)?"✓ ":""}${esc(m[li()])}</button>`:esc(m[li()])}</li>`).join("")}</ol>${LESSONS[c[0]]?`<p class="meta" style="margin-top:8px">${esc(t("l_prog").replace("{n}",done.filter(d=>d.startsWith(c[0]+":")).length))}</p>`:""}</details>
   </article>`).join("");
  $("legend").innerHTML=[1,2,3,4].map(y=>`<span><i style="background:var(--y${y})"></i>${esc(t("c_year"))} ${y}</span>`).join("")+`<span>${esc(t("c_leg"))}</span>`;
}
$("yearchips").addEventListener("click",e=>{const b=e.target.closest("[data-y]");if(b){st.year=+b.dataset.y;renderCourses()}});
$("courselist").addEventListener("click",e=>{const b=e.target.closest("[data-term]");if(!b)return;
  st.gq="";st.gcourse="";st.flash=b.dataset.term;location.hash="glossary";renderGloss();
  const row=document.querySelector('[data-row="'+st.flash+'"]');if(row)row.scrollIntoView({block:"center"});});

/* ---------- lessons ---------- */
let curLes=null;
function doneBtn(){const on=done.includes(curLes);$("les_done").textContent=t(on?"l_undo":"l_done");$("les_done").classList.toggle("primary",!on)}
function openLesson(key){
  const [id,i]=key.split(":"),c=COURSES.find(c=>c[0]===id),L=LESSONS[id][+i];curLes=key;
  $("les_code").textContent=c[1]+" · "+(+i+1)+" / "+LESSONS[id].length;
  $("les_t").textContent=c[7][+i][li()];
  $("les_x").innerHTML=fmt(L6(L.x));$("les_f").textContent=L.f;
  $("les_e").innerHTML=fmt(L6(L.e));$("les_q").innerHTML=fmt(L6(L.q));$("les_a").innerHTML=fmt(L6(L.a));
  $("les_d").open=false;doneBtn();
  const d=$("les");if(d.showModal)d.showModal();else d.setAttribute("open","");d.scrollTop=0;
}
$("courselist").addEventListener("click",e=>{const b=e.target.closest("[data-les]");if(b)openLesson(b.dataset.les)});
$("les_done").addEventListener("click",()=>{done=done.includes(curLes)?done.filter(d=>d!==curLes):done.concat(curLes);store.set("pha_done",JSON.stringify(done));doneBtn();renderCourses()});
$("les_close").addEventListener("click",()=>{const d=$("les");if(d.close)d.close();else d.removeAttribute("open")});

/* ---------- AI tutor ---------- */
let ask=null,aiState="wait",aiBusy=false;
function aiUI(){$("ai_go").disabled=aiState!=="on"||aiBusy;$("ai_q").disabled=aiState==="off";$("ai_note").textContent=t(aiState==="off"?"ai_off":"ai_note")}
(async()=>{try{ask=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){ask=null}aiState=ask?"on":"off";aiUI()})();
$("ai_go").addEventListener("click",async()=>{
  const q=$("ai_q").value.trim();if(!q||!ask||aiBusy)return;
  const out=$("ai_out");aiBusy=true;aiUI();out.hidden=false;out.textContent=t("ai_wait");
  const prompt="You are a patient tutor for undergraduate electrical engineering students. Answer in "+LANGS[li()][1]+" (language code "+st.lang+"). Be accurate and concise, at most 180 words. Give the key formula and numbered calculation steps where they help. Plain text only: no Markdown and no LaTeX; write symbols such as Ω, µ, √ and π directly. If the question is not about electrical engineering, mathematics or physics, say briefly that you only help with those subjects.\n\nStudent question:\n"+q;
  try{const r=await ask(prompt,{cache:false,onText:({text})=>{if(text)out.textContent=text}});out.textContent=r.text||t("ai_err")}
  catch(e){if(e&&e.code==="not_granted")aiState="off";out.textContent=t("ai_err")}
  aiBusy=false;aiUI();
});

/* ---------- tools ---------- */
const qname=k=>S[k]?t(k):gterm(k,st.lang);
function renderTools(){
  document.querySelectorAll("[data-g]").forEach(e=>e.textContent=gterm(e.dataset.g,st.lang));
  const cat=$("u_cat").value||"resistance";
  $("u_cat").innerHTML=Object.keys(UNITS).map(k=>`<option value="${k}" ${k===cat?"selected":""}>${esc(qname(k))}</option>`).join("");
  fillUnits(false);aiUI();
  $("formulas").innerHTML=FORMULAS.map(f=>`<div><span>${esc(gterm(f[0],st.lang))}</span><code>${esc(f[1])}</code></div>`).join("");
}
function fillUnits(reset){
  const u=Object.keys(UNITS[$("u_cat").value]),f=reset?u[0]:($("u_from").value||u[1]),o=reset?u[1]:($("u_to").value||u[0]);
  $("u_from").innerHTML=u.map(x=>`<option ${x===f?"selected":""}>${x}</option>`).join("");
  $("u_to").innerHTML=u.map(x=>`<option ${x===o?"selected":""}>${x}</option>`).join("");
  convert();
}
function convert(){
  const m=UNITS[$("u_cat").value],v=parseFloat($("u_val").value),f=$("u_from").value,o=$("u_to").value;
  if(!isFinite(v)){$("u_out").textContent="–";return}
  const r=v*m[f]/m[o];
  $("u_out").textContent=v+" "+f+" = "+(Math.abs(r)>=1e6||(Math.abs(r)<1e-3&&r!==0)?r.toExponential(4):+r.toPrecision(6))+" "+o;
}
$("u_cat").addEventListener("change",()=>fillUnits(true));
["u_val","u_from","u_to"].forEach(id=>$(id).addEventListener("input",convert));

/* ---------- glossary ---------- */
function renderGloss(){
  if(!st.gto||st.gto===st.gfrom)st.gto=st.lang!==st.gfrom?st.lang:(st.gfrom==="ar"?"en":"ar");
  const opts=sel=>LANGS.map(l=>`<option value="${l[0]}" ${l[0]===sel?"selected":""}>${l[1]}</option>`).join("");
  $("g_from").innerHTML=opts(st.gfrom);$("g_to").innerHTML=opts(st.gto);
  $("g_course").innerHTML=`<option value="">${esc(t("c_all"))}</option>`+COURSES.map(c=>`<option value="${c[0]}" ${c[0]===st.gcourse?"selected":""}>${esc(c[6][li()])}</option>`).join("");
  if($("g_q").value!==st.gq)$("g_q").value=st.gq;
  const a=LANGS.findIndex(l=>l[0]===st.gfrom),b=LANGS.findIndex(l=>l[0]===st.gto),q=st.gq.trim().toLowerCase();
  const dir=l=>RTL.includes(l)?"rtl":"ltr";
  const rows=G.filter(g=>(!st.gcourse||g[1]===st.gcourse)&&(!q||g[2].some(x=>x.toLowerCase().includes(q))));
  $("glist").innerHTML=rows.length?rows.map(g=>{const c=COURSES.find(c=>c[0]===g[1]);
    return `<div class="r ${g[0]===st.flash?"flash":""}" data-row="${g[0]}"><span lang="${st.gfrom}" dir="${dir(st.gfrom)}">${esc(g[2][a])}</span><span lang="${st.gto}" dir="${dir(st.gto)}">${esc(g[2][b])}</span><small>${c[1]} · ${esc(c[6][li()])}</small></div>`}).join("")
   :`<div class="r"><small>${esc(t("g_none"))}</small></div>`;
}
$("g_from").addEventListener("change",e=>{st.gfrom=e.target.value;if(st.gto===st.gfrom)st.gto=null;renderGloss()});
$("g_to").addEventListener("change",e=>{st.gto=e.target.value;if(st.gto===st.gfrom)st.gfrom=st.gto==="en"?"ar":"en";renderGloss()});
$("g_q").addEventListener("input",e=>{st.gq=e.target.value;st.flash=null;renderGloss()});
$("g_course").addEventListener("change",e=>{st.gcourse=e.target.value;renderGloss()});

/* ---------- pricing ---------- */
function renderPricing(){
  const P=PRICES[st.cur],y=st.cycle==="y";
  $("cur").innerHTML=Object.keys(PRICES).map(c=>`<option ${c===st.cur?"selected":""}>${c}</option>`).join("");
  document.querySelectorAll("#cycle button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===st.cycle));
  const card=(id,desc)=>{
    const free=id==="free",p=free?0:P[id][y?1:0],sv=free?0:Math.round((1-P[id][1]/P[id][0])*100);
    return `<div class="plan ${id==="pro"?"pop":""}">${id==="pro"?`<span class="badge">${esc(t("p_pop"))}</span>`:""}
     <div class="name">${PLAN_NAMES[id]}</div><p class="muted">${esc(t(desc))}</p>
     <div class="price">${money(p)} <small>${esc(t("p_per"))}</small></div>
     <p class="meta" style="min-height:2.6em">${free?"":y?esc(t("p_bill").replace("{x}",money(p*12)))+` · <span class="save">${esc(t("p_save").replace("{n}",sv))}</span>`:`<span class="save">${esc(t("p_y"))}: ${esc(t("p_save").replace("{n}",sv))}</span>`}</p>
     ${free?`<a class="btn" href="#courses">${esc(t("p_start"))}</a>`:`<button type="button" class="btn ${id==="pro"?"primary":""}" data-plan="${id}">${esc(t("p_choose"))}</button>`}
    </div>`};
  $("plans").innerHTML=card("free","d_free")+card("pro","d_pro")+card("plus","d_plus");
  const cellv=v=>v==="u"?`<td class="y">${esc(t("f_unl"))}</td>`:v===1?'<td class="y">✓</td>':v===0?'<td class="n">–</td>':`<td class="mono">${v}</td>`;
  $("cmp").innerHTML=`<thead><tr><th>${esc(t("p_feat"))}</th><th>Starter</th><th>Pro</th><th>Pro Plus</th></tr></thead><tbody>`+
    ROWS.map(r=>`<tr><td>${esc(t(r[0]))}</td>${cellv(r[1])}${cellv(r[2])}${cellv(r[3])}</tr>`).join("")+"</tbody>";
  $("cp_list").innerHTML=["cp_1","cp_2","cp_3"].map(k=>`<li>${esc(t(k))}</li>`).join("");
  const n=+$("seats").value;$("o_seats").textContent=n;
  $("cp_out").innerHTML=`<div><small>${esc(t("cp_per"))}</small><strong>${money(P.campus)}</strong></div><div><small>${esc(t("cp_tot"))}</small><strong>${money(P.campus*n*12)}</strong></div>`;
  $("faq").innerHTML=[1,2,3].map(i=>`<details><summary>${esc(t("q"+i))}</summary><p>${esc(t("a"+i))}</p></details>`).join("");
}
$("cycle").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b){st.cycle=b.dataset.c;renderPricing()}});
$("cur").addEventListener("change",e=>{st.cur=e.target.value;store.set("pha_cur",st.cur);renderPricing()});
$("seats").addEventListener("input",renderPricing);
$("plans").addEventListener("click",e=>{const b=e.target.closest("[data-plan]");if(!b)return;
  const id=b.dataset.plan,y=st.cycle==="y",p=PRICES[st.cur][id][y?1:0],after=y?money(p*12)+" / "+t("p_y"):money(p)+" / "+t("p_m");
  $("co").innerHTML=`<dt>${esc(t("co_plan"))}</dt><dd>${PLAN_NAMES[id]}</dd><dt>${esc(t("co_bill"))}</dt><dd>${esc(t(y?"p_y":"p_m"))}</dd><dt>${esc(t("co_today"))}</dt><dd>${money(0)}</dd><dt>${esc(t("co_after"))}</dt><dd>${esc(after)}</dd>`;
  const d=$("dlg");if(d.showModal)d.showModal();else d.setAttribute("open","");});
$("dlg_x").addEventListener("click",()=>{const d=$("dlg");if(d.close)d.close();else d.removeAttribute("open")});

/* ---------- shell ---------- */
function route(){
  const h=(location.hash||"#home").slice(1),v=VIEWS.some(x=>x[0]===h)?h:"home";
  document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("[data-nav]").forEach(a=>{if(a.dataset.nav===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(!st.flash)window.scrollTo(0,0);
}
function renderAll(){
  document.documentElement.lang=st.lang;document.documentElement.dir=RTL.includes(st.lang)?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("topnav").innerHTML=VIEWS.map(v=>`<a href="#${v[0]}" data-nav="${v[0]}">${esc(t(v[1]))}</a>`).join("");
  $("tabs").innerHTML=VIEWS.map(v=>`<a href="#${v[0]}" data-nav="${v[0]}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${v[2]}"/></svg><span>${esc(t(v[1]))}</span></a>`).join("");
  renderBeam();renderCourses();renderTools();renderGloss();renderPricing();route();
}
$("lang").innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join("");
$("lang").value=st.lang;
$("lang").addEventListener("change",e=>{st.lang=e.target.value;store.set("pha_lang",st.lang);st.gto=null;renderAll()});
window.addEventListener("hashchange",()=>{route();st.flash=null});
renderAll();
</script>
