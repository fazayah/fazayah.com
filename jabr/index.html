<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jabr Math Academy</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout idea: a student's graph-paper notebook. Ink on cool paper, one yellow highlighter, formulas set in the STIX math face. */
:root{
  --paper:#F2F4F9; --surface:#FFFFFF; --ink:#131B33; --muted:#566080; --line:#D3D9E8;
  --mark:#FFD84A; --mark-ink:#131B33; --pen:#2742C4; --good:#17794B; --bad:#B8322F;
  --display:"STIX Two Text","IBM Plex Sans Arabic","Noto Naskh Arabic","Noto Sans Devanagari",Georgia,serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic","Noto Naskh Arabic","Noto Sans Devanagari",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1322; --surface:#171F38; --ink:#E8EBF5; --muted:#9BA5C4; --line:#2A3457;
    --mark:#E9BC25; --pen:#93A7FF; --good:#56C492; --bad:#F08A85; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1322; --surface:#171F38; --ink:#E8EBF5; --muted:#9BA5C4; --line:#2A3457;
  --mark:#E9BC25; --pen:#93A7FF; --good:#56C492; --bad:#F08A85; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);padding-bottom:76px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,6vw,3rem)}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
p{margin:0}
a{color:inherit}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1040px;margin:0 auto}
.brand{font:italic 500 1.6rem/1 var(--display);text-decoration:none;padding:2px 6px;background:linear-gradient(transparent 58%,var(--mark) 58%)}
[data-theme="dark"] .brand,.brand{color:var(--ink)}
.top .sp{flex:1}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.badge{font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.pro{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
#nav{position:fixed;inset-inline:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
#nav a{text-decoration:none;text-align:center;padding:10px 2px 12px;font-size:.72rem;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav a i{font:normal 500 1.25rem/1 var(--display)}
#nav a[aria-current]{color:var(--ink)}
#nav a[aria-current] i{background:linear-gradient(transparent 55%,var(--mark) 55%)}
main{max-width:1040px;margin:0 auto;padding:8px 16px 32px;display:flex;flex-direction:column;gap:28px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.hero{display:grid;gap:22px;align-items:center}
.hero .txt{display:flex;flex-direction:column;gap:14px}
.hero p{max-width:56ch;color:var(--muted);font-size:1.05rem}
.plot{margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;direction:ltr;
  background-color:var(--surface);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:20px 20px}
.plot svg{display:block;width:100%;height:auto}
.plot text{font:italic 500 15px var(--display);fill:var(--ink)}
.plot .curve{fill:none;stroke:var(--pen);stroke-width:3;stroke-linecap:round;stroke-dasharray:620;animation:draw 1.6s ease-out}
@keyframes draw{from{stroke-dashoffset:620}}
@media (prefers-reduced-motion:reduce){.plot .curve{animation:none}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.course{display:flex;flex-direction:column;gap:8px;text-decoration:none}
.course:hover{border-color:var(--ink)}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--pen)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}
.bar b{display:block;height:100%;background:var(--pen)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;min-height:40px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list a{display:flex;align-items:center;gap:12px;text-decoration:none;padding:14px}
.list .n{font:500 1.3rem/1 var(--display);width:1.6em;flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.list .ti{flex:1;font-weight:500}
.ok{color:var(--good);font-weight:600}
.lesson{display:flex;flex-direction:column;gap:18px;max-width:70ch}
.lesson .body{font-size:1.05rem}
.steps{margin:0;padding:14px 16px;list-style:none;border-inline-start:4px solid var(--mark);background:var(--surface);border-radius:0 10px 10px 0;display:flex;flex-direction:column;gap:6px;font:500 1.1rem/1.5 var(--display);overflow-x:auto}
.opts{display:grid;gap:8px}
.opt{text-align:start;min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:500 1.05rem var(--display)}
.opt.good{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt.bad{border-color:var(--bad);color:var(--bad)}
.msg.good{color:var(--good);font-weight:600}
.msg.bad{color:var(--bad);font-weight:600}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:transparent;padding:9px 16px;min-height:40px;cursor:pointer;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--surface)}
.bub.u{align-self:flex-end;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bub.a{align-self:flex-start}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;min-height:48px;max-height:160px;resize:vertical;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.plans{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.plan{display:flex;flex-direction:column;gap:12px}
.plan.hi{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.price{font:600 2.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.price small{font:400 .9rem var(--body);color:var(--muted)}
.feat{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.feat li::before{content:"✓";color:var(--good);font-weight:700;margin-inline-end:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font:600 2rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.cert{border:2px solid var(--ink);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.cert h2{background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 6px}
.fx{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx span:last-child{font:500 1.1rem var(--display);direction:ltr}
.news{display:flex;flex-direction:column;gap:6px}
.note{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:.9rem}
#modal{position:fixed;inset:0;z-index:10;background:rgba(10,14,30,.55);display:none;align-items:flex-end;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.pill{position:fixed;top:10px;inset-inline-end:50%;transform:translateX(50%);z-index:9;background:var(--ink);color:var(--paper);padding:5px 12px;border-radius:99px;font-size:.8rem}
[dir="rtl"] .pill{transform:translateX(-50%)}
@media (min-width:760px){
  body{padding-bottom:0}
  #nav{position:static;display:flex;gap:4px;border:0;background:transparent}
  #nav a{flex-direction:row;gap:6px;padding:8px 12px;font-size:.95rem;border-radius:8px}
  #nav a i{font-size:1.05rem}
  .hero{grid-template-columns:1.1fr .9fr}
  #modal{align-items:center}
  .opts{grid-template-columns:1fr 1fr}
}
</style>
</head>

function tr(s){

  const k=st.lang+'|'+s;
  if(st.trc[k])return st.trc[k];
  if(!tFail[st.lang])pend.add(s);
  return s;
}
async function flushTr(){
  if(tBusy||!sample||!pend.size||tFail[st.lang])return;
  tBusy=true;const lang=st.lang,list=[...pend].slice(0,25);showPill();
  try{
    let out=await sample.json('Translate each string in this JSON array into '+LNAME[lang]+' for a mathematics learning app. Keep numbers, symbols and mathematical notation unchanged. Return only a JSON array of '+list.length+' strings in the same order.\n'+JSON.stringify(list),{modelTier:'quick'});
    if(typeof out==='string')out=JSON.parse(out);
    if(!Array.isArray(out)||out.length!==list.length)throw 0;
    list.forEach((s,i)=>{st.trc[lang+'|'+s]=String(out[i]);pend.delete(s)});save();
  }catch(e){tFail[lang]=true;pend.clear();if(e&&e.code==='not_granted')sample=null}
  tBusy=false;render();
}

  return `<div><a class="btn ghost" href="#courses">← ${esc(t('back'))}</a></div><div><span class="tag">${esc(t(c.lv))}</span><h1>${esc(tr(c.t))}</h1><p class="muted">${esc(tr(c.d))}</p></div><ol class="list">${rows}</ol>${doneCount(c)===c.ls.length?`<section class="card cert"><span class="tag">Jabr</span><h2>${esc(t('cert'))}</h2><h3>${esc(tr(c.t))}</h3><p class="muted">${esc(t('certText'))}</p></section>`:''}`;
}
function lessonData(c,i){
  if(i===0){const L=c.f;return{title:tr(c.ls[0]),body:tr(L.body),ex:L.ex.map(tr),q:tr(L.q),opts:L.opts.map(tr),a:L.a}}
  return st.gen[st.lang+'|'+c.id+'|'+i]||null;
}
async function genLesson(c,i){
  const k=st.lang+'|'+c.id+'|'+i;if(genBusy[k]||!sample)return;genBusy[k]=true;
  try{
    let o=await sample.json(`Write one lesson for a mathematics course in a learning app.\nCourse: ${c.t} (level: ${S[c.lv][0]}). Lesson ${i+1} of ${c.ls.length}: "${c.ls[i]}". Earlier lessons: ${c.ls.slice(0,i).join('; ')}.\nWrite everything in ${LNAME[st.lang]}.\nReturn only a JSON object: {"title": string, "body": string of 70 to 120 words that explains the idea clearly, "ex": array of 3 to 5 short strings that form one worked example with one step per string, "q": one multiple-choice question, "opts": array of exactly 4 short answer strings, "a": index 0-3 of the correct option}.\nUse plain Unicode mathematics (x², √, ∫, π, ≤). No LaTeX and no Markdown. Make sure the answer marked correct is mathematically correct.`,{cache:false});
    if(typeof o==='string')o=JSON.parse(o);
    if(!o||!o.body||!Array.isArray(o.ex)||!Array.isArray(o.opts)||o.opts.length!==4||!(o.a>=0&&o.a<4))throw 0;
    st.gen[k]={title:String(o.title||c.ls[i]),body:String(o.body),ex:o.ex.map(String),q:String(o.q),opts:o.opts.map(String),a:+o.a};save();
  }catch(e){genFail[k]=true;if(e&&e.code==='not_granted')sample=null}
  genBusy[k]=false;render();
}
function vLesson(c,i){
  const head=`<div><a class="btn ghost" href="#c-${c.id}">← ${esc(tr(c.t))}</a></div>`;
  if(i>=c.ls.length)return head;
  if(i>0&&!isPro())return head+`<div class="card lesson"><span class="tag">${esc(t('lesson'))} ${i+1}</span><h2>${esc(tr(c.ls[i]))}</h2><p>${esc(t('locked'))}</p><div><a class="btn" href="#plans">${esc(t('upgrade'))}</a></div></div>`;
  const k=st.lang+'|'+c.id+'|'+i,L=lessonData(c,i);
  if(!L){
    let m;
    if(!sampleReady)m=`<p class="muted">${esc(t('writing'))}</p>`;
    else if(!sample)m=`<p class="muted">${esc(t('aiOff'))}</p>`;
    else if(genFail[k])m=`<p class="msg bad">${esc(t('fail'))}</p><div><button class="btn" data-act="regen">${esc(t('retry'))}</button></div>`;
    else{m=`<p class="muted">${esc(t('writing'))}</p>`;setTimeout(()=>genLesson(c,i),0)}
    return head+`<div class="lesson"><span class="tag">${esc(t('lesson'))} ${i+1}</span><h1>${esc(tr(c.ls[i]))}</h1>${m}</div>`;
  }
  const qk=c.id+'-'+i;if(!quiz||quiz.k!==qk)quiz={k:qk,bad:[],ok:!!st.done[qk]};
  const opts=L.opts.map((o,j)=>`<button class="opt ${quiz.ok&&j===L.a?'good':quiz.bad.includes(j)?'bad':''}" dir="auto" data-act="pick" data-v="${j}" ${quiz.ok?'disabled':''}>${esc(o)}</button>`).join('');
  const msg=quiz.ok?`<p class="msg good">${esc(t('right'))}</p>`:quiz.bad.length?`<p class="msg bad">${esc(t('wrong'))}</p>`:'';
  const nx=i+1<c.ls.length?`<a class="btn" href="#l-${c.id}-${i+1}">${esc(t('next'))} →</a>`:'';
  return head+`<article class="lesson"><div><span class="tag">${esc(t('lesson'))} ${i+1} / ${c.ls.length}</span><h1>${esc(L.title)}</h1></div>
  <p class="body" dir="auto">${esc(L.body)}</p>
  <div><h3>${esc(t('ex'))}</h3></div><ol class="steps">${L.ex.map(x=>`<li dir="auto">${esc(x)}</li>`).join('')}</ol>
  <div><h3>${esc(t('quiz'))}</h3><p dir="auto">${esc(L.q)}</p></div><div class="opts">${opts}</div>${msg}
  <div class="row">${nx}<button class="btn ghost" data-act="asklesson">${esc(t('askLesson'))}</button></div></article>`;
}
function vTutor(){
  let h=`<div><h1>${esc(t('tutor'))}</h1><p class="muted">${esc(t('tutorHint'))}</p></div>
  <div><div class="tabs"><button data-act="tab" data-v="chat" aria-pressed="${ttab==='chat'}">${esc(t('chat'))}</button><button data-act="tab" data-v="practice" aria-pressed="${ttab==='practice'}">${esc(t('practice'))}</button></div></div>`;
  if(sampleReady&&!sample)return h+`<p class="note">${esc(t('aiOff'))}</p>`;
  if(ttab==='chat'){
    const left=qLeft(),out=!isPro()&&left<=0;
    if(ctx)h+=`<div><span class="badge">${esc(ctx)}</span></div>`;
    h+=`<div class="chat" id="chat">${chat.map((m,i)=>`<div class="bub ${m.role==='user'?'u':'a'}" dir="auto" ${busy&&i===chat.length-1?'id="live"':''}>${esc(m.content||'…')}</div>`).join('')}</div>`;
    if(out)h+=`<p class="note">${esc(t('limit'))}</p><div><a class="btn" href="#plans">${esc(t('upgrade'))}</a></div>`;
    else h+=`<form class="ask" id="askf"><textarea id="q" rows="1" dir="auto" placeholder="${esc(t('ph'))}" aria-label="${esc(t('ph'))}">${esc(draft)}</textarea><button class="btn" ${busy||!sampleReady?'disabled':''}>${esc(t('send'))}</button></form>`+(isPro()?'':`<p class="small muted">${left} ${esc(t('left'))}</p>`);
  }else{
    if(!isPro())return h+`<p class="note">${esc(t('proOnly'))}</p><div><a class="btn" href="#plans">${esc(t('upgrade'))}</a></div>`;
    h+=`<div class="row"><select id="prc" aria-label="${esc(t('courses'))}">${C.map(c=>`<option value="${c.id}" ${pr.cid===c.id?'selected':''}>${esc(tr(c.t))}</option>`).join('')}</select><button class="btn" data-act="gen" ${prBusy||!sampleReady?'disabled':''}>${esc(prBusy?'…':t('gen'))}</button></div>`;
    if(prFail)h+=`<p class="msg bad">${esc(t('fail'))}</p>`;
    if(pr.items)h+=pr.items.map((it,n)=>{const p=pr.picked[n];return `<div class="card lesson"><p dir="auto"><b>${n+1}.</b> ${esc(it.q)}</p><div class="opts">${it.opts.map((o,j)=>`<button class="opt ${p!==undefined&&j===it.a?'good':p===j?'bad':''}" dir="auto" data-act="ppick" data-n="${n}" data-v="${j}" ${p!==undefined?'disabled':''}>${esc(o)}</button>`).join('')}</div>${p!==undefined?`<p class="small muted" dir="auto">${esc(it.why||'')}</p>`:''}</div>`}).join('');
  }
  return h;
}
function vNews(){
  return `<h1>${esc(t('news'))}</h1>`+NEWS.map(n=>`<article class="card news"><span class="tag">${esc(new Date(n[0]+'T12:00:00').toLocaleDateString(st.lang,{year:'numeric',month:'long',day:'numeric'}))}</span><h3>${esc(tr(n[1]))}</h3><p class="muted" dir="auto">${esc(tr(n[2]))}</p></article>`).join('');
}
function vFormulas(){
  return `<div><a class="btn ghost" href="#home">← ${esc(t('back'))}</a></div><h1>${esc(t('formulas'))}</h1>`+LV.map(l=>`<section class="card"><span class="tag">${esc(t(l))}</span>${FX[l].map(f=>`<div class="fx"><span>${esc(tr(f[0]))}</span><span>${esc(f[1])}</span></div>`).join('')}</section>`).join('');
}
function vPlans(){
  const y=st.bill==='y',price=y?PRICE.y:PRICE.m;
  return `<h1>${esc(t('plansTitle'))}</h1><p class="note">${esc(t('launch'))}</p>
  <div class="row"><div class="tabs"><button data-act="bill" data-v="m" aria-pressed="${!y}">${esc(t('monthly'))}</button><button data-act="bill" data-v="y" aria-pressed="${y}">${esc(t('yearly'))}</button></div>${y?`<span class="badge pro">${esc(t('save33'))}</span>`:''}</div>
  <section class="plans">
  <div class="card plan hi"><h2>${esc(t('free'))}</h2><div class="price">$0</div><ul class="feat"><li>${esc(t('p1'))}</li><li>${esc(t('tutor'))}</li><li>${esc(t('f3'))}</li></ul><div><span class="badge">${esc(t('current'))}</span></div></div>
  <div class="card plan"><h2>Pro</h2><div class="price">$${price} <small>${esc(t(y?'perY':'perM'))}</small></div><ul class="feat"><li>${esc(t('p2'))}</li><li>${esc(t('p3'))}</li></ul><div><span class="badge pro">${esc(t('soon'))}</span></div></div>
  </section>`;
}
function openCheckout(){
  const y=st.bill==='y';
  $('modal').innerHTML=`<div class="card"><h2>${esc(t('checkout'))}</h2><div class="row" style="justify-content:space-between"><span>Jabr Pro · ${esc(t(y?'yearly':'monthly'))}</span><b>$${y?PRICE.y:PRICE.m} ${esc(t(y?'perY':'perM'))}</b></div><p class="note">${esc(t('demo'))}</p><div class="row"><button class="btn" data-act="confirm" id="cf">${esc(t('confirm'))}</button><button class="btn ghost" data-act="cancel">${esc(t('cancel'))}</button></div></div>`;
  $('modal').classList.add('on');$('cf').focus();
}
function closeModal(){$('modal').classList.remove('on');$('modal').innerHTML=''}

function render(){
  const r=route(),aid=document.activeElement&&document.activeElement.id;
  document.documentElement.lang=st.lang;document.documentElement.dir=(st.lang==='ar'||st.lang==='ur')?'rtl':'ltr';
  const tabs=[['home','⌂'],['courses','∑'],['tutor','∫'],['plans','π'],['news','Δ']];
  const cur=r.v==='course'||r.v==='lesson'?'courses':r.v;
  $('nav').innerHTML=tabs.map(([k,ic])=>`<a href="#${k}" ${cur===k?'aria-current="page"':''}><i>${ic}</i>${esc(t(k))}</a>`).join('');
  if(r.v==='lesson'&&(r.i===0||isPro())){st.last={c:r.c.id,i:r.i};save()}
  $('app').innerHTML=r.v==='home'?vHome():r.v==='courses'?vCourses():r.v==='course'?vCourse(r.c):r.v==='lesson'?vLesson(r.c,r.i):r.v==='tutor'?vTutor():r.v==='news'?vNews():r.v==='formulas'?vFormulas():vPlans();
  if(aid&&$(aid)&&aid!=='lang'){$(aid).focus();if(aid==='q'){const q=$('q');q.selectionStart=q.selectionEnd=q.value.length}}
  showPill();setTimeout(flushTr,0);
}

async function send(text){
  text=text.trim();if(!text||busy||!sample)return;
  if(!isPro()){if(qLeft()<=0){render();return}st.tq.n++;save()}
  chat.push({role:'user',content:text},{role:'assistant',content:''});draft='';busy=true;render();
  const sys=`You are a patient mathematics tutor inside the Jabr learning app. Reply in ${LNAME[st.lang]}. Explain step by step in short lines. Use plain text with Unicode mathematics (x², √, ∫, π, ≤). No LaTeX and no Markdown. Finish with one short question that checks understanding.`+(ctx?` The student is studying: ${ctx}.`:'');
  const msgs=chat.slice(0,-1).slice(-11).map(m=>({role:m.role,content:m.content}));
  msgs[0]={role:'user',content:sys+'\n\nStudent: '+msgs[0].content};
  const last=chat[chat.length-1];
  try{
    const r=await sample(msgs,{cache:false,onText:({text})=>{const el=$('live');if(el){el.textContent=text;el.scrollIntoView({block:'end'})}}});
    last.content=r.text;
  }catch(e){last.content=(e&&e.text)||t('fail');if(e&&e.code==='not_granted')sample=null}
  busy=false;render();
}
async function genPractice(){
  const c=course(pr.cid);if(!sample||prBusy)return;prBusy=true;prFail=false;render();
  try{
    let o=await sample.json(`Write 3 multiple-choice practice problems of increasing difficulty for the course "${c.t}" (level: ${S[c.lv][0]}; topics: ${c.ls.join('; ')}). Write in ${LNAME[st.lang]}.\nReturn only a JSON array of 3 objects: {"q": string, "opts": array of exactly 4 short strings, "a": index 0-3 of the correct option, "why": one sentence that explains the answer}.\nUse plain Unicode mathematics. No LaTeX and no Markdown. Check that each marked answer is correct.`,{cache:false});
    if(typeof o==='string')o=JSON.parse(o);
    if(!Array.isArray(o)||!o.length||o.some(x=>!x||!Array.isArray(x.opts)||!(x.a>=0&&x.a<4)))throw 0;
    pr.items=o;pr.picked={};
  }catch(e){prFail=true;if(e&&e.code==='not_granted')sample=null}
  prBusy=false;render();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v,r=route();
  if(a==='lvl'){filter=v;if(r.v==='courses')render()}
  else if(a==='pick'&&r.v==='lesson'){const L=lessonData(r.c,r.i);if(+v===L.a){quiz.ok=true;st.done[quiz.k]=1;bump();save()}else if(!quiz.bad.includes(+v))quiz.bad.push(+v);render()}
  else if(a==='regen'){genFail[st.lang+'|'+r.c.id+'|'+r.i]=false;render()}
  else if(a==='asklesson'){ctx=r.c.t+' — '+r.c.ls[r.i];ttab='chat';location.hash='#tutor'}
  else if(a==='tab'){ttab=v;render()}
  else if(a==='bill'){st.bill=v;save();render()}
  else if(a==='checkout')openCheckout();
  else if(a==='confirm'){st.plan='pro';save();closeModal();render()}
  else if(a==='cancel')closeModal();
  else if(a==='tofree'){st.plan='free';save();render()}
  else if(a==='gen')genPractice();
  else if(a==='ppick'){pr.picked[+el.dataset.n]=+v;render()}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='askf')send($('q').value)});
document.addEventListener('input',e=>{if(e.target.id==='q')draft=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e.target.value)}if(e.key==='Escape')closeModal()});
document.addEventListener('change',e=>{
  if(e.target.id==='lang'){st.lang=e.target.value;pend.clear();save();render()}
  if(e.target.id==='prc')pr.cid=e.target.value;
});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
$('lang').innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join('');$('lang').value=st.lang;
render();
(async()=>{try{sample=(await window.claude?.use?.('sample'))||null}catch(e){sample=null}sampleReady=true;render()})();
</script>
</body>
</html>
